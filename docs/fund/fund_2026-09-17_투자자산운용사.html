<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자자산운용사 문제은행 2026-09-17</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --sub:#64748b;
    --brand:#1d4ed8; --brand-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
    --no:#dc2626; --no-soft:#fef2f2; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.65;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header.top{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;border-radius:16px;
    padding:26px 22px;margin-bottom:22px;box-shadow:0 6px 20px rgba(29,78,216,.18);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;}
  header.top p{margin:2px 0;font-size:.9rem;opacity:.95;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 24px;}
  .stat{flex:1 1 120px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:center;}
  .stat b{display:block;font-size:1.3rem;color:var(--brand);}
  .stat span{font-size:.78rem;color:var(--sub);}
  section.unit{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:0 0 8px;margin-bottom:26px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.04);}
  .unit-head{background:var(--brand-soft);border-bottom:2px solid #bfdbfe;padding:14px 18px;}
  .unit-head h2{margin:0;font-size:1.12rem;font-weight:800;color:#1e3a8a;}
  .unit-head small{color:var(--sub);font-weight:600;}
  .q{padding:18px;border-bottom:1px dashed var(--line);}
  .q:last-child{border-bottom:none;}
  .q-title{font-weight:700;margin:0 0 12px;font-size:1rem;}
  .q-title .num{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;
    padding:1px 8px;font-size:.8rem;margin-right:8px;}
  ul.choices{list-style:none;margin:0;padding:0;}
  ul.choices li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;
    cursor:pointer;background:#fbfdff;transition:.15s;font-size:.95rem;}
  ul.choices li:hover{border-color:var(--brand);background:#f0f7ff;}
  ul.choices li .mark{float:right;font-weight:800;}
  li.correct{background:var(--ok-soft);border-color:var(--ok);color:#065f46;font-weight:600;}
  li.wrong{background:var(--no-soft);border-color:var(--no);color:#991b1b;font-weight:600;}
  li.locked{cursor:default;}
  .btn{margin-top:6px;background:#fff;border:1.5px solid var(--brand);color:var(--brand);
    border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.9rem;}
  .btn:hover{background:var(--brand);color:#fff;}
  .ans-box{display:none;margin-top:12px;border:1.5px solid #cbd5e1;border-left:6px solid var(--brand);
    border-radius:10px;background:#f8fafc;padding:14px;}
  .ans-box.show{display:block;}
  .verdict{font-weight:800;margin-bottom:8px;font-size:.95rem;}
  .verdict.ok{color:var(--ok);} .verdict.no{color:var(--no);}
  .ans-line{font-weight:800;color:#1e3a8a;margin-bottom:8px;}
  .exp{font-size:.9rem;color:#334155;}
  .exp .each{margin-top:8px;padding-top:8px;border-top:1px dotted #cbd5e1;}
  .exp .each div{margin:3px 0;}
  .tip{margin-top:10px;background:#fffbeb;border:1px solid #fcd34d;border-left:6px solid #f59e0b;
    border-radius:10px;padding:11px 13px;font-size:.88rem;color:#7c2d12;}
  .tip b{display:block;color:#92400e;margin-bottom:4px;font-size:.86rem;}
  footer{text-align:center;color:var(--sub);font-size:.82rem;margin-top:30px;}
  @media (max-width:520px){
    .wrap{padding:14px 10px 40px;} header.top h1{font-size:1.22rem;}
    .q{padding:14px 12px;} ul.choices li{font-size:.92rem;}
  }
</style>
</head>

<div class="wrap">
<header class="top">
  <h1>금융투자협회 투자자산운용사 문제은행</h1>
  <p>13개 단위 · 단위별 2문제 · 총 26문제 (4지선다)</p>
  <p id="gen"></p>
</header>

<div class="stats">

<div id="root"></div>

<footer>학습용 자료 · 실제 시험 문항과 다를 수 있습니다.</footer>

{unit:"금융상품", items:[

     "경공매형은 저가 매입이 관건이나, 명도(점유자 퇴거) 지연과 권리관계 분석 실패 위험이 크다.",
     "정답: <b>개발형(Development) 부동산펀드</b>는 토지를 매입해 <b>직접 건물을 개발</b>하는 유형으로, 인허가 지연·공사비 상승·분양 실패 등 <b>가장 높은 위험</b>을 부담한다. 그만큼 기대수익률도 가장 높다."],
  tip:"위험·수익 순서로 배열하면 이해가 쉽다. <b>대출형 < 임대형(Core) < 경공매형 < 개발형</b>. 해외에서는 <b>Core → Core-plus → Value-added → Opportunistic</b>으로 구분하며, 뒤로 갈수록 레버리지와 개발 비중이 커진다. 또한 부동산펀드는 환금성이 낮아 대부분 <b>폐쇄형(환매 금지)</b>으로 설정되고, 이 경우 자본시장법상 설정 후 <b>90일 이내 상장</b> 의무가 따른다는 점이 자주 출제된다."},
 {q:"어떤 상업용 부동산의 연간 순영업소득(NOI)이 9억원이고, 대출에 따른 연간 원리금상환액(부채서비스액)이 6억원이다. 이 부동산의 부채상환비율(DSCR)은?",
  c:["0.67","1.20","1.50","2.00"],
  a:2,
  e:["분자와 분모를 뒤집어 계산한 값(6/9)이다.",
     "다른 지표와 혼동한 값이다.",
     "정답: DSCR = 순영업소득(NOI) ÷ 부채서비스액(DS) = 9억 ÷ 6억 = <b>1.5</b>. 1을 넘으므로 영업이익으로 원리금을 갚고도 <b>3억원의 여유</b>가 남는다는 의미다.",
     "NOI나 부채서비스액을 잘못 대입한 경우의 값이다."],
  tip:"부동산 금융의 3대 지표를 함께 외우자. ① <b>DSCR = NOI ÷ 부채서비스액</b> — 대출기관은 통상 <b>1.2~1.3 이상</b>을 요구하며, <b>1 미만이면</b> 영업만으로 원리금을 못 갚는 위험한 상태다. ② <b>LTV = 대출금 ÷ 부동산 가치</b> — 담보 여력을 본다. ③ <b>대부비율·부채비율</b>. 대출 심사에서는 LTV와 DSCR을 <b>동시에</b> 적용해 둘 중 더 보수적인 금액으로 한도를 정한다. 참고로 <b>DSCR이 높을수록 안전</b>하고, <b>LTV가 높을수록 위험</b>하다는 방향을 헷갈리지 않아야 한다."}
]},
{unit:"대안투자", items:[
 {q:"헤지펀드의 보수 체계에 관한 설명으로 옳지 않은 것은?",
  c:["운용보수와 성과보수로 구성되며, 흔히 '2-20 구조'로 불린다.",
     "기준수익률(Hurdle Rate)은 이를 초과하는 성과에 대해서만 성과보수를 받도록 하는 장치이다.",
     "최고수위표시(High Water Mark)는 과거 최고 순자산가치를 넘어선 부분에만 성과보수를 지급하는 장치이다.",
     "High Water Mark가 적용되면 손실을 회복하는 구간에서도 성과보수가 지급된다."],
  a:3,
  e:["운용자산의 약 2%를 운용보수로, 초과성과의 약 20%를 성과보수로 받는 구조가 관행이다.",
     "허들레이트를 두면 시장 평균 수준의 수익에는 성과보수를 지급하지 않아 운용자와 투자자의 이해를 맞출 수 있다.",
     "직전 고점을 회복하기 전까지는 성과보수를 받지 못하게 하여, 손실 후 반등만으로 보수를 챙기는 것을 막는다.",
     "정답: High Water Mark의 취지가 바로 그 반대다. <b>과거 최고점을 회복하는 동안에는 성과보수가 지급되지 않으며</b>, 고점을 넘어선 부분에 대해서만 지급된다. 이것이 없으면 손실 → 반등을 반복하며 <b>같은 수익에 두 번 보수를 받는</b> 문제가 생긴다."],
  tip:"헤지펀드의 투자자 보호 장치를 묶어 정리하자. <b>락업(Lock-up)</b>은 최초 가입 후 일정 기간 환매를 제한하는 것, <b>환매통지기간(Notice Period)</b>은 환매 요청 후 실제 지급까지의 유예, <b>게이트(Gate) 조항</b>은 대량 환매 시 일정 비율까지만 환매를 허용하는 장치, <b>사이드 포켓(Side Pocket)</b>은 유동성이 없는 자산을 별도 계정으로 분리하는 방법이다. 이들은 모두 <b>펀드런을 막아 잔존 투자자를 보호</b>하기 위한 것이나, 동시에 투자자의 환금성을 제약하는 위험 요인이기도 하다."},
 {q:"사모투자합자회사(PEF)의 구조와 성과보수에 관한 설명으로 옳지 않은 것은?",
  c:["업무집행사원(GP)은 무한책임을 지고 실질적인 운용과 투자 의사결정을 담당한다.",
     "유한책임사원(LP)은 출자액을 한도로 책임을 지며 원칙적으로 운용에 관여하지 않는다.",
     "성과보수(Carried Interest)는 통상 기준수익률을 초과한 이익의 일정 비율로 지급된다.",
     "LP는 출자 약정액 전액을 설립 시점에 일시 납입하는 것이 원칙이다."],
  a:3,
  e:["GP는 무한책임사원으로서 운용 권한과 책임을 함께 지며, 통상 일정 비율 이상을 직접 출자한다.",
     "LP가 운용에 관여하면 유한책임이 부정될 수 있어, 통상 자문위원회 참여 등 제한적 역할에 그친다.",
     "기준수익률(허들레이트)을 넘는 초과이익의 약 20%가 GP에게 배분되는 것이 일반적이다.",
     "정답: PEF는 <b>캐피탈 콜(Capital Call, 수시 출자이행 요구)</b> 방식이 원칙이다. 투자 대상이 정해질 때마다 GP가 LP에게 필요한 금액만 순차적으로 요청하므로, 설립 시점에 전액을 납입하지 않는다. 이는 <b>미투자 자금의 수익률 희석(cash drag)</b>을 막기 위한 구조다."],
  tip:"PEF의 생애주기를 순서대로 기억하자. <b>결성(Fund Raising) → 투자(Investment, 통상 3~5년) → 관리·가치제고(Value-up) → 회수(Exit) → 청산</b>. 회수 방법은 <b>IPO(상장), M&A(전략적 투자자 매각), 세컨더리 매각(다른 PEF에 매도), 유상감자·배당, 풋옵션 행사</b> 등이 있다. 성과 측정에는 일반 수익률이 아니라 자금 유출입 시점을 반영한 <b>IRR</b>과, 원금 대비 총회수 배수인 <b>MOIC(또는 TVPI)</b>를 함께 사용한다. J커브 효과로 초기 몇 년은 수수료 때문에 IRR이 음(−)으로 나타나는 것이 정상이다."}
]},
{unit:"해외증권", items:[
 {q:"현재 원/달러 현물환율이 1,300원이고, 국내 1년 금리가 연 4%, 미국 1년 금리가 연 2%이다. 이자율평형이론에 따른 1년 만기 선물환율에 가장 가까운 값은?",
  c:["1,275원","1,300원","1,325원","1,350원"],
  a:2,
  e:["고금리 통화와 저금리 통화를 반대로 적용한 경우의 값이다.",
     "두 나라의 금리가 같을 때에만 선물환율과 현물환율이 일치한다.",
     "정답: 선물환율 = 현물환율 × (1 + 자국금리) ÷ (1 + 외국금리) = 1,300 × (1.04 ÷ 1.02) ≒ <b>1,325원</b>. 금리가 높은 원화가 선물시장에서 <b>할인(약세)</b>되는 것이다.",
     "금리차를 과대 적용한 경우의 값이다."],
  tip:"방향을 직관으로 기억하자. <b>금리가 높은 통화는 선물환율에서 약세(할인), 금리가 낮은 통화는 강세(할증)</b>가 된다. 그렇지 않으면 고금리 통화로 예금하면서 선물환으로 되팔아 무위험 차익을 얻는 거래가 가능해지기 때문이다. 여기서 <b>스왑레이트 = (선물환율 − 현물환율) ÷ 현물환율 ≒ 양국 금리차</b>가 도출되며, 이 값이 실질적인 <b>환헤지 비용(또는 수익)</b>이 된다. 국내 금리가 미국보다 낮으면 스왑레이트가 음(−)이 되어 <b>환헤지를 할수록 비용이 발생</b>하는데, 해외투자 시 헤지 여부를 판단할 때 반드시 확인해야 하는 요소다."},
 {q:"해외 주식시장 및 글로벌 지수에 관한 설명으로 옳지 않은 것은?",
  c:["MSCI 지수는 선진시장(DM), 신흥시장(EM), 프런티어시장(FM)으로 시장을 분류한다.",
     "우리나라는 MSCI 기준으로는 신흥시장, FTSE 기준으로는 선진시장으로 분류되어 있다.",
     "지수 편입 비중이 확대되면 이를 추종하는 패시브 자금의 유입이 기대된다.",
     "MSCI의 선진시장 편입 심사에서는 시장 규모와 유동성만을 평가하며 제도적 요건은 보지 않는다."],
  a:3,
  e:["MSCI는 경제 발전 수준, 시장 규모·유동성, 시장 접근성의 3대 기준으로 시장을 분류한다.",
     "동일한 국가라도 지수 제공사에 따라 분류가 달라질 수 있는 대표적 사례다.",
     "인덱스 펀드와 ETF는 지수를 기계적으로 복제하므로 편입 비중 변경은 실제 수급에 직접 영향을 준다.",
     "정답: MSCI는 규모·유동성뿐 아니라 <b>시장 접근성(Market Accessibility)</b>을 매우 중요하게 본다. <b>외국인 투자 한도, 자본 유출입의 자유, 역외 원화시장의 부재, 영문 공시, 외환시장 개장시간, 공매도 제도</b> 등 제도적 요건이 핵심 평가 항목이며, 우리나라의 선진지수 편입이 지연되어 온 주된 이유도 여기에 있다."],
  tip:"지수 편입 이슈를 볼 때는 두 가지 효과를 구분하자. ① <b>지위 상승 효과</b> — 선진시장 편입 시 장기·안정 자금의 접근성이 좋아진다. ② <b>비중 희석 효과</b> — 선진지수에서의 비중은 신흥지수에서의 비중보다 <b>훨씬 작아</b>, 편입 직후에는 오히려 <b>자금이 순유출</b>될 수 있다. 실제로 신흥시장 내 비중이 큰 국가일수록 이 역설이 두드러진다. 한편 지수 편입·제외 발표 시점과 실제 반영(리밸런싱) 시점 사이에 주가가 미리 움직이는 <b>선반영</b> 현상도 함께 알아 두자."}
]},
{unit:"투자분석", items:[
 {q:"자본시장선(CML)과 증권시장선(SML)에 관한 설명으로 옳지 않은 것은?",
  c:["CML은 위험의 척도로 표준편차를, SML은 베타를 사용한다.",
     "CML 위에는 무위험자산과 시장포트폴리오의 결합으로 이루어진 효율적 포트폴리오만 존재한다.",
     "SML은 개별 자산과 비효율적 포트폴리오를 포함한 모든 자산의 균형수익률을 설명한다.",
     "어떤 자산이 SML 아래에 위치하면 저평가되어 있으므로 매수해야 한다."],
  a:3,
  e:["CML은 총위험(표준편차) 기준, SML은 체계적 위험(베타) 기준이라는 점이 두 선의 결정적 차이다.",
     "CML 위의 포트폴리오는 완전히 분산되어 비체계적 위험이 제거된 상태다.",
     "SML은 분산 여부와 무관하게 모든 자산에 적용되며, 이것이 CAPM의 핵심 결론이다.",
     "정답: 방향이 반대다. SML <b>위쪽</b>에 있으면 균형수익률보다 <b>높은 수익률</b>을 주는 것이므로 <b>저평가(매수)</b>이고, SML <b>아래쪽</b>에 있으면 <b>고평가(매도)</b>다. 젠센의 알파가 양(+)이면 SML 위에 위치한다는 것과 같은 말이다."],
  tip:"두 선을 한 문장으로 구분하자. <b>CML은 '효율적 포트폴리오만' + '총위험'</b>, <b>SML은 '모든 자산' + '체계적 위험'</b>. 완전히 분산된 포트폴리오는 비체계적 위험이 0이므로 <b>CML 위의 포트폴리오는 반드시 SML 위에도 놓인다</b>. 그러나 그 역은 성립하지 않는다(개별 주식은 SML 위에 있어도 CML 아래에 놓인다). 한편 <b>CML의 기울기 = (E(Rm) − Rf) ÷ σm</b>는 <b>시장포트폴리오의 샤프지수</b>와 같으며, 이를 <b>위험의 시장가격</b>이라 부른다."},
 {q:"기술적 분석과 시장 효율성에 관한 설명으로 옳지 않은 것은?",
  c:["약형 효율적 시장가설이 성립하면 과거 주가 정보를 이용한 기술적 분석으로 초과수익을 얻을 수 없다.",
     "준강형 효율적 시장가설이 성립하면 공개된 재무제표 정보를 이용한 기본적 분석으로도 초과수익을 얻기 어렵다.",
     "강형 효율적 시장가설이 성립하면 내부정보를 이용해도 초과수익을 얻을 수 없다.",
     "이상현상(Anomaly)의 존재는 효율적 시장가설을 뒷받침하는 강력한 근거로 평가된다."],
  a:3,
  e:["약형 가설은 과거 가격에 담긴 정보가 이미 주가에 반영되어 있다고 본다.",
     "준강형 가설은 공시·실적 등 공개정보가 즉시 주가에 반영된다고 본다. 이를 검증하는 방법이 사건연구(event study)다.",
     "강형 가설은 미공개 내부정보까지 반영되어 있다고 보는 가장 강한 가정으로, 현실에서는 성립하기 어렵다고 평가된다.",
     "정답: 이상현상은 오히려 효율적 시장가설에 <b>반(反)하는 증거</b>다. <b>소형주 효과, 1월 효과, 저PER·저PBR 효과, 주말 효과, 모멘텀 현상</b> 등은 공개정보만으로 초과수익이 가능함을 시사하며, 행동재무학이 등장하는 배경이 되었다."],
  tip:"세 가설의 포함관계를 기억하자. <b>강형 ⊃ 준강형 ⊃ 약형</b>. 즉 강형이 성립하면 나머지도 성립하지만, 약형이 성립한다고 준강형이 성립하는 것은 아니다. 각 가설이 부정하는 분석기법도 짝지어 두자. <b>약형 성립 → 기술적 분석 무용</b>, <b>준강형 성립 → 기본적 분석 무용</b>, <b>강형 성립 → 내부자거래도 무용</b>. 한편 효율적 시장에서도 <b>적정한 위험에 대한 보상(위험프리미엄)</b>은 얻을 수 있으며, 부정되는 것은 어디까지나 <b>위험 대비 초과수익(알파)</b>임에 주의한다."}
]},
{unit:"리스크관리", items:[
 {q:"유동성리스크에 관한 설명으로 옳지 않은 것은?",
  c:["시장유동성리스크는 보유자산을 원하는 가격에 신속히 처분하지 못할 위험이다.",
     "자금조달유동성리스크는 필요한 자금을 적시에 조달하지 못할 위험이다.",
     "매도호가와 매수호가의 차이(Bid-Ask Spread)는 시장유동성을 나타내는 대표적 지표이다.",
     "유동성리스크는 시장리스크나 신용리스크와 서로 독립적으로 발생하므로 개별 관리로 충분하다."],
  a:3,
  e:["대량 매도 시 가격이 크게 밀리는 시장충격비용이 시장유동성리스크의 핵심이다.",
     "만기 불일치나 신용경색 국면에서 차환에 실패하는 상황이 대표적이다.",
     "스프레드가 좁고 호가 잔량이 두꺼울수록 유동성이 좋다고 평가한다.",
     "정답: 유동성리스크는 다른 위험과 <b>강하게 결합</b>되어 증폭된다. 시장이 급락하면(시장리스크) 마진콜이 발생해 자산을 급히 팔아야 하고, 매도가 가격을 더 떨어뜨려 다시 손실이 커지는 <b>유동성 악순환(Liquidity Spiral)</b>이 나타난다. 신용등급 하락은 조달금리를 올려 자금조달유동성을 악화시킨다."],
  tip:"유동성을 반영한 위험 측정 개념을 알아 두자. 전통적 VaR는 <b>보유기간 중 언제든 시장가격에 청산 가능</b>하다고 가정하지만, 현실에서는 대량 포지션의 청산에 시간이 걸린다. 이를 보정한 것이 <b>L-VaR(유동성조정 VaR)</b>로, 매도호가 스프레드의 절반과 시장충격비용을 더해 산출한다. 규제 측면에서 바젤Ⅲ는 <b>LCR(유동성커버리지비율, 30일 스트레스 상황 대응)</b>과 <b>NSFR(순안정자금조달비율, 1년 구조적 만기 불일치)</b>이라는 두 가지 유동성 규제를 도입했다."},
 {q:"위험조정성과지표인 RAROC에 관한 설명으로 옳지 않은 것은?",
  c:["RAROC은 위험조정 후 수익을 배분된 경제적 자본으로 나눈 값이다.",
     "여기서 자본은 규제자본이 아니라 예상외손실을 흡수하기 위한 경제적 자본을 의미한다.",
     "예상손실(EL)은 비용으로 처리하고, 예상외손실(UL)을 자본으로 대비하는 것이 원칙이다.",
     "RAROC은 사업부문의 성과평가에는 쓰이지만 자본배분의 기준으로는 활용되지 않는다."],
  a:3,
  e:["RAROC = (수익 − 비용 − 예상손실) ÷ 경제적 자본으로 계산하며, 위험을 감안한 수익성을 보여 준다.",
     "경제적 자본은 내부 모형으로 산출한 실질적 위험 부담 능력이며, 규제자본과 다를 수 있다.",
     "예상손실은 대손충당금·스프레드로 미리 반영하고, 통계적으로 예측 곤란한 예상외손실에 자본을 배정한다.",
     "정답: RAROC의 가장 중요한 용도가 바로 <b>자본배분</b>이다. RAROC이 <b>자기자본비용(허들레이트)을 넘는 사업부에 자본을 더 배분</b>하고 그렇지 않은 부문은 축소함으로써, 위험을 감안한 전사적 자원 배분을 수행한다. 성과평가와 자본배분은 같은 지표의 두 얼굴이다."],
  tip:"손실의 3단계 구분을 기억하자. ① <b>예상손실(EL)</b> = PD × LGD × EAD → <b>충당금·가격(스프레드)</b>으로 대비 ② <b>예상외손실(UL)</b> → <b>자기자본</b>으로 대비 ③ <b>극단손실(Stress Loss)</b> → 위기상황분석과 비상계획으로 대비. 한편 RAROC과 혼동하기 쉬운 지표로 <b>EVA(경제적 부가가치) = 세후영업이익 − 자본비용</b>이 있는데, RAROC이 <b>비율</b>인 반면 EVA는 <b>금액</b>이라는 점이 다르다. 두 지표는 'RAROC > 자기자본비용'과 'EVA > 0'이 서로 같은 의미가 된다."}
]},
{unit:"직무윤리", items:[
 {q:"금융투자업 종사자의 직무윤리 위반에 대한 제재에 관한 설명으로 옳지 않은 것은?",
  c:["금융투자협회는 자율규제기관으로서 회원사와 그 임직원에 대해 제재를 부과할 수 있다.",
     "금융위원회와 금융감독원은 인가·등록 취소, 업무정지, 임직원 문책 등 행정제재를 할 수 있다.",
     "직무윤리 위반이 동시에 법령 위반에 해당하면 민사상 손해배상책임과 형사처벌이 따를 수 있다.",
     "직무윤리는 법적 강제력이 없는 도덕적 규범이므로 위반하더라도 법적 제재의 대상이 되지 않는다."],
  a:3,
  e:["협회는 회원 제명·회원자격 정지, 임직원에 대한 제재 권고 등의 자율규제 권한을 갖는다.",
     "감독당국의 행정제재는 기관제재와 임직원 제재로 나뉘며, 과징금·과태료도 부과된다.",
     "설명의무 위반 등은 손해배상책임을, 부정거래 등은 형사책임을 함께 발생시킨다.",
     "정답: 직무윤리의 상당 부분은 <b>자본시장법과 금융소비자보호법에 이미 법제화</b>되어 있다. 신의성실의무, 설명의무, 적합성 원칙, 이해상충 방지의무 등은 <b>법적 의무</b>로서, 위반 시 행정제재·민사책임·형사책임이 모두 따를 수 있다. '윤리 = 법적 구속력 없음'이라는 단정은 틀렸다."],
  tip:"윤리가 법으로 옮겨 간 대표적 조항을 짝지어 외우자. <b>신의성실의무</b>(자본시장법 제37조) → 위반 시 손해배상책임의 근거, <b>이해상충 관리의무</b>(제44조), <b>정보교류 차단</b>(제45조), <b>적합성·설명의무</b>(금융소비자보호법 제17~19조). 특히 <b>설명의무 위반에 대해서는 손해액이 추정</b>되고 <b>입증책임이 금융회사로 전환</b>되며, 금융소비자보호법 위반에는 <b>징벌적 과징금(관련 수입의 최대 50%)</b>이 부과될 수 있다. 자율규제·행정제재·민사·형사의 <b>4중 구조</b>로 기억하면 정리가 쉽다."},
 {q:"금융실명법 및 개인정보 보호에 관한 설명으로 옳지 않은 것은?",
  c:["금융회사는 명의인의 동의 없이 금융거래 정보를 타인에게 제공할 수 없는 것이 원칙이다.",
     "법원의 제출명령이나 영장, 조세에 관한 법률 등 법령에 근거한 경우에는 예외가 인정된다.",
     "고유식별정보와 민감정보는 원칙적으로 처리가 금지되며 별도의 동의 등 엄격한 요건을 갖춰야 한다.",
     "금융거래 정보를 법령에 따라 제공하는 경우에는 명의인에게 그 사실을 통보할 의무가 없다."],
  a:3,
  e:["금융실명법상 거래정보 비밀보장이 원칙이며, 위반 시 형사처벌 대상이다.",
     "예외 사유는 법에 <b>열거</b>되어 있으며, 이 경우에도 <b>필요 최소한의 범위</b>에서만 제공해야 한다.",
     "주민등록번호 등 고유식별정보와 건강·사상 등 민감정보는 개인정보 보호법상 특별히 보호된다.",
     "정답: 금융실명법은 정보를 제공한 경우 원칙적으로 <b>제공한 날부터 10일 이내에 명의인에게 서면으로 통보</b>하도록 규정한다. 다만 수사 지장 등 사유가 있으면 통보를 <b>유예</b>할 수 있을 뿐, 통보 의무 자체가 없는 것은 아니다."],
  tip:"정보 관련 의무를 층위별로 정리하자. ① <b>직무윤리상 비밀유지의무</b> — 퇴직 후에도 존속 ② <b>금융실명법</b> — 거래정보 비밀보장, 예외 사유 열거, <b>명의인 통보의무</b>, 제공 기록 보관 ③ <b>개인정보 보호법</b> — 수집·이용·제공 시 <b>동의</b>, 목적 달성 후 <b>파기</b>, 고유식별정보·민감정보의 별도 보호 ④ <b>신용정보법</b> — 신용정보의 이용·보호. 실무에서는 <b>정보교류 차단장치(Chinese Wall)</b>로 부서 간 정보 이동을 통제하며, 필요 시 <b>예외적 교류(Wall Crossing)</b>는 준법감시인의 사전 승인과 기록 유지가 요구된다."}
]},
{unit:"법규", items:[
 {q:"자본시장법상 기업공시제도에 관한 설명으로 옳지 않은 것은?",
  c:["일정 금액 이상의 증권을 모집·매출하려면 증권신고서를 제출해야 한다.",
     "증권신고서의 효력이 발생하기 전에는 원칙적으로 증권을 취득하게 할 수 없다.",
     "사업보고서는 정기공시, 주요사항보고서는 수시공시의 성격을 갖는다.",
     "50인 미만을 대상으로 한 사모발행에도 증권신고서 제출 의무가 그대로 적용된다."],
  a:3,
  e:["모집·매출 금액이 10억원 이상이면 금융위원회에 증권신고서를 제출해야 한다.",
     "효력발생 전에는 청약의 권유만 가능하고 실제 취득은 허용되지 않으며, 이때 <b>예비투자설명서</b>를 사용한다.",
     "사업보고서·반기·분기보고서는 정기공시이고, 주요사항보고서와 거래소 수시공시는 수시공시에 해당한다.",
     "정답: <b>50인 미만</b>을 대상으로 한 청약의 권유는 <b>사모</b>에 해당하여 증권신고서 제출 의무가 <b>면제</b>된다. 다만 발행 후 지체 없이 다수에게 전매될 가능성(전매제한 조치 미이행)이 있으면 <b>간주모집</b>으로 보아 공시의무가 발생할 수 있다."],
  tip:"'50인 산정'의 세부 규칙이 자주 출제된다. 청약 권유 대상자 수는 <b>과거 6개월간</b> 같은 종류의 증권에 대해 권유받은 자를 <b>합산</b>해 계산한다. 다만 <b>전문투자자, 발행인의 최대주주·임원, 회계법인·신용평가회사 등 전문가</b>는 산정에서 <b>제외</b>된다. 공시서류의 종류도 함께 정리하자. <b>증권신고서 → (효력발생) → 투자설명서 → 증권발행실적보고서</b>의 흐름이며, 투자설명서에는 <b>예비·간이·정식</b>의 세 종류가 있다."},
 {q:"자본시장법상 시세조종행위 및 부정거래행위 금지에 관한 설명으로 옳지 않은 것은?",
  c:["통정매매와 가장매매는 매매가 성황을 이루는 듯이 오인하게 하는 시세조종행위에 해당한다.",
     "시세를 고정시키거나 안정시킬 목적의 매매도 원칙적으로 금지되나, 법령이 허용하는 안정조작·시장조성은 예외이다.",
     "부정거래행위 금지 조항은 시세조종에 해당하지 않는 다양한 부정한 수단·계획·기교를 포괄적으로 규율한다.",
     "시세조종행위는 행정제재의 대상일 뿐 형사처벌의 대상은 아니다."],
  a:3,
  e:["통정매매(서로 짜고 하는 매매)와 가장매매(권리 이전 없는 외형상 매매)는 위장거래형 시세조종의 전형이다.",
     "인수인이 일정 기간 수행하는 안정조작과 시장조성은 법이 정한 요건 아래 허용된다.",
     "제178조 부정거래행위 금지는 <b>포괄적 사기금지 조항</b>으로, 열거되지 않은 신종 수법까지 규율한다.",
     "정답: 시세조종은 <b>형사처벌의 대상</b>이다. 1년 이상의 유기징역 또는 이익·회피손실액의 3배 이상 5배 이하 벌금에 처해질 수 있고, 이익이 5억원 이상이면 가중된다. 아울러 <b>과징금</b>과 <b>손해배상책임</b>도 함께 따른다."],
  tip:"불공정거래의 <b>4대 유형</b>을 묶어 정리하자. ① <b>미공개중요정보 이용(내부자거래)</b> ② <b>시세조종</b> ③ <b>부정거래행위</b> ④ <b>시장질서 교란행위</b>. 앞의 세 가지는 <b>형사처벌</b> 대상이나, ④ 시장질서 교란행위는 <b>과징금</b>이라는 행정제재로 규율한다는 점이 결정적 차이다. 시장질서 교란행위는 <b>2차 이후 정보수령자</b>나 <b>목적성이 입증되지 않은 시세 영향 행위</b>처럼 기존 규정으로 처벌하기 어려웠던 영역을 메우기 위해 도입된 제도다."}
]},
{unit:"주식", items:[
 {q:"기업공개(IPO)와 공모가 결정에 관한 설명으로 옳지 않은 것은?",
  c:["대표주관회사가 기업실사를 거쳐 희망 공모가액 범위(밴드)를 제시한다.",
     "기관투자자를 대상으로 수요예측을 실시하여 최종 공모가를 결정한다.",
     "일반청약자 배정 물량에는 균등배정 방식이 적용되는 부분이 있다.",
     "상장 직후 주가 하락에 대비해 주관사가 시장조성을 하는 것은 법으로 금지되어 있다."],
  a:3,
  e:["주관사는 유사기업 비교(PER·EV/EBITDA 등)와 할인율을 적용해 밴드를 산정한다.",
     "수요예측에서 기관의 신청 가격·수량을 집계해 밴드 내에서, 때로는 밴드를 벗어나 공모가를 정한다.",
     "청약 증거금에 비례하는 비례배정과 함께, 최소 청약 요건을 갖추면 균등하게 나누는 균등배정이 병행된다.",
     "정답: 오히려 법이 <b>허용</b>하는 제도다. 주관사가 상장 후 일정 기간 공모가의 일정 수준 아래에서 매수하는 <b>시장조성</b>과 <b>환매청구권(풋백옵션)</b>은 투자자 보호 장치로 운영된다. 특히 이익미실현기업 상장(테슬라 요건) 등에서는 <b>풋백옵션 부여가 의무</b>화된다."],
  tip:"IPO의 물량 안정화 장치를 함께 정리하자. ① <b>보호예수(Lock-up)</b> — 최대주주 등은 상장 후 6개월간 매각 제한 ② <b>의무보유확약</b> — 수요예측에 참여한 기관이 일정 기간 매도하지 않겠다고 확약하면 물량 배정에서 우대 ③ <b>초과배정옵션(Green Shoe Option)</b> — 주관사가 공모 물량의 최대 15%를 추가 배정한 뒤, 주가가 공모가를 밑돌면 시장에서 매수해 갚아 주가를 방어하는 제도 ④ <b>환매청구권(풋백옵션)</b>. 상장예비심사 → 증권신고서 제출 → 수요예측 → 청약·배정 → 납입 → 상장의 <b>절차 순서</b>도 자주 출제된다."},
 {q:"어떤 기업의 주당순이익(EPS)이 3,000원, 배당성향이 30%이며 현재 주가가 45,000원이다. 이 기업의 배당수익률은?",
  c:["1.5%","2.0%","3.0%","6.7%"],
  a:1,
  e:["배당성향이나 주가를 잘못 대입한 경우의 값이다.",
     "정답: 주당배당금(DPS) = EPS × 배당성향 = 3,000 × 0.3 = <b>900원</b>. 배당수익률 = DPS ÷ 주가 = 900 ÷ 45,000 = <b>2.0%</b>",
     "배당성향을 다르게 적용한 경우의 값이다.",
     "EPS를 그대로 주가로 나눈 값(3,000 ÷ 45,000 = 6.7%)으로, 이는 배당수익률이 아니라 <b>이익수익률(PER의 역수)</b>이다."],
  tip:"주당 지표 사이의 관계를 하나로 엮어 두자. <b>PER = 주가 ÷ EPS</b> = 45,000 ÷ 3,000 = <b>15배</b>이고, 그 역수인 <b>이익수익률 = 6.7%</b>다. 여기에 배당성향 30%를 곱하면 <b>배당수익률 2.0%</b>가 된다. 즉 <b>배당수익률 = 배당성향 ÷ PER</b>이다. 또한 <b>유보율 = 1 − 배당성향 = 70%</b>이므로, ROE가 10%라면 <b>지속가능성장률 g = ROE × 유보율 = 7%</b>가 된다. 배당성향을 높이면 당장의 배당수익률은 오르지만 <b>성장률 g는 낮아지는</b> 상충관계가 있다는 점이 고든모형과 연결되는 출제 포인트다."}
]},
{unit:"채권", items:[
 {q:"채권의 종류에 관한 설명으로 옳지 않은 것은?",
  c:["신종자본증권(하이브리드채권)은 만기가 매우 길거나 영구적이며 회계상 자본으로 인정될 수 있다.",
     "조건부자본증권(코코본드)은 발행 시 정한 사유가 발생하면 상각되거나 주식으로 전환된다.",
     "자산유동화증권(ABS)은 기초자산에서 나오는 현금흐름을 담보로 발행되며 신용보강이 이루어진다.",
     "후순위채는 변제순위가 일반 선순위채보다 앞서므로 발행금리가 더 낮게 형성된다."],
  a:3,
  e:["영구채는 만기 연장 조항과 콜옵션이 붙는 경우가 많고, 일정 요건을 갖추면 자본으로 분류된다.",
     "코코본드는 발행기관의 자본비율 하락 등 트리거 발생 시 투자자가 손실을 흡수하는 구조로, 바젤Ⅲ 자본규제와 연결된다.",
     "SPC가 자산을 양도받아 발행하며, 선·후순위 구조화와 신용보강으로 신용등급을 끌어올린다.",
     "정답: 후순위채는 변제순위가 선순위채보다 <b>뒤</b>에 있어 위험이 크므로, 그 대가로 발행금리가 <b>더 높게</b> 형성된다. 순위와 금리의 관계가 정반대로 서술되었다."],
  tip:"변제순위를 자본구조 순서대로 외우자. <b>담보부채권 > 선순위 무담보채 > 후순위채 > 신종자본증권(영구채) > 우선주 > 보통주</b>. 뒤로 갈수록 위험이 커지고 요구수익률도 높아진다. 한편 <b>ABS</b>는 기초자산에 따라 이름이 달라진다. 주택담보대출이면 <b>MBS</b>, 회사채·대출이면 <b>CDO/CLO</b>, 매출채권이면 <b>ABCP</b>(단기). 발행 구조의 핵심은 <b>SPC를 통한 진정매매(True Sale)</b>로 원 자산보유자의 파산으로부터 자산을 격리하는 것이며, 이를 <b>파산절연(bankruptcy remoteness)</b>이라 한다."},
 {q:"어떤 채권의 수정듀레이션이 5.0, 볼록성(Convexity)이 50이다. 시장 만기수익률이 1.0%p 하락할 때, 볼록성까지 고려한 채권가격의 변동률에 가장 가까운 값은?",
  c:["+4.75%","+5.00%","+5.25%","+5.50%"],
  a:2,
  e:["볼록성 효과를 빼서 계산한 경우의 값이다.",
     "듀레이션 효과만 반영하고 볼록성을 무시한 값이다.",
     "정답: ΔP/P ≒ −수정듀레이션 × Δy + ½ × 볼록성 × (Δy)² = −5.0 × (−0.01) + 0.5 × 50 × (0.01)² = 0.05 + 0.0025 = 0.0525 → <b>+5.25%</b>",
     "볼록성 항의 계수(½)를 빠뜨린 경우의 값이다."],
  tip:"볼록성 항은 <b>(Δy)²</b>이므로 금리가 오르든 내리든 <b>항상 양(+)</b>이다. 따라서 ① 금리 <b>하락</b> 시 실제 가격 상승폭은 듀레이션 추정치보다 <b>더 크고</b>, ② 금리 <b>상승</b> 시 실제 가격 하락폭은 듀레이션 추정치보다 <b>더 작다</b>. 즉 볼록성은 투자자에게 <b>유리하게</b> 작용하며, 그래서 다른 조건이 같다면 볼록성이 큰 채권이 더 비싸게 거래된다. 볼록성은 <b>만기가 길수록, 표면금리가 낮을수록, 만기수익률이 낮을수록</b> 커진다. 듀레이션이 같은 두 채권 중 하나를 고를 때 볼록성이 큰 쪽을 택하는 전략이 <b>바벨형(나비형) 투자전략</b>이다."}
]},
{unit:"파생상품", items:[
 {q:"신용부도스왑(CDS)에 관한 설명으로 옳지 않은 것은?",
  c:["보장매입자는 프리미엄을 지급하고 준거자산의 신용사건 발생 시 손실을 보전받는다.",
     "보장매도자는 프리미엄을 수취하는 대신 신용위험을 인수한다.",
     "준거기업의 신용도가 나빠지면 CDS 프리미엄은 상승한다.",
     "보장매입자는 반드시 준거자산을 보유하고 있어야 CDS 계약을 체결할 수 있다."],
  a:3,
  e:["보장매입자는 채권에 대한 보험을 든 것과 유사한 지위가 되며, 신용위험만 분리해 이전할 수 있다.",
     "보장매도자는 준거자산을 직접 보유하지 않고도 신용위험을 인수해 수익을 얻는다.",
     "CDS 프리미엄은 시장이 평가하는 부도위험의 척도로, 국가 신용위험의 대용치로도 활용된다.",
     "정답: 준거자산을 보유하지 않고도 CDS를 매입할 수 있으며, 이를 <b>네이키드(Naked) CDS</b>라 한다. 이는 보유 자산의 헤지가 아니라 <b>신용도 악화에 대한 투기</b>가 되므로, 유럽 재정위기 이후 일부 국채 CDS에 대해서는 네이키드 거래가 규제되기도 했다."],
  tip:"신용파생상품을 유형별로 정리하자. ① <b>CDS</b> — 신용위험만 이전하는 가장 기본적인 형태 ② <b>TRS(총수익스왑)</b> — 신용위험뿐 아니라 <b>시장위험(가격변동)까지</b> 함께 이전 ③ <b>CLN(신용연계채권)</b> — CDS를 채권 형태로 만들어 <b>선지급(funded)</b> 구조로 바꾼 것 ④ <b>합성 CDO</b> — CDS 포트폴리오를 트랜치로 나눈 구조. 여기서 <b>CDS는 미지급(unfunded)</b>, <b>CLN은 선지급(funded)</b>이라는 구분이 자주 출제된다. 또한 신용사건에는 <b>파산, 지급불이행, 채무재조정</b> 등이 포함되며, 무엇을 신용사건으로 볼지는 계약서에 명시한다."},
 {q:"현재 주가가 100원인 주식에 대해 행사가격 100원, 잔존만기 1년인 유럽형 콜옵션의 가격이 10원이다. 무위험이자율이 연 5%일 때, 풋-콜 패리티에 의한 같은 조건의 풋옵션 가격에 가장 가까운 값은? (배당은 없다고 가정)",
  c:["4.76원","5.24원","10.00원","14.76원"],
  a:1,
  e:["행사가격의 현재가치를 잘못 계산한 경우의 값이다.",
     "정답: 풋-콜 패리티는 <b>S + P = C + K/(1+r)</b>이다. 따라서 P = C + K/(1+r) − S = 10 + 100/1.05 − 100 = 10 + 95.24 − 100 = <b>5.24원</b>",
     "콜옵션 가격을 그대로 답한 경우다. 등가격이라도 콜과 풋의 가격은 <b>화폐의 시간가치 때문에</b> 같지 않다.",
     "부호를 반대로 적용한 경우(10 + 100 − 95.24)의 값이다."],
  tip:"풋-콜 패리티는 변형해서 외우면 응용이 쉽다. <b>S + P = C + PV(K)</b>에서 각 항을 이항하면 합성 포지션이 보인다. ① <b>C − P = S − PV(K)</b> → 콜 매수 + 풋 매도 = 선물 매수와 같은 손익 ② <b>S − C = PV(K) − P</b> → <b>커버드 콜</b>(주식+콜매도) = 풋 매도 + 채권 ③ <b>S + P = C + PV(K)</b> → <b>방어적 풋</b>(주식+풋매수) = 콜 매수 + 채권. 등가격(S=K)일 때는 PV(K) < K이므로 항상 <b>콜 가격 > 풋 가격</b>이 된다. 이 관계가 깨지면 <b>컨버전·리버설</b>이라 불리는 무위험 차익거래가 발생한다."}
]},
{unit:"성과분석", items:[
 {q:"성과평가에 사용되는 벤치마크에 관한 설명으로 옳지 않은 것은?",
  c:["벤치마크는 운용 개시 전에 미리 정해져 있어야 한다.",
     "벤치마크는 측정 가능하고 실제로 투자 가능한 것이어야 한다.",
     "정상 포트폴리오(Normal Portfolio)는 운용자의 투자 스타일을 반영한 맞춤형 벤치마크이다.",
     "운용 결과가 부진할 경우 사후에 벤치마크를 교체하여 성과를 재평가하는 것이 바람직하다."],
  a:3,
  e:["사전에 정해져 있지 않으면 사후적으로 유리한 기준을 고르는 조작이 가능해진다.",
     "투자 불가능한 지수를 벤치마크로 삼으면 달성 불가능한 기준을 강요하는 셈이 된다.",
     "정상 포트폴리오는 해당 운용자가 통상적으로 투자하는 종목군으로 구성해 스타일 편향을 제거한다.",
     "정답: 사후에 벤치마크를 바꾸는 것은 성과평가의 신뢰성을 근본적으로 훼손하는 행위다. 벤치마크는 <b>사전에 정해 일관되게 유지</b>해야 하며, 변경이 불가피하다면 <b>운용전략 자체가 바뀐 경우</b>에 한해 사유를 공개하고 변경해야 한다."],
  tip:"좋은 벤치마크의 요건을 두문자로 기억하자. <b>명확성</b>(구성 종목과 비중이 특정 가능), <b>투자가능성</b>, <b>측정가능성</b>, <b>적합성</b>(운용 스타일과 일치), <b>사전에 정의됨</b>, <b>운용자가 인지하고 수용함</b>. 벤치마크의 종류로는 <b>시장지수</b>(KOSPI 등), <b>섹터·스타일 지수</b>(가치주·성장주·대형주 지수), <b>합성지수</b>(주식 60% + 채권 40% 등 자산배분 반영), <b>정상 포트폴리오</b>가 있다. 벤치마크 대비 초과성과는 <b>성과요인 분석</b>을 통해 <b>자산배분효과·종목선택효과·상호작용효과</b>로 분해된다."},
 {q:"어떤 펀드의 연간 수익률이 15%, 무위험이자율이 3%, 시장포트폴리오의 수익률이 11%, 이 펀드의 베타가 1.2일 때 젠센의 알파(Jensen's alpha)는?",
  c:["1.2%p","2.4%p","4.0%p","12.0%p"],
  a:1,
  e:["베타 값을 그대로 답한 경우다.",
     "정답: CAPM에 의한 기대수익률 = Rf + β × (Rm − Rf) = 3% + 1.2 × (11% − 3%) = 3% + 9.6% = <b>12.6%</b>. 젠센의 알파 = 실제수익률 − 기대수익률 = 15% − 12.6% = <b>+2.4%p</b>",
     "단순히 실제수익률에서 시장수익률을 뺀 값(15% − 11%)으로, 베타를 반영하지 않은 값이다.",
     "실제수익률에서 무위험이자율만 뺀 초과수익률(15% − 3%)이다."],
  tip:"젠센의 알파를 해석할 때 주의할 점이 있다. ① 알파가 <b>양(+)</b>이면 위험을 감안하고도 초과성과를 냈다는 뜻이며, 이는 그 자산이 <b>SML 위쪽</b>에 있음을 의미한다. ② 알파는 <b>금액(%p) 개념</b>이라 위험 1단위당 성과를 보여 주지 못한다. 그래서 알파를 <b>트래킹에러로 나눈 정보비율(또는 Appraisal Ratio)</b>로 보완한다. ③ 알파는 <b>베타 추정치와 시장지수 선택에 민감</b>하며, 잘못된 벤치마크를 쓰면 알파가 왜곡된다. ④ 서로 다른 베타를 가진 펀드 간 비교에는 알파의 <b>절대값</b>보다 위험 대비 지표가 더 적절하다."}
]}
];

const LB=["①","②","③","④"];
let idx=0, done=0, ok=0, total=0;
const root=document.getElementById('root');

DATA.forEach(function(u){
  const sec=document.createElement('section');
  sec.className='unit';
  sec.innerHTML='<div class="unit-head"><h2>'+u.unit+' <small>('+u.items.length+'문항)</small></h2></div>';
  u.items.forEach(function(it){
    idx++; total++;
    const n=idx;
    const div=document.createElement('div');
    div.className='q';
    let html='<p class="q-title"><span class="num">Q'+n+'</span>'+it.q+'</p><ul class="choices" id="ch'+n+'">';
    it.c.forEach(function(c,i){ html+='<li data-i="'+i+'">'+LB[i]+' '+c+'</li>'; });
    html+='</ul><button class="btn" id="bt'+n+'">정답 보기</button>';
    html+='<div class="ans-box" id="ab'+n+'"><div class="verdict" id="vd'+n+'"></div>'+
          '<div class="ans-line">정답: '+LB[it.a]+' '+it.c[it.a]+'</div><div class="exp"><div class="each">';
    it.e.forEach(function(e,i){ html+='<div><b>'+LB[i]+'</b> '+e+'</div>'; });
    html+='</div></div>';
    if(it.tip) html+='<div class="tip"><b>📚 심화 학습 · 관련 자료</b>'+it.tip+'</div>';
    html+='</div>';
    div.innerHTML=html;
    sec.appendChild(div);

    setTimeout(function(){
      const ul=document.getElementById('ch'+n), box=document.getElementById('ab'+n),
            vd=document.getElementById('vd'+n), bt=document.getElementById('bt'+n);
      let answered=false;
      function reveal(sel){
        box.classList.add('show');
        Array.prototype.forEach.call(ul.children,function(li){
          const i=+li.dataset.i;
          li.classList.add('locked');
          if(i===it.a) li.classList.add('correct');
          if(sel!==null && i===sel && i!==it.a) li.classList.add('wrong');
          if(i===it.a && !li.querySelector('.mark')) li.insertAdjacentHTML('afterbegin','<span class="mark">✔ 정답</span>');
          if(sel!==null && i===sel && i!==it.a) li.insertAdjacentHTML('afterbegin','<span class="mark">✘ 선택</span>');
        });
        if(sel===null){ vd.textContent='정답과 해설을 확인하세요.'; vd.className='verdict'; }
        else if(sel===it.a){ vd.textContent='⭕ 정답입니다!'; vd.className='verdict ok'; }
        else { vd.textContent='❌ 오답입니다. (선택: '+LB[sel]+' / 정답: '+LB[it.a]+')'; vd.className='verdict no'; }
        bt.textContent='해설 접기';
      }
      Array.prototype.forEach.call(ul.children,function(li){
        li.addEventListener('click',function(){
          if(answered) return;
          answered=true;
          const sel=+li.dataset.i;
          done++; if(sel===it.a) ok++;
          upd(); reveal(sel);
        });
      });
      bt.addEventListener('click',function(){
        if(box.classList.contains('show')){ box.classList.remove('show'); bt.textContent='정답 보기'; return; }
        if(!answered){ answered=true; done++; upd(); reveal(null); }
        else { box.classList.add('show'); bt.textContent='해설 접기'; }
      });
    },0);
  });
  root.appendChild(sec);
});

function upd(){
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-rate').textContent=(done?Math.round(ok/done*100):0)+'%';
}
document.getElementById('s-total').textContent=total;

document.getElementById('gen').textContent='생성일시: 2026-09-17 06:41:00 (Asia/Seoul)';
</script>
</body>
</html>
