<style>

  .stat b{display:block;font-size:1.3rem;color:var(--brand);}
  .stat span{font-size:.78rem;color:var(--sub);}

  .unit-head small{color:var(--sub);font-weight:600;}
  .q{padding:18px;border-bottom:1px dashed var(--line);}
  .q:last-child{border-bottom:none;}
  .q-title{font-weight:700;margin:0 0 12px;font-size:1rem;}
  .q-title .num{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;
    padding:1px 8px;font-size:.8rem;margin-right:8px;}
  ul.choices{list-style:none;margin:0;padding:0;}
  ul.choices li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;
    cursor:pointer;background:#fbfdff;transition:.15s;font-size:.95rem;}
  ul.choices li:hover{border-color:var(--brand);background:#f0f7ff;}
  ul.choices li .mark{float:right;font-weight:800;}
  li.correct{background:var(--ok-soft);border-color:var(--ok);color:#065f46;font-weight:600;}
  li.wrong{background:var(--no-soft);border-color:var(--no);color:#991b1b;font-weight:600;}
  li.locked{cursor:default;}
  .btn{margin-top:6px;background:#fff;border:1.5px solid var(--brand);color:var(--brand);
    border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.9rem;}
  .btn:hover{background:var(--brand);color:#fff;}
  .ans-box{display:none;margin-top:12px;border:1.5px solid #cbd5e1;border-left:6px solid var(--brand);
    border-radius:10px;background:#f8fafc;padding:14px;}
  .ans-box.show{display:block;}
  .verdict{font-weight:800;margin-bottom:8px;font-size:.95rem;}
  .verdict.ok{color:var(--ok);} .verdict.no{color:var(--no);}
  .ans-line{font-weight:800;color:#1e3a8a;margin-bottom:8px;}
  .exp{font-size:.9rem;color:#334155;}
  .exp .each{margin-top:8px;padding-top:8px;border-top:1px dotted #cbd5e1;}
  .exp .each div{margin:3px 0;}
  .tip{margin-top:10px;background:#fffbeb;border:1px solid #fcd34d;border-left:6px solid #f59e0b;
    border-radius:10px;padding:11px 13px;font-size:.88rem;color:#7c2d12;}
  .tip b{display:block;color:#92400e;margin-bottom:4px;font-size:.86rem;}
  footer{text-align:center;color:var(--sub);font-size:.82rem;margin-top:30px;}
  @media (max-width:520px){
    .wrap{padding:14px 10px 40px;} header.top h1{font-size:1.22rem;}
    .q{padding:14px 12px;} ul.choices li{font-size:.92rem;}
  }
</style>
</head>

 {q:"DR(주식예탁증서)에 대한 설명으로 가장 적절하지 않은 것은?",
  c:["원주는 현지 보관기관에 예탁되고 그에 기초해 DR이 발행된다.",
     "ADR은 미국 시장에서 달러로 거래된다.",
     "DR 보유자는 통상 배당을 받을 권리를 갖는다.",
     "DR 가격은 원주 가격과 환율에 관계없이 독립적으로 결정된다."],
  a:3,
  e:["예탁기관·보관기관 구조로 발행된다.",
     "ADR은 미국 거래소·OTC에서 USD로 거래된다.",
     "예탁기관을 통해 배당이 지급된다.",
     "정답: DR 이론가격은 원주가격 × 전환비율 ÷ 환율로 연동되며, 괴리는 차익거래로 축소된다."],
  tip:"ADR은 Level 1(OTC)·Level 2(상장)·Level 3(상장+공모) 및 Rule 144A(적격기관 대상)로 구분된다. 단계가 높을수록 SEC 공시 의무가 무거워진다."}
]},
{unit:"투자분석", items:[
 {q:"기업가치 평가에 대한 설명으로 옳지 않은 것은?",
  c:["PER은 주가를 주당순이익으로 나눈 값이다.",
     "EV/EBITDA는 자본구조와 감가상각 정책의 차이에 상대적으로 덜 민감하다.",
     "PBR은 자기자본이익률(ROE)이 높을수록 이론적으로 높게 형성된다.",
     "적자기업의 상대가치 평가에는 PER이 가장 적합하다."],
  a:3,
  e:["PER = 주가 ÷ EPS.",
     "EV/EBITDA는 이자·감가상각 전 지표로 비교가능성이 높다.",
     "PBR = ROE × PER 관계로 ROE가 높을수록 PBR이 높다.",
     "정답: EPS가 음수면 PER을 산출할 수 없어 PSR·EV/EBITDA·PBR 등을 사용한다."],
  tip:"잔여이익모형(RIM)에서 PBR = 1 + (ROE − r)/(r − g). 즉 ROE가 요구수익률 r을 초과할 때만 PBR이 1을 넘는다. '가치 창출 = ROE > COE'라는 원리를 기억해 두면 좋다."},
 {q:"기술적 분석에 대한 설명으로 가장 거리가 먼 것은?",
  c:["과거 가격·거래량 패턴이 반복된다는 가정에 기초한다.",
     "이동평균선의 골든크로스는 매수 신호로 해석된다.",
     "약형 효율적 시장가설이 성립하면 기술적 분석의 초과수익 획득은 어렵다.",
     "기업의 내재가치를 계산하여 저평가 종목을 찾는 데 주로 사용된다."],
  a:3,
  e:["추세와 패턴의 반복성을 전제한다.",
     "단기선이 장기선을 상향 돌파하면 매수 신호로 본다.",
     "약형 EMH는 과거 가격정보의 무용성을 의미한다.",
     "정답: 내재가치 산정은 기본적 분석의 영역이다."],
  tip:"효율적 시장가설의 단계: 약형(과거 가격) → 준강형(공개정보) → 강형(내부정보 포함). 준강형이 성립하면 공시 기반 기본적 분석도 초과수익을 내기 어렵다."}
]},
{unit:"리스크관리", items:[
 {q:"VaR(Value at Risk)에 대한 설명으로 옳지 않은 것은?",
  c:["일정 신뢰수준에서 일정 기간 발생 가능한 최대 손실 추정치이다.",
     "신뢰수준을 99%에서 95%로 낮추면 VaR 값은 작아진다.",
     "포트폴리오 VaR은 개별 자산 VaR의 단순 합보다 크거나 같다.",
     "VaR은 신뢰수준을 초과하는 꼬리손실의 크기를 알려주지 못한다."],
  a:2,
  e:["VaR의 정의이다.",
     "신뢰수준이 낮을수록 임계값이 작아져 VaR도 작아진다.",
     "정답: 상관계수가 1 미만이면 분산효과로 포트폴리오 VaR ≤ 개별 VaR 합이다.",
     "꼬리 위험은 ES(기대손실)로 보완한다."],
  tip:"델타-노말법은 계산이 쉽지만 비선형 포지션(옵션)에 부정확하고, 역사적 시뮬레이션은 분포 가정이 불필요하나 과거 데이터에 의존한다. 몬테카를로는 유연하지만 계산비용이 크다."},
 {q:"신용위험 관리에 대한 설명으로 가장 적절하지 않은 것은?",
  c:["기대손실(EL)은 EAD × PD × LGD로 계산된다.",
     "CDS 프리미엄은 준거자산의 신용위험이 커질수록 상승한다.",
     "기대손실은 대손충당금, 예상외손실은 자기자본으로 대비하는 것이 원칙이다.",
     "장외파생상품의 신용위험은 계약 체결 시점에 확정되어 변하지 않는다."],
  a:3,
  e:["EL = EAD × PD × LGD.",
     "CDS 스프레드는 신용위험의 시장가격이다.",
     "EL은 충당금, UL은 자본으로 흡수한다.",
     "정답: 장외파생상품은 시장가격 변동에 따라 대체비용(현재노출)이 계속 변한다."],
  tip:"장외파생 신용노출은 '현재노출 + 잠재노출'로 측정한다. 잔존만기가 길수록 잠재노출이 커지며, 중앙청산소(CCP)·증거금·네팅 계약으로 이를 경감한다."}
]},
{unit:"직무윤리", items:[
 {q:"금융투자업 종사자의 직무윤리 중 '고객우선의 원칙'과 '신의성실의 원칙'에 대한 설명으로 옳지 않은 것은?",
  c:["두 원칙은 직무윤리의 근간이 되는 2대 기본원칙이다.",
     "신의성실의 원칙은 윤리적 의무인 동시에 법적 의무의 성격을 갖는다.",
     "이해상충이 발생할 경우 회사의 이익을 고객의 이익보다 우선한다.",
     "고객우선의 원칙은 금융소비자 보호의무의 기초가 된다."],
  a:2,
  e:["고객우선·신의성실이 2대 기본원칙이다.",

     "고객 이익 최우선 원칙에서 보호의무가 도출된다."],
  tip:"이해상충 관리의 3단계는 ①공시(Disclosure) ②저감(Mitigation) ③거래 회피(Avoid)다. 낮출 수 없으면 거래 자체를 하지 말아야 한다."},
 {q:"금융투자회사 임직원의 매매거래 제한에 대한 설명으로 가장 거리가 먼 것은?",
  c:["자기계산 매매는 원칙적으로 1개의 회사에 1개의 계좌만 개설할 수 있다.",
     "분기별로 매매명세를 소속 회사에 통지해야 한다.",
     "고객의 주문정보를 이용해 선행매매를 하는 것은 금지된다.",
     "임직원은 어떠한 경우에도 금융투자상품을 매매할 수 없다."],

     "선행매매(front running)는 불건전 영업행위로 금지된다.",
     "정답: 매매 자체가 전면 금지되는 것이 아니라 절차·신고 등 제한 하에 허용된다."],
  tip:"스캘핑(조사분석자료 공표 전후 매매)은 공표 후 24시간 경과 전 자기계산 매매가 금지된다. 선행매매·스캘핑·과당매매는 대표적 불건전 영업행위 3종으로 함께 묶어 기억하면 좋다."}
]},
{unit:"법규", items:[
 {q:"자본시장법상 투자권유에 대한 설명으로 옳지 않은 것은?",

     "투자자가 요청하지 않은 장외파생상품의 방문·전화 권유는 금지된다.",
     "투자권유를 거부한 투자자에게 계속 권유하는 행위는 금지된다.",

  a:3,
  e:["적합성 원칙에 따른 Know-Your-Customer 절차이다.",
     "불초청 권유 금지의 대표 사례가 장외파생상품이다.",
     "재권유 금지 원칙이다.",
     "정답: 설명의무 등 투자자 보호 규제는 원칙적으로 일반투자자에게 적용된다."],
  tip:"적합성 원칙은 '권유하는 상품이 투자자에게 맞는가', 적정성 원칙은 '투자자가 스스로 원하는 파생상품 등 고위험 상품이 적정한가'를 확인하는 것으로 적용 국면이 다르다."},
 {q:"자본시장법상 집합투자기구에 대한 설명으로 가장 적절하지 않은 것은?",
  c:["환매금지형 집합투자기구는 존속기간을 정한 경우에 설정할 수 있다.",
     "MMF는 편입 자산의 신용등급과 잔존만기에 제한이 있다.",
     "집합투자재산은 신탁업자에게 보관·관리를 위탁해야 한다.",
     "모든 집합투자증권은 투자자가 언제든지 환매를 청구할 수 있다."],

  e:["폐쇄형은 존속기간을 정해 설정하고 90일 이내 상장한다.",

     "집합투자재산 보관·관리는 신탁업자의 업무다.",

  tip:"환매연기 사유(자산 처분 불가능, 투자자 간 형평 저해 등)가 발생하면 집합투자자총회 결의로 환매를 연기할 수 있다. 이때 정상자산과 부실자산을 분리하는 펀드분리(Side Pocket)도 가능하다."}
]},
{unit:"주식", items:[
 {q:"배당할인모형(DDM)에 따라 다음 주식의 이론가격은? (차기 배당 1,000원, 요구수익률 10%, 배당성장률 4%)",
  c:["10,000원","12,500원","16,667원","25,000원"],
  a:2,
  e:["요구수익률만으로 나눈 값으로 성장률을 반영하지 않은 오답이다.",
     "분모 계산 오류에 해당한다.",
     "정답: P = D1 ÷ (r − g) = 1,000 ÷ (0.10 − 0.04) = 16,667원.",
     "성장률을 잘못 적용한 값이다."],
  tip:"g는 '유보율 × ROE'로 추정하는 것이 일반적이다(지속가능성장률). g가 r에 근접할수록 가격이 폭발적으로 커지므로, 고성장 가정은 2단계 모형으로 나눠 적용하는 것이 안전하다."},
 {q:"주식 유통시장과 발행시장에 대한 설명으로 옳지 않은 것은?",
  c:["유상증자 중 주주배정은 기존 주주에게 신주인수권을 부여한다.",
     "무상증자는 자본금이 증가하지만 기업의 순자산 총액은 변하지 않는다.",
     "주식분할은 발행주식수가 증가하고 자본금도 함께 증가한다.",
     "자사주 매입은 발행주식수를 줄여 주당지표를 개선하는 효과가 있다."],
  a:2,
  e:["주주배정 방식의 정의이다.",
     "잉여금의 자본전입이므로 순자산 총액은 불변이다.",
     "정답: 주식분할은 액면가가 낮아지고 주식수가 늘 뿐 자본금은 변하지 않는다.",
     "자사주 매입·소각은 EPS·ROE 개선 효과가 있다."],
  tip:"무상증자는 잉여금 → 자본금 대체로 자본금이 증가하지만, 주식분할은 액면분할이라 자본금 불변이다. '무상증자 = 자본금↑, 분할 = 자본금 불변'이 시험 단골 비교 포인트다."}
]},
{unit:"채권", items:[
 {q:"채권의 듀레이션에 대한 설명으로 옳지 않은 것은?",
  c:["다른 조건이 같다면 만기가 길수록 듀레이션은 길어진다.",
     "표면이자율이 높을수록 듀레이션은 짧아진다.",
     "무이표채의 듀레이션은 잔존만기와 같다.",
     "만기수익률이 상승하면 듀레이션은 길어진다."],
  a:3,
  e:["만기와 듀레이션은 정(+)의 관계다.",
     "쿠폰이 클수록 현금흐름이 앞당겨져 듀레이션이 짧아진다.",
     "무이표채는 만기에 한 번만 현금흐름이 있어 듀레이션 = 만기.",

  tip:"가격변화율 ≈ −수정듀레이션 × Δy + ½ × 볼록성 × (Δy)². 듀레이션은 1차 근사라 금리 변동폭이 클수록 오차가 커지고, 볼록성이 이를 보정한다. 볼록성이 큰 채권은 금리 하락 시 더 오르고 상승 시 덜 떨어진다."},
 {q:"수익률곡선에 대한 설명으로 가장 거리가 먼 것은?",
  c:["유동성선호이론에 따르면 장기채에 유동성 프리미엄이 요구된다.",

     "수익률곡선이 우하향하면 통상 향후 경기 확장 신호로 해석된다."],
  a:3,
  e:["유동성선호이론의 핵심이다.",
     "불편기대이론의 정의이다.",

const LB=["①","②","③","④"];
let idx=0, done=0, ok=0, total=0;
const root=document.getElementById('root');

DATA.forEach(function(u){
  const sec=document.createElement('section');
  sec.className='unit';
  sec.innerHTML='<div class="unit-head"><h2>'+u.unit+' <small>('+u.items.length+'문항)</small></h2></div>';
  u.items.forEach(function(it){
    idx++; total++;
    const n=idx;
    const div=document.createElement('div');
    div.className='q';
    let html='<p class="q-title"><span class="num">Q'+n+'</span>'+it.q+'</p><ul class="choices" id="ch'+n+'">';
    it.c.forEach(function(c,i){ html+='<li data-i="'+i+'">'+LB[i]+' '+c+'</li>'; });
    html+='</ul><button class="btn" id="bt'+n+'">정답 보기</button>';
    html+='<div class="ans-box" id="ab'+n+'"><div class="verdict" id="vd'+n+'"></div>'+
          '<div class="ans-line">정답: '+LB[it.a]+' '+it.c[it.a]+'</div><div class="exp"><div class="each">';
    it.e.forEach(function(e,i){ html+='<div><b>'+LB[i]+'</b> '+e+'</div>'; });
    html+='</div></div>';
    if(it.tip) html+='<div class="tip"><b>📚 심화 학습 · 관련 자료</b>'+it.tip+'</div>';
    html+='</div>';
    div.innerHTML=html;
    sec.appendChild(div);

    setTimeout(function(){
      const ul=document.getElementById('ch'+n), box=document.getElementById('ab'+n),
            vd=document.getElementById('vd'+n), bt=document.getElementById('bt'+n);
      let answered=false;
      function reveal(sel){
        box.classList.add('show');
        Array.prototype.forEach.call(ul.children,function(li){
          const i=+li.dataset.i;
          li.classList.add('locked');
          if(i===it.a) li.classList.add('correct');
          if(sel!==null && i===sel && i!==it.a) li.classList.add('wrong');
          if(i===it.a && !li.querySelector('.mark')) li.insertAdjacentHTML('afterbegin','<span class="mark">✔ 정답</span>');
          if(sel!==null && i===sel && i!==it.a) li.insertAdjacentHTML('afterbegin','<span class="mark">✘ 선택</span>');
        });
        if(sel===null){ vd.textContent='정답과 해설을 확인하세요.'; vd.className='verdict'; }
        else if(sel===it.a){ vd.textContent='⭕ 정답입니다!'; vd.className='verdict ok'; }
        else { vd.textContent='❌ 오답입니다. (선택: '+LB[sel]+' / 정답: '+LB[it.a]+')'; vd.className='verdict no'; }
        bt.textContent='해설 접기';
      }
      Array.prototype.forEach.call(ul.children,function(li){
        li.addEventListener('click',function(){
          if(answered) return;
          answered=true;
          const sel=+li.dataset.i;
          done++; if(sel===it.a) ok++;
          upd(); reveal(sel);
        });
      });
      bt.addEventListener('click',function(){
        if(box.classList.contains('show')){ box.classList.remove('show'); bt.textContent='정답 보기'; return; }
        if(!answered){ answered=true; done++; upd(); reveal(null); }
        else { box.classList.add('show'); bt.textContent='해설 접기'; }
      });
    },0);
  });
  root.appendChild(sec);
});

function upd(){
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-rate').textContent=(done?Math.round(ok/done*100):0)+'%';
}
document.getElementById('s-total').textContent=total;

(function(){
  const d=new Date();
  const p=function(x){return String(x).padStart(2,'0')};
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('gen').textContent='생성일시: '+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+
    ' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' ('+tz+')';
})();
</script>
</body>
</html>
