<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자자산운용사 문제은행 2026-09-18</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --sub:#64748b;
    --brand:#1d4ed8; --brand-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
    --no:#dc2626; --no-soft:#fef2f2; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.65;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header.top{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;border-radius:16px;
    padding:26px 22px;margin-bottom:22px;box-shadow:0 6px 20px rgba(29,78,216,.18);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;}
  header.top p{margin:2px 0;font-size:.9rem;opacity:.95;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 24px;}
  .stat{flex:1 1 120px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:center;}
  .stat b{display:block;font-size:1.3rem;color:var(--brand);}
  .stat span{font-size:.78rem;color:var(--sub);}
  section.unit{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:0 0 8px;margin-bottom:26px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.04);}
  .unit-head{background:var(--brand-soft);border-bottom:2px solid #bfdbfe;padding:14px 18px;}
  .unit-head h2{margin:0;font-size:1.12rem;font-weight:800;color:#1e3a8a;}
  .unit-head small{color:var(--sub);font-weight:600;}
  .q{padding:18px;border-bottom:1px dashed var(--line);}
  .q:last-child{border-bottom:none;}
  .q-title{font-weight:700;margin:0 0 12px;font-size:1rem;}
  .q-title .num{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;
    padding:1px 8px;font-size:.8rem;margin-right:8px;}
  ul.choices{list-style:none;margin:0;padding:0;}
  ul.choices li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;
    cursor:pointer;background:#fbfdff;transition:.15s;font-size:.95rem;}
  ul.choices li:hover{border-color:var(--brand);background:#f0f7ff;}
  ul.choices li .mark{float:right;font-weight:800;}
  li.correct{background:var(--ok-soft);border-color:var(--ok);color:#065f46;font-weight:600;}
  li.wrong{background:var(--no-soft);border-color:var(--no);color:#991b1b;font-weight:600;}
  li.locked{cursor:default;}
  .btn{margin-top:6px;background:#fff;border:1.5px solid var(--brand);color:var(--brand);
    border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.9rem;}
  .btn:hover{background:var(--brand);color:#fff;}
  .ans-box{display:none;margin-top:12px;border:1.5px solid #cbd5e1;border-left:6px solid var(--brand);
    border-radius:10px;background:#f8fafc;padding:14px;}
  .ans-box.show{display:block;}
  .verdict{font-weight:800;margin-bottom:8px;font-size:.95rem;}
  .verdict.ok{color:var(--ok);} .verdict.no{color:var(--no);}
  .ans-line{font-weight:800;color:#1e3a8a;margin-bottom:8px;}
  .exp{font-size:.9rem;color:#334155;}
  .exp .each{margin-top:8px;padding-top:8px;border-top:1px dotted #cbd5e1;}
  .exp .each div{margin:3px 0;}
  .tip{margin-top:10px;background:#fffbeb;border:1px solid #fcd34d;border-left:6px solid #f59e0b;
    border-radius:10px;padding:11px 13px;font-size:.88rem;color:#7c2d12;}
  .tip b{display:block;color:#92400e;margin-bottom:4px;font-size:.86rem;}
  footer{text-align:center;color:var(--sub);font-size:.82rem;margin-top:30px;}
  @media (max-width:520px){
    .wrap{padding:14px 10px 40px;} header.top h1{font-size:1.22rem;}
    .q{padding:14px 12px;} ul.choices li{font-size:.92rem;}
  }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>금융투자협회 투자자산운용사 문제은행</h1>
  <p>13개 단위 · 단위별 2문제 · 총 26문제 (4지선다)</p>

</header>

<div id="root"></div>

<footer>학습용 자료 · 실제 시험 문항과 다를 수 있습니다.</footer>
</div>

     "정답: 부동산 경기는 일반 경기와 <b>시차</b>를 두고 움직이며, 부문별로도 다르다. 일반적으로 <b>주거용은 일반 경기와 역행하거나 후행</b>하고, <b>상업용·공업용은 대체로 동행</b>하는 경향이 있다. '항상 정확히 일치'한다는 서술은 틀렸다."],
  tip:"국면별 특징을 거래 주도권으로 기억하면 쉽다. <b>회복기</b>(공실 감소, 거래 증가, 매도자 우위로 전환) → <b>상향기</b>(가격 급등, <b>매도자 우위</b> 뚜렷, 건축 착공 증가) → <b>후퇴기</b>(거래 위축, 매수자 우위로 전환) → <b>하향기</b>(공실 증가, <b>매수자 우위</b>, 가격 하락). 여기에 <b>안정기</b>를 더해 5국면으로 보기도 하는데, 안정기는 위치가 좋은 부동산이 경기와 무관하게 가치를 유지하는 상태를 말한다. 한편 과거의 사례 가격은 회복기·상향기에는 <b>하한선</b>으로, 후퇴기·하향기에는 <b>상한선</b>으로 작용한다는 서술도 자주 출제된다."},
 {q:"감정가액 50억원인 상업용 부동산을 담보로 대출을 받으려 한다. 금융기관은 LTV 60% 이내, DSCR 1.25 이상을 요구한다. 이 부동산의 연간 순영업소득(NOI)이 4억원이고 대출은 연 5% 이자만 상환하는 조건일 때, 받을 수 있는 최대 대출금액은?",
  c:["30억원","40억원","50억원","64억원"],
  a:0,
  e:["정답: <b>LTV 기준</b> 50억 × 60% = <b>30억원</b>. <b>DSCR 기준</b> 허용 부채서비스액 = 4억 ÷ 1.25 = 3.2억원 → 대출한도 = 3.2억 ÷ 0.05 = <b>64억원</b>. 두 기준을 <b>모두</b> 충족해야 하므로 <b>둘 중 작은 금액인 30억원</b>이 최대 대출금액이다.",
     "두 기준의 중간값을 취한 것이 아니다. 반드시 더 보수적인 쪽을 따른다.",
     "감정가액에 다른 비율을 적용한 값이다.",
     "DSCR 기준만 적용한 값이다. LTV 60% 제약을 넘으므로 실행할 수 없다."],
  tip:"대출 한도는 <b>담보 관점(LTV)</b>과 <b>상환능력 관점(DSCR)</b>을 <b>동시에</b> 충족해야 하며, 항상 <b>더 작은 금액</b>이 실제 한도가 된다. 어느 쪽이 걸림돌이 되는지를 보면 시장 상황도 읽힌다. <b>자산 가격이 높고 임대수익률이 낮은 시장</b>에서는 DSCR이, <b>가격이 눌려 있고 수익률이 높은 시장</b>에서는 LTV가 제약이 되는 경우가 많다. 참고로 원리금균등상환 조건이라면 부채서비스액에 원금상환분이 포함되어 DSCR 기준 한도가 더 줄어든다. 개인 주택담보대출에서는 여기에 차주의 전체 소득 대비 원리금을 보는 <b>DSR</b> 규제가 추가된다."}
]},
{unit:"대안투자", items:[
 {q:"벤처캐피탈(VC) 투자에 관한 설명으로 옳지 않은 것은?",
  c:["창업 초기 기업에 지분 형태로 투자하여 성장 후 회수를 목표로 한다.",
     "투자 단계는 시드, 시리즈 A·B·C 등으로 구분되며 단계가 올라갈수록 기업가치와 투자금액이 커진다.",
     "상환전환우선주(RCPS)는 하방을 방어하면서 상승에 참여할 수 있어 VC가 선호하는 투자 수단이다.",
     "VC 투자는 개별 기업의 성공 확률이 높아 포트폴리오 내 대부분의 투자에서 수익이 발생한다."],
  a:3,
  e:["창업투자회사·신기술사업금융회사 등이 조합(펀드)을 결성해 투자하며, 경영 자문도 함께 제공한다.",
     "후기 단계일수록 불확실성이 줄어 밸류에이션이 높아지고, 프리 IPO 단계에서는 상장 직전 투자가 이루어진다.",
     "RCPS는 상환권(채권 성격)과 전환권(주식 성격)을 함께 지닌 대표적 메자닌형 수단이다.",
     "정답: VC 투자는 <b>대부분의 투자가 실패하거나 원금 수준에 그치고, 소수의 대박이 전체 수익을 좌우</b>하는 구조다. 이를 <b>멱법칙(Power Law)</b>이라 하며, 그래서 개별 기업의 성공률이 아니라 <b>포트폴리오 전체의 기대수익</b>으로 접근한다."],
  tip:"VC 펀드의 성과 특성을 이해하자. 초기 몇 년은 관리보수와 손실 인식 때문에 수익률이 음(−)으로 나타났다가 후반에 회수가 몰리며 급상승하는 <b>J커브</b>를 그린다. 성과 지표로는 <b>IRR</b>과 함께 <b>DPI</b>(실제 분배액 ÷ 납입액, 현금으로 돌려준 배수), <b>RVPI</b>(잔존 가치 배수), 이 둘을 합한 <b>TVPI</b>(총가치 배수)를 사용한다. 회수(Exit) 경로는 <b>IPO, M&A, 세컨더리 매각, 상환권 행사</b>가 있으며, 국내에서는 M&A 시장이 얇아 <b>IPO 의존도가 높다</b>는 점이 구조적 한계로 지적된다."},
 {q:"차입매수(LBO, Leveraged Buyout)에 관한 설명으로 옳지 않은 것은?",
  c:["인수 대상 기업의 자산이나 현금흐름을 담보·상환재원으로 삼아 차입금으로 인수하는 방식이다.",
     "적은 자기자본으로 큰 기업을 인수할 수 있어 성공 시 자기자본수익률이 크게 높아진다.",
     "안정적인 현금흐름과 낮은 기존 부채비율을 가진 기업이 LBO 대상으로 적합하다.",
     "인수 후 대상 회사의 자산을 인수자의 차입금 담보로 제공하는 것은 국내에서 아무런 법적 문제가 없다."],
  a:3,
  e:["LBO는 PEF의 대표적인 바이아웃 기법으로, 인수금융의 상환을 대상 기업이 부담하는 구조다.",
     "레버리지 효과로 지분수익률이 증폭되지만, 실패 시 손실도 함께 증폭된다.",
     "차입금을 갚아 나가야 하므로 예측 가능한 현금흐름과 차입 여력이 필수 조건이다.",
     "정답: 인수 대상 회사의 자산을 인수자의 차입 담보로 제공하면 <b>회사와 소수주주·채권자에게 손해</b>를 끼칠 수 있어, 우리 판례는 이를 <b>업무상 배임</b>으로 인정한 사례가 있다. 실무에서는 합병 후 자산 활용, 적정 대가 지급 등 <b>배임 위험을 피하는 구조 설계</b>가 핵심 쟁점이다."],
  tip:"LBO의 수익 원천을 세 가지로 분해해 이해하자. ① <b>영업개선(EBITDA 증가)</b> ② <b>멀티플 확대</b>(인수 배수보다 높은 배수로 매각) ③ <b>부채 상환(Deleveraging)</b> — 기업가치가 그대로여도 부채가 줄면 지분가치가 커진다. 자금 구조는 <b>선순위 인수금융 → 메자닌 → 자기자본</b>으로 층을 이루며, 뒤로 갈수록 요구수익률이 높다. 한편 경영진이 참여하면 <b>MBO</b>, 외부 경영진을 영입하면 <b>MBI</b>라 부른다."}
]},
{unit:"해외증권", items:[
 {q:"해외채권 투자와 국가신용등급에 관한 설명으로 옳지 않은 것은?",
  c:["소버린 리스크는 국가가 채무를 이행하지 않거나 이행을 제한할 위험을 말한다.",
     "국가신용등급은 일반적으로 해당 국가 기업의 신용등급 상한으로 작용하는 경향이 있다.",
     "국가신용등급이 강등되면 해당국 채권의 가산금리(스프레드)가 확대된다.",
     "자국 통화로 발행한 국채는 발행국이 화폐를 찍어낼 수 있으므로 어떤 위험도 존재하지 않는다."],
  a:3,
  e:["채무불이행뿐 아니라 외환 송금 제한 등 <b>이전위험(transfer risk)</b>도 소버린 리스크에 포함된다.",
     "이른바 <b>소버린 실링(sovereign ceiling)</b>으로, 국가등급을 넘는 기업등급은 예외적으로만 부여된다.",
     "등급 강등은 조달비용 상승과 자본 유출로 이어져 국채 가격을 떨어뜨린다.",
     "정답: 자국 통화 국채라도 위험이 없는 것은 아니다. 화폐 발행으로 명목상 상환은 가능하지만 그 결과 <b>인플레이션과 통화 가치 하락</b>이 발생해 실질가치가 훼손되며, 외국인 투자자에게는 <b>환손실</b>로 나타난다. 실제로 자국 통화 표시 국채의 <b>채무재조정 사례</b>도 존재한다."],
  tip:"국가신용등급 표기를 세 기관 기준으로 외워 두자. <b>투자등급 하한</b>은 S&P·Fitch의 <b>BBB−</b>, Moody's의 <b>Baa3</b>이며, 그 아래는 투기등급(하이일드)이다. 한편 같은 국가라도 <b>외화 표시 등급</b>과 <b>자국 통화 표시 등급</b>이 다르게 부여되며, 보통 자국 통화 등급이 같거나 높다. 신흥국 채권에 투자할 때는 <b>현지 통화 표시 채권(Local Currency)</b>과 <b>달러 표시 채권(Hard Currency)</b>을 구분해야 하는데, 전자는 환위험이 크고 후자는 소버린 신용위험이 더 직접적으로 반영된다."},
 {q:"원/달러 환율이 1,300원이고 엔/달러 환율이 150엔일 때, 재정환율로 계산한 원/엔 환율(100엔당)은?",
  c:["650.00원","866.67원","1,150.00원","1,950.00원"],
  a:1,
  e:["환율을 반대로 나눈 경우의 값이다.",
     "정답: 원/엔 = (원/달러) ÷ (엔/달러) = 1,300 ÷ 150 = 8.6667원/엔. 우리나라는 <b>100엔 단위</b>로 고시하므로 × 100 = <b>866.67원</b>",
     "두 환율을 단순히 빼거나 더한 경우의 값이다.",
     "두 환율을 곱한 값(1,300 × 150 ÷ 100)으로, 계산 방향이 틀렸다."],
  tip:"<b>재정환율(Cross Rate)</b>은 두 통화의 <b>공통 기준통화(보통 달러)</b>를 매개로 산출한다. 우리나라의 원/달러 환율은 시장에서 직접 결정되는 <b>기준환율</b>이고, 원/엔·원/유로 등 나머지는 모두 재정환율이다. 계산 시 <b>표기 방향</b>에 주의해야 한다. 원/달러(1,300)와 엔/달러(150)는 모두 <b>달러가 분모</b>이므로 나누면 달러가 소거된다. 반면 유로/달러(1.10)처럼 <b>달러가 분자</b>인 통화는 곱해야 한다(원/유로 = 1,300 × 1.10 = 1,430원). 실무에서는 재정환율이 어긋나면 <b>삼각 차익거래</b>가 발생해 즉시 균형으로 되돌아간다."}
]},
{unit:"투자분석", items:[
 {q:"두 자산 A, B에 각각 50%씩 투자하여 포트폴리오를 구성한다. 두 자산의 수익률 표준편차가 모두 20%이고 상관계수가 0일 때, 이 포트폴리오의 표준편차에 가장 가까운 값은?",
  c:["10.00%","14.14%","17.32%","20.00%"],
  a:1,
  e:["분산효과를 과대하게 적용한 값이다.",
     "정답: σp² = (0.5)²(0.2)² + (0.5)²(0.2)² + 2(0.5)(0.5)(0)(0.2)(0.2) = 0.01 + 0.01 + 0 = 0.02 → σp = √0.02 ≒ <b>14.14%</b>. 상관계수가 0이어도 <b>분산효과가 발생</b>하여 개별 위험 20%보다 낮아진다.",
     "상관계수를 0.5로 적용했을 때의 값이다.",
     "상관계수가 <b>+1</b>일 때의 값으로, 이 경우에만 분산효과가 전혀 없어 가중평균(20%)이 된다."],
  tip:"상관계수에 따른 극단값을 외워 두면 계산 없이도 검산할 수 있다. 동일 비중·동일 표준편차(σ) 두 자산이라면 <b>ρ=+1 → σp=σ</b>(분산효과 0), <b>ρ=0 → σp=σ/√2 ≒ 0.707σ</b>, <b>ρ=−1 → σp=0</b>(위험 완전 제거). 즉 포트폴리오 위험은 항상 <b>가중평균 이하</b>이며, 상관계수가 <b>1보다 작기만 하면</b> 분산효과가 존재한다. 여기서 도출되는 핵심 결론이 <b>비체계적 위험은 분산으로 제거되지만 체계적 위험은 남는다</b>는 것이며, 종목 수를 늘려도 위험이 <b>0으로 수렴하지 않고 시장위험 수준에서 멈추는</b> 이유가 여기에 있다."},
 {q:"기업의 재무비율 분석에 관한 설명으로 옳지 않은 것은?",
  c:["유동비율과 당좌비율은 단기 지급능력을 나타내는 유동성 지표이다.",
     "부채비율과 이자보상배율은 재무 안정성을 나타내는 지표이다.",
     "총자산회전율과 재고자산회전율은 자산의 활용 효율을 나타내는 활동성 지표이다.",
     "이자보상배율이 1보다 작으면 영업이익으로 이자를 충분히 감당하고 있다는 뜻이다."],
  a:3,
  e:["당좌비율은 유동자산에서 재고자산을 뺀 당좌자산 기준이므로 유동비율보다 보수적인 지표다.",
     "부채비율(타인자본÷자기자본)은 자본구조를, 이자보상배율은 이자 지급 능력을 본다.",
     "회전율이 높을수록 적은 자산으로 많은 매출을 올린다는 뜻이다.",
     "정답: <b>이자보상배율 = 영업이익 ÷ 이자비용</b>이므로, <b>1보다 작다</b>는 것은 영업이익으로 이자조차 감당하지 못한다는 뜻이다. 통상 <b>3년 연속 1 미만</b>인 기업을 한계기업(좀비기업)으로 분류한다."],
  tip:"비율을 <b>4대 범주</b>로 묶어 정리하자. ① <b>유동성</b>: 유동비율, 당좌비율 ② <b>안정성(레버리지)</b>: 부채비율, 자기자본비율, 이자보상배율 ③ <b>활동성</b>: 총자산·재고자산·매출채권 회전율 ④ <b>수익성</b>: 영업이익률, ROA, ROE. 여기에 <b>성장성</b>(매출액·순이익 증가율)을 더하기도 한다. 비율 분석의 한계도 함께 기억하자. <b>회계처리 방법의 차이</b>, <b>과거 자료 기반</b>, <b>산업별 적정 수준의 차이</b>, <b>계절성</b> 때문에 단일 비율만으로 판단해서는 안 되며, <b>동종업계 비교(cross-section)</b>와 <b>시계열 추세 분석</b>을 병행해야 한다."}
]},
{unit:"리스크관리", items:[
 {q:"장외파생상품 거래의 거래상대방 위험 관리에 관한 설명으로 옳지 않은 것은?",
  c:["중앙청산소(CCP)는 거래 당사자 사이에 끼어들어 결제이행을 보장한다.",
     "일일정산과 증거금 교환을 통해 누적된 손실이 커지는 것을 막는다.",
     "네팅(Netting) 약정은 다수의 거래를 상계하여 실제 익스포저를 줄인다.",
     "CCP를 통한 청산은 거래상대방 위험을 완전히 없애므로 CCP 자체의 건전성은 문제되지 않는다."],
  a:3,
  e:["CCP는 매도자에게는 매수자가, 매수자에게는 매도자가 되어 개별 거래상대방 위험을 흡수한다.",
     "변동증거금(VM)으로 일일 손익을 정산하고, 개시증거금(IM)으로 청산 기간 중의 잠재손실에 대비한다.",
     "ISDA 기본계약서의 <b>일괄정산네팅(close-out netting)</b>은 도산 시 익스포저를 순액으로 줄이는 핵심 장치다.",
     "정답: CCP는 거래상대방 위험을 <b>없애는 것이 아니라 한곳으로 집중</b>시킨다. 따라서 CCP 자체가 <b>시스템적으로 중요한 기관</b>이 되며, 그 부실은 시장 전체의 위기로 번질 수 있다. 이를 대비해 증거금, 청산기금, 자기자본을 순차 사용하는 <b>디폴트 워터폴(Default Waterfall)</b>과 회생·정리계획이 요구된다."],
  tip:"글로벌 금융위기 이후 장외파생상품 규제는 네 가지 축으로 개편되었다. ① <b>표준화된 상품의 CCP 의무청산</b> ② <b>비청산 거래에 대한 증거금 교환 의무</b> ③ <b>거래정보저장소(TR) 보고 의무</b> ④ <b>전자거래플랫폼 이용</b>. 신용위험 조정 개념도 함께 알아 두자. 파생상품 평가액에 거래상대방의 부도 가능성을 반영한 것이 <b>CVA(신용가치조정)</b>, 자기 자신의 부도 가능성을 반영한 것이 <b>DVA</b>이며, 이들을 통칭해 <b>XVA</b>라 한다."},
 {q:"금융기관의 금리리스크 관리에 관한 설명으로 옳지 않은 것은?",
  c:["금리 갭(Gap)은 일정 기간 내 금리 재설정 자산과 부채의 차이를 의미한다.",
     "양(+)의 갭 상태에서 금리가 상승하면 순이자이익이 증가한다.",
     "듀레이션 갭이 양(+)이면 금리 상승 시 자기자본의 순자산가치가 감소한다.",
     "듀레이션 갭을 0으로 만들면 금리가 변해도 순이자이익이 항상 일정하게 유지된다."],
  a:3,
  e:["금리 재설정(repricing) 시점을 기준으로 자산과 부채를 만기 구간별로 나누어 측정한다.",
     "금리민감자산이 부채보다 많으므로, 금리가 오르면 이자수익이 이자비용보다 더 많이 늘어난다.",
     "자산의 듀레이션이 부채보다 길다는 뜻이므로, 금리 상승 시 자산 가치가 더 크게 떨어진다.",
     "정답: 듀레이션 갭을 0으로 맞추는 것은 <b>순자산가치(경제적 가치)를 금리 변동으로부터 면역</b>시키는 것이지, <b>순이자이익(수익 관점)</b>까지 고정하는 것은 아니다. 금리리스크는 <b>수익 관점(NII)</b>과 <b>경제적 가치 관점(EVE)</b>에서 각각 측정해야 하며, 두 관점의 결과가 서로 다를 수 있다."],
  tip:"금리리스크는 네 가지 원천으로 나뉜다. ① <b>재가격위험(repricing risk)</b> — 만기·재설정 시점의 불일치 ② <b>수익률곡선위험</b> — 곡선의 기울기 변화 ③ <b>베이시스위험</b> — 준거금리가 달라 연동이 어긋남(예: 자산은 CD금리, 부채는 코픽스) ④ <b>옵션성위험</b> — 조기상환권·중도해지권 등 고객의 선택권. 바젤은 이를 <b>IRRBB(은행계정 금리리스크)</b>로 규율하며, <b>ΔNII</b>와 <b>ΔEVE</b> 두 지표를 모두 산출하도록 요구한다. 헤지 수단으로는 <b>금리스왑</b>이 가장 널리 쓰이는데, 자산 듀레이션이 길어 갭이 양(+)이면 <b>고정금리 지급·변동금리 수취</b> 스왑으로 듀레이션을 줄인다."}
]},
{unit:"직무윤리", items:[
 {q:"표준투자권유준칙에 따른 투자권유 절차에 관한 설명으로 옳지 않은 것은?",
  c:["투자자 정보를 파악하여 일반금융소비자인지 전문금융소비자인지 확인하는 것이 출발점이다.",
     "일반금융소비자에게는 투자자 정보 확인서를 통해 투자성향을 파악하고 그 결과를 지체 없이 제공해야 한다.",
     "투자자가 자신의 성향보다 위험이 높은 상품을 원하는 경우, 부적합 사실을 알리고 확인을 받아야 한다.",
     "투자자가 투자자 정보 제공을 거부하면 투자권유를 하지 않고 어떤 거래도 진행할 수 없다."],
  a:3,
  e:["금융소비자 유형에 따라 적용되는 보호 규정이 달라지므로 가장 먼저 확인한다.",
     "파악한 투자성향은 지체 없이 투자자에게 제공하고 그 기록을 유지해야 한다.",
     "부적합 상품은 권유할 수 없으며, 투자자가 스스로 원할 경우 <b>부적합 확인서</b>를 받고 거래를 진행할 수 있다.",
     "정답: 정보 제공을 거부하더라도 <b>거래 자체가 금지되는 것은 아니다</b>. 다만 적합성 판단이 불가능하므로 <b>투자권유를 할 수 없고</b>, 투자자가 스스로 특정 상품을 지정해 거래하는 <b>투자권유 불원(不願) 거래</b>는 가능하다. 이 경우 정보 미제공에 따른 불이익을 고지하고 확인서를 받아야 한다."],
  tip:"권유 여부에 따라 적용 원칙이 달라진다는 점이 핵심이다. <b>권유를 하는 경우 → 적합성 원칙</b>, <b>권유 없이 소비자가 스스로 청약하는 경우 → 적정성 원칙</b>이 적용된다. 적정성 원칙은 <b>파생상품·파생결합증권·조건부자본증권 등 고위험 상품</b>에 한해 적용되며, 부적정하다고 판단되면 그 사실을 알리고 확인을 받아야 한다. 절차는 <b>① 투자자 유형 확인 → ② 정보 파악(KYC) → ③ 투자성향 분류 및 통지 → ④ 적합한 상품 선정 → ⑤ 설명의무 이행 및 이해 여부 확인 → ⑥ 기록 유지</b> 순으로 외워 두면 된다."},
 {q:"금융투자업 종사자의 고객에 대한 보고 및 기록유지 의무에 관한 설명으로 옳지 않은 것은?",
  c:["매매가 체결되면 그 명세를 지체 없이 투자자에게 통지해야 한다.",
     "월간 매매내역·잔액 현황 등은 다음 달 20일까지 통지하는 것이 원칙이다.",
     "투자광고, 계약서류, 투자권유 관련 자료 등은 법정 기간 동안 기록·유지되어야 한다.",
     "고객이 통지를 원하지 않는다는 의사를 밝히면 어떠한 기록도 남기지 않아도 된다."],
  a:3,
  e:["체결 즉시 통지가 원칙이며, 통지 방법은 서면·전자우편·전화 등 사전에 합의한 방법으로 한다.",
     "매매가 있었던 달의 다음 달 20일까지 월간 보고를 하도록 규정되어 있다.",
     "자료의 종류에 따라 통상 <b>5년 또는 10년</b>의 보존 기간이 정해져 있다.",
     "정답: 고객이 통지를 원하지 않으면 <b>통지 방법이나 주기를 조정</b>할 수는 있으나, <b>기록·유지 의무는 법정 의무</b>이므로 면제되지 않는다. 기록은 분쟁 발생 시 사실관계를 확인하는 근거가 되며, 오히려 금융회사를 보호하는 장치이기도 하다."],
  tip:"보고 의무의 성격을 이해하자. 이는 단순한 서비스가 아니라 <b>수임인(受任人)의 전말 보고 의무</b>에서 비롯된 법적 의무다. 보고는 <b>① 정확할 것 ② 신속할 것 ③ 고객이 이해할 수 있는 방법일 것</b>을 요건으로 한다. 특히 <b>일임·신탁 계좌</b>에서는 운용 결과를 정기적으로 보고해야 하며, 투자일임보고서는 <b>3개월마다</b> 교부하는 것이 원칙이다. 한편 기록유지 의무 위반은 그 자체로 제재 대상이며, 분쟁 시 <b>입증 자료의 부재</b>로 금융회사가 불리한 판단을 받는 실질적 위험도 따른다."}
]},
{unit:"법규", items:[
 {q:"자본시장법상 금융투자업의 진입규제에 관한 설명으로 옳지 않은 것은?",
  c:["투자매매업과 투자중개업, 집합투자업, 신탁업은 인가 대상이다.",
     "투자자문업과 투자일임업은 등록 대상이다.",
     "인가·등록 시에는 자기자본, 인력, 물적 설비, 사업계획의 타당성 등의 요건을 갖추어야 한다.",
     "인가와 등록은 모두 금융위원회의 재량적 판단에 따라 결정되며 요건 심사의 강도에 차이가 없다."],
  a:3,
  e:["투자자의 재산을 직접 수탁하거나 운용하는 업무일수록 강도 높은 <b>인가제</b>가 적용된다.",
     "상대적으로 투자자 재산을 직접 보관하지 않는 업무는 <b>등록제</b>로 진입 문턱이 낮다.",
     "인가 요건은 진입 시점뿐 아니라 영업 중에도 계속 충족해야 하는 <b>유지 요건</b>이기도 하다.",
     "정답: <b>인가</b>는 사업계획의 타당성, 대주주 적격성 등에 대한 <b>실질적·재량적 심사</b>를 거치는 반면, <b>등록</b>은 법정 요건을 갖추면 원칙적으로 등록해야 하는 <b>형식적 심사</b>에 가깝다. 두 제도의 심사 강도에 차이가 없다는 서술은 틀렸다."],
  tip:"인가·등록 단위는 <b>금융투자업의 종류 × 금융투자상품의 범위 × 투자자의 유형</b>이 조합된 <b>기능별 규제</b> 방식이다. 예컨대 '투자중개업 × 증권 × 일반투자자'가 하나의 단위가 되며, 필요한 단위만 선택해 인가받는다(<b>애드온(add-on) 방식</b>). 한편 진입 요건 중 <b>대주주 요건</b>은 인가 시점에는 엄격하게, 유지 단계에서는 완화해 적용하며, <b>자기자본 요건</b>은 유지 단계에서 인가 시 요건의 <b>70% 이상</b>을 유지하도록 하고 있다. 경영 건전성 규제로는 <b>순자본비율(NCR)</b>이 핵심 지표다."},
 {q:"자본시장법상 투자자 재산의 보호에 관한 설명으로 옳지 않은 것은?",
  c:["투자매매·중개업자는 투자자예탁금을 고유재산과 구분하여 예치기관에 예치·신탁해야 한다.",
     "투자자예탁금은 원칙적으로 상계·압류가 금지된다.",
     "투자자가 예탁한 증권은 한국예탁결제원에 예탁되어 혼장임치 방식으로 관리된다.",
     "투자자예탁금은 증권회사의 고유재산이므로 회사가 파산하면 일반 채권자와 함께 배당받는다."],
  a:3,
  e:["증권금융회사 등 예치기관에 별도로 맡겨 회사의 재산과 섞이지 않도록 하는 것이 핵심이다.",
     "투자자 보호를 위해 예탁금에 대한 상계와 압류를 원칙적으로 금지한다.",
     "종목별로 혼합 보관하되 투자자는 수량에 따른 공유지분을 갖는 방식이다.",
     "정답: 투자자예탁금은 <b>고유재산과 분리</b>되어 별도 예치되므로, 증권회사가 파산하더라도 <b>투자자에게 우선하여 지급</b>된다. 일반 채권자와 함께 배당받는 것이 아니다. 이것이 예탁금 별도예치 제도의 존재 이유다."],
  tip:"투자자 재산 보호 장치를 3중으로 정리하자. ① <b>예탁금 별도예치</b> — 증권금융 등에 예치, 상계·압류 금지, 우선지급 ② <b>예탁증권의 분별보관</b> — 예탁결제원 예탁, 고유재산과 구분 ③ <b>예금자보호</b> — 증권사의 <b>예탁금</b>은 예금보험 대상(1인당 5천만원)이나, <b>주식·펀드 등 투자상품 자체는 보호 대상이 아니다</b>. 즉 시세 하락에 따른 손실은 어떤 제도로도 보전되지 않으며, 보호되는 것은 <b>금융회사의 파산으로 인한 반환 불능</b>뿐이라는 점을 명확히 구분해야 한다."}
]},
{unit:"주식", items:[
 {q:"자기주식(자사주) 취득과 소각에 관한 설명으로 옳지 않은 것은?",
  c:["자기주식을 취득하면 유통주식 수가 줄어 주당순이익(EPS)이 높아지는 효과가 있다.",
     "자기주식은 의결권이 없으며 배당을 받을 권리도 인정되지 않는다.",
     "자기주식을 소각하면 발행주식 총수가 줄어들어 효과가 영구적이다.",
     "자기주식 취득은 배당과 달리 주주에게 현금이 유출되지 않으므로 기업가치에 영향을 주지 않는다."],
  a:3,
  e:["같은 순이익을 더 적은 주식으로 나누게 되므로 EPS가 상승한다.",
     "상법상 자기주식에는 의결권이 없으며, 배당도 배제된다.",
     "취득만 하고 보유하면 언제든 재매각될 수 있어 오버행 우려가 남지만, 소각하면 그 가능성이 사라진다.",
     "정답: 자기주식 취득도 <b>회사의 현금이 유출</b>되는 주주환원이다. 배당이 모든 주주에게 현금을 나눠 주는 것이라면, 자사주 취득은 <b>매도하는 주주에게만</b> 현금이 가고 남은 주주는 지분율 상승으로 이익을 얻는 차이가 있을 뿐이다. 현금 유출이 없다는 서술은 틀렸다."],
  tip:"자사주 취득과 배당의 차이를 정리하자. <b>배당</b>: 전체 주주에게 균등 지급, 배당소득세 즉시 과세, 한 번 올리면 줄이기 어려운 <b>경직성</b>. <b>자사주 취득</b>: 매도 주주에게만 지급, 잔존 주주는 <b>과세이연</b> 효과, 시행 시기와 규모를 조절할 수 있는 <b>유연성</b>. 다만 자사주를 <b>소각하지 않고 보유</b>하면 경영권 방어나 교환사채 발행에 쓰일 수 있어 <b>주주환원 효과가 제한적</b>이라는 비판이 있으며, 이 때문에 최근 제도 개편 논의에서 <b>취득 후 소각</b>이 강조되고 있다. 회계상 자기주식은 자산이 아니라 <b>자본의 차감 항목</b>으로 표시된다는 점도 함께 기억하자."},
 {q:"현재 주가가 12,000원인 기업이 기존 주식 1주당 0.2주 비율로 유상증자를 실시하며, 신주 발행가액은 8,000원이다. 이때 권리락 기준가격은?",
  c:["10,000원","11,000원","11,333원","11,600원"],
  a:2,
  e:["신주 발행가액을 잘못 반영한 값이다.",
     "증자 비율을 잘못 적용한 값이다.",
     "정답: 권리락 기준가 = (권리부 주가 × 기존 주식수 + 신주 발행가 × 신주 수) ÷ (기존 + 신주) = (12,000 × 1 + 8,000 × 0.2) ÷ 1.2 = (12,000 + 1,600) ÷ 1.2 = 13,600 ÷ 1.2 ≒ <b>11,333원</b>",
     "단순 가중평균을 잘못 계산한 값이다."],
  tip:"권리락은 <b>가치의 하락이 아니라 산술적 기준가 재계산</b>이다. 증자 전 주주의 자산은 12,000원이었고, 증자 후에는 주식 1.2주 × 11,333원 = 13,600원에서 납입한 1,600원을 빼면 12,000원으로 <b>변화가 없다</b>. 같은 원리로 <b>무상증자</b>는 신주 발행가가 0이므로 공식이 <b>기존 주가 ÷ (1 + 증자비율)</b>로 단순해진다(12,000 ÷ 1.2 = 10,000원). 배당락도 같은 개념이며, <b>주식배당·액면분할</b> 역시 기준가를 조정한다. 실무에서 권리락 당일 주가가 기준가보다 오르는 것을 <b>권리락 효과</b>라 부르는데, 이는 가격이 싸 보이는 착시와 유동성 개선 기대가 함께 작용한 결과다."}
]},
{unit:"채권", items:[
 {q:"채권의 발행방법에 관한 설명으로 옳지 않은 것은?",
  c:["공모발행은 불특정 다수를 대상으로 하며, 사모발행은 소수의 특정인을 대상으로 한다.",
     "총액인수는 인수기관이 발행물량 전액을 인수한 뒤 투자자에게 매출하는 방식이다.",
     "잔액인수는 모집 후 남은 물량만을 인수기관이 인수하는 방식이다.",
     "총액인수는 잔액인수보다 인수기관의 위험 부담이 작으므로 인수수수료도 낮다."],
  a:3,
  e:["공모는 증권신고서 제출 등 공시의무가 따르고, 사모는 전매제한 조치가 요구된다.",
     "발행사는 즉시 자금을 확보할 수 있고, 미매각 위험은 인수기관이 진다.",
     "발행사가 미매각 위험의 일부를 부담하는 구조다.",
     "정답: <b>총액인수</b>는 인수기관이 <b>전액의 미매각 위험</b>을 떠안으므로 잔액인수보다 위험이 <b>크고</b>, 그만큼 <b>인수수수료도 높다</b>. 위험과 수수료의 관계가 반대로 서술되었다."],
  tip:"발행방식을 위험 부담 순으로 정리하자. <b>모집주선(위탁모집)</b> — 인수기관은 <b>주선만</b> 하고 미매각 위험은 <b>발행사</b>가 부담(위험 최소, 수수료 최저) → <b>잔액인수</b> — 남은 물량만 인수 → <b>총액인수</b> — 전액 인수(위험 최대, 수수료 최고). 한편 발행가액 결정 방식으로는 <b>직접모집</b>(발행사가 직접) 중 <b>매출발행·공모입찰발행</b>이 있고, 입찰은 다시 <b>복수가격(Conventional) 방식</b>과 <b>단일가격(Dutch) 방식</b>으로 나뉜다. 국고채는 <b>차등가격 낙찰(수정 더치) 방식</b>을 쓴다는 점이 자주 출제된다."},
 {q:"현재 1년 만기 현물이자율이 연 3.0%, 2년 만기 현물이자율이 연 4.0%이다. 불편기대가설에 따를 때 1년 후부터 1년간 적용되는 내재선도금리에 가장 가까운 값은?",
  c:["3.5%","4.0%","5.0%","7.0%"],
  a:2,
  e:["두 현물이자율의 단순 평균으로, 선도금리 산출식이 아니다.",
     "2년 현물이자율을 그대로 답한 경우다.",
     "정답: (1 + 0R2)² = (1 + 0R1) × (1 + 1f2) 이므로 <b>1f2 = (1.04)² ÷ 1.03 − 1 = 1.0816 ÷ 1.03 − 1 ≒ 0.0501 → 약 5.0%</b>",
     "두 이자율을 단순히 더한 값이다."],
  tip:"수익률곡선 이론을 세 가지로 구분하자. ① <b>불편기대가설</b> — 선도금리는 <b>미래 현물이자율의 기대값</b>과 같다. 곡선이 우상향하면 시장이 금리 상승을 예상한다는 뜻이다. ② <b>유동성선호가설</b> — 장기채는 유동성이 떨어지므로 <b>유동성 프리미엄</b>이 더해진다. 따라서 선도금리는 기대 현물이자율보다 <b>높게</b> 형성되며, 금리 변화가 없어도 곡선은 <b>우상향</b>한다. ③ <b>시장분할가설</b> — 만기별로 투자자군이 달라 각 구간의 수급이 독립적으로 금리를 결정한다. 실무에서 우상향 곡선을 '금리 상승 기대'로만 해석해서는 안 되는 이유가 ②에 있다."}
]},
{unit:"파생상품", items:[
 {q:"선물의 베이시스에 관한 설명으로 옳지 않은 것은?",
  c:["베이시스는 일반적으로 선물가격에서 현물가격을 뺀 값으로 정의된다.",
     "만기가 가까워질수록 베이시스는 0으로 수렴한다.",
     "베이시스가 이론가격 대비 지나치게 벌어지면 매수차익거래나 매도차익거래가 발생한다.",
     "베이시스가 일정하게 유지되면 헤지 포지션에서 베이시스 위험이 커진다."],
  a:3,
  e:["국내 주가지수선물에서는 통상 '선물 − 현물'로 정의하며, 보유비용이 반영된다.",
     "만기 시점에는 선물이 현물로 결제되므로 두 가격이 일치할 수밖에 없다(수렴성).",
     "선물이 고평가되면 <b>선물 매도 + 현물 매수</b>(매수차익거래), 저평가되면 반대의 <b>매도차익거래</b>가 일어난다.",
     "정답: <b>베이시스 위험은 베이시스가 예상과 달리 변동할 때</b> 발생한다. 베이시스가 <b>일정하게 유지되면</b> 현물과 선물의 손익이 정확히 상쇄되어 <b>베이시스 위험은 오히려 작아진다</b>. 관계가 반대로 서술되었다."],
  tip:"차익거래와 프로그램 매매의 연결 고리를 이해하자. 매수차익거래(선물 매도 + 현물 매수)가 쌓여 있다가 <b>베이시스가 축소</b>되면, 포지션을 청산하기 위해 <b>현물 매도</b>가 일시에 나오며 지수를 끌어내린다. 이것이 프로그램 매물 출회의 전형적인 경로다. 한편 실제 시장의 베이시스는 이론값과 어긋나는데, <b>배당락, 거래비용, 공매도 제약, 세금, 자금조달 금리 차이</b> 때문이다. 이 때문에 차익거래가 가능한 구간은 하나의 점이 아니라 <b>차익거래 불가능 영역(no-arbitrage band)</b>이라는 띠로 나타난다."},
 {q:"어떤 투자자가 A주식 10,000주를 보유하고 있다. A주식을 기초자산으로 하는 콜옵션의 델타가 0.4일 때, 델타중립(델타헤지)을 위해 매도해야 하는 콜옵션의 기초자산 수량은?",
  c:["4,000주","10,000주","25,000주","40,000주"],
  a:2,
  e:["보유 주식 수에 델타를 곱한 값으로, 계산 방향이 반대다.",
     "델타를 반영하지 않고 1:1로 헤지한 경우의 값이다.",
     "정답: 주식의 델타는 1이므로 보유 포지션의 델타는 10,000 × 1 = <b>+10,000</b>. 콜옵션 매도 포지션의 델타는 −0.4이므로, 필요한 수량 N은 10,000 − 0.4N = 0 → <b>N = 25,000주</b>",
     "델타의 역수를 잘못 적용한 값이다."],
  tip:"델타헤지의 핵심은 <b>포트폴리오 전체 델타의 합을 0으로</b> 만드는 것이다. 주식 델타 = 1, 콜 델타 = 0 ~ +1, 풋 델타 = −1 ~ 0임을 기준으로 계산한다. 다만 <b>델타는 고정값이 아니다</b>. 기초자산 가격이 움직이면 델타도 변하는데, 그 변화율이 <b>감마</b>다. 감마가 클수록 델타가 빠르게 변해 <b>재조정(rebalancing)</b>을 자주 해야 하고 거래비용이 늘어난다. 특히 <b>등가격(ATM) + 만기 임박</b> 구간에서 감마가 가장 커져 헤지가 어려워진다. 또한 델타헤지는 <b>방향성 위험만</b> 제거할 뿐 <b>변동성 위험(베가)</b>과 <b>시간가치 감소(세타)</b>는 남는다는 점을 기억해야 한다."}
]},
{unit:"성과분석", items:[
 {q:"국제투자성과기준(GIPS)에 관한 설명으로 옳지 않은 것은?",
  c:["운용사가 성과를 왜곡 없이 공정하게 표시하도록 마련된 자율적 국제 기준이다.",
     "유사한 운용전략을 가진 모든 실계좌를 컴포지트(Composite)로 묶어 성과를 표시해야 한다.",
     "수수료 차감 전 수익률과 차감 후 수익률의 산출 기준을 명확히 공시해야 한다.",
     "운용사는 성과가 우수한 대표 계좌만을 선별하여 컴포지트를 구성할 수 있다."],
  a:3,
  e:["법적 강제 규정이 아니라 준수 여부를 스스로 선언하는 자율 기준이나, 글로벌 기관투자자들이 사실상 요구한다.",
     "컴포지트 구성은 GIPS의 핵심으로, 수수료를 내는 모든 실계좌를 빠짐없이 포함해야 한다.",
     "Gross-of-fees와 Net-of-fees를 구분해 표시하고 산출 방법을 밝혀야 한다.",
     "정답: GIPS가 가장 강하게 금지하는 것이 바로 <b>선별 표시(cherry-picking)</b>다. 성과가 좋은 계좌만 골라 보여 주는 것을 막기 위해 <b>동일 전략의 모든 실계좌를 빠짐없이</b> 컴포지트에 포함하도록 요구한다."],
  tip:"GIPS의 핵심 원칙을 네 가지로 외우자. ① <b>전체 포함(All-inclusive)</b> — 수수료를 내는 모든 실계좌를 해당 컴포지트에 포함, 선별 금지 ② <b>생존편의 제거</b> — 해지된 계좌도 해지 시점까지의 성과를 포함해 <b>생존편의(survivorship bias)</b>를 없앰 ③ <b>시간가중수익률</b> 사용 — 자금 유출입은 운용자의 책임이 아니므로 그 영향을 제거 ④ <b>최소 5년(가능하면 10년) 실적 제시</b>. 한편 <b>성과는 회사(Firm) 단위로 정의</b>해야 하며, 회사의 범위를 임의로 좁혀 유리한 부문만 표시하는 것도 금지된다."},
 {q:"어떤 펀드의 수익률이 1차 연도에 +25%, 2차 연도에 −20%였다. 이 펀드의 연평균 기하수익률은?",
  c:["-2.5%","0.0%","2.5%","5.0%"],
  a:1,
  e:["부호를 잘못 적용한 값이다.",
     "정답: 기하평균 = [(1 + 0.25) × (1 − 0.20)]^(1/2) − 1 = (1.25 × 0.80)^(1/2) − 1 = (1.00)^(1/2) − 1 = <b>0.0%</b>. 100원이 125원이 되었다가 다시 100원이 되었으므로 실제 성과는 0%다.",
     "산술평균 (25% − 20%) ÷ 2 = 2.5%를 계산한 값이다. 실제 자산은 전혀 늘지 않았는데도 <b>양(+)</b>의 수익률로 나타나는 왜곡을 보여 준다.",
     "다른 방식으로 평균을 계산한 값이다."],
  tip:"산술평균과 기하평균의 차이를 반드시 구분하자. <b>산술평균 ≥ 기하평균</b>이며, 수익률의 <b>변동성이 클수록 그 격차가 벌어진다</b>(근사적으로 기하 ≒ 산술 − σ²/2). 그래서 <b>과거 실현 성과를 평가</b>할 때는 복리 효과를 반영한 <b>기하평균</b>을, <b>미래 기대수익률을 추정</b>할 때는 <b>산술평균</b>을 쓰는 것이 원칙이다. 또한 <b>시간가중수익률(TWR)</b>은 자금 유출입의 영향을 제거해 <b>운용자의 능력</b>을 평가하고, <b>금액가중수익률(MWR, = IRR)</b>은 투입 시점까지 반영해 <b>투자자가 실제로 얻은 성과</b>를 보여 준다. 펀드 평가·비교에는 TWR을 쓴다."}
]}
];

const LB=["①","②","③","④"];
let idx=0, done=0, ok=0, total=0;
const root=document.getElementById('root');

DATA.forEach(function(u){
  const sec=document.createElement('section');
  sec.className='unit';
  sec.innerHTML='<div class="unit-head"><h2>'+u.unit+' <small>('+u.items.length+'문항)</small></h2></div>';
  u.items.forEach(function(it){
    idx++; total++;
    const n=idx;
    const div=document.createElement('div');
    div.className='q';
    let html='<p class="q-title"><span class="num">Q'+n+'</span>'+it.q+'</p><ul class="choices" id="ch'+n+'">';
    it.c.forEach(function(c,i){ html+='<li data-i="'+i+'">'+LB[i]+' '+c+'</li>'; });
    html+='</ul><button class="btn" id="bt'+n+'">정답 보기</button>';
    html+='<div class="ans-box" id="ab'+n+'"><div class="verdict" id="vd'+n+'"></div>'+
          '<div class="ans-line">정답: '+LB[it.a]+' '+it.c[it.a]+'</div><div class="exp"><div class="each">';
    it.e.forEach(function(e,i){ html+='<div><b>'+LB[i]+'</b> '+e+'</div>'; });
    html+='</div></div>';
    if(it.tip) html+='<div class="tip"><b>📚 심화 학습 · 관련 자료</b>'+it.tip+'</div>';
    html+='</div>';
    div.innerHTML=html;
    sec.appendChild(div);

    setTimeout(function(){
      const ul=document.getElementById('ch'+n), box=document.getElementById('ab'+n),
            vd=document.getElementById('vd'+n), bt=document.getElementById('bt'+n);
      let answered=false;
      function reveal(sel){
        box.classList.add('show');
        Array.prototype.forEach.call(ul.children,function(li){
          const i=+li.dataset.i;
          li.classList.add('locked');
          if(i===it.a) li.classList.add('correct');
          if(sel!==null && i===sel && i!==it.a) li.classList.add('wrong');
          if(i===it.a && !li.querySelector('.mark')) li.insertAdjacentHTML('afterbegin','<span class="mark">✔ 정답</span>');
          if(sel!==null && i===sel && i!==it.a) li.insertAdjacentHTML('afterbegin','<span class="mark">✘ 선택</span>');
        });
        if(sel===null){ vd.textContent='정답과 해설을 확인하세요.'; vd.className='verdict'; }
        else if(sel===it.a){ vd.textContent='⭕ 정답입니다!'; vd.className='verdict ok'; }
        else { vd.textContent='❌ 오답입니다. (선택: '+LB[sel]+' / 정답: '+LB[it.a]+')'; vd.className='verdict no'; }
        bt.textContent='해설 접기';
      }
      Array.prototype.forEach.call(ul.children,function(li){
        li.addEventListener('click',function(){
          if(answered) return;
          answered=true;
          const sel=+li.dataset.i;
          done++; if(sel===it.a) ok++;
          upd(); reveal(sel);
        });
      });
      bt.addEventListener('click',function(){
        if(box.classList.contains('show')){ box.classList.remove('show'); bt.textContent='정답 보기'; return; }
        if(!answered){ answered=true; done++; upd(); reveal(null); }
        else { box.classList.add('show'); bt.textContent='해설 접기'; }
      });
    },0);
  });
  root.appendChild(sec);
});

function upd(){
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-rate').textContent=(done?Math.round(ok/done*100):0)+'%';
}
document.getElementById('s-total').textContent=total;

document.getElementById('gen').textContent='생성일시: 2026-09-18 06:44:00 (Asia/Seoul)';
</script>
</body>
</html>
