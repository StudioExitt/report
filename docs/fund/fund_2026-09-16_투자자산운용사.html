<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자자산운용사 문제은행 2026-09-16</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --sub:#64748b;
    --brand:#1d4ed8; --brand-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
    --no:#dc2626; --no-soft:#fef2f2; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.65;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header.top{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;border-radius:16px;
    padding:26px 22px;margin-bottom:22px;box-shadow:0 6px 20px rgba(29,78,216,.18);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;}
  header.top p{margin:2px 0;font-size:.9rem;opacity:.95;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 24px;}
  .stat{flex:1 1 120px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:center;}
  .stat b{display:block;font-size:1.3rem;color:var(--brand);}
  .stat span{font-size:.78rem;color:var(--sub);}
  section.unit{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:0 0 8px;margin-bottom:26px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.04);}
  .unit-head{background:var(--brand-soft);border-bottom:2px solid #bfdbfe;padding:14px 18px;}
  .unit-head h2{margin:0;font-size:1.12rem;font-weight:800;color:#1e3a8a;}
  .unit-head small{color:var(--sub);font-weight:600;}
  .q{padding:18px;border-bottom:1px dashed var(--line);}
  .q:last-child{border-bottom:none;}
  .q-title{font-weight:700;margin:0 0 12px;font-size:1rem;}
  .q-title .num{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;
    padding:1px 8px;font-size:.8rem;margin-right:8px;}
  ul.choices{list-style:none;margin:0;padding:0;}
  ul.choices li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;
    cursor:pointer;background:#fbfdff;transition:.15s;font-size:.95rem;}
  ul.choices li:hover{border-color:var(--brand);background:#f0f7ff;}
  ul.choices li .mark{float:right;font-weight:800;}
  li.correct{background:var(--ok-soft);border-color:var(--ok);color:#065f46;font-weight:600;}
  li.wrong{background:var(--no-soft);border-color:var(--no);color:#991b1b;font-weight:600;}
  li.locked{cursor:default;}
  .btn{margin-top:6px;background:#fff;border:1.5px solid var(--brand);color:var(--brand);
    border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.9rem;}
  .btn:hover{background:var(--brand);color:#fff;}
  .ans-box{display:none;margin-top:12px;border:1.5px solid #cbd5e1;border-left:6px solid var(--brand);
    border-radius:10px;background:#f8fafc;padding:14px;}
  .ans-box.show{display:block;}
  .verdict{font-weight:800;margin-bottom:8px;font-size:.95rem;}
  .verdict.ok{color:var(--ok);} .verdict.no{color:var(--no);}
  .ans-line{font-weight:800;color:#1e3a8a;margin-bottom:8px;}
  .exp{font-size:.9rem;color:#334155;}
  .exp .each{margin-top:8px;padding-top:8px;border-top:1px dotted #cbd5e1;}
  .exp .each div{margin:3px 0;}
  .tip{margin-top:10px;background:#fffbeb;border:1px solid #fcd34d;border-left:6px solid #f59e0b;
    border-radius:10px;padding:11px 13px;font-size:.88rem;color:#7c2d12;}
  .tip b{display:block;color:#92400e;margin-bottom:4px;font-size:.86rem;}
  footer{text-align:center;color:var(--sub);font-size:.82rem;margin-top:30px;}
  @media (max-width:520px){
    .wrap{padding:14px 10px 40px;} header.top h1{font-size:1.22rem;}
    .q{padding:14px 12px;} ul.choices li{font-size:.92rem;}
  }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>금융투자협회 투자자산운용사 문제은행</h1>
  <p>13개 단위 · 단위별 2문제 · 총 26문제 (4지선다)</p>
  <p id="gen"></p>
</header>

<div class="stats">
  <div class="stat"><b id="s-total">26</b><span>전체 문항</span></div>

  <div class="stat"><b id="s-ok">0</b><span>정답</span></div>
  <div class="stat"><b id="s-rate">0%</b><span>정답률</span></div>
</div>

<div id="root"></div>

<footer>학습용 자료 · 실제 시험 문항과 다를 수 있습니다.</footer>
</div>

{unit:"금융상품", items:[

  c:["5.0%","10.0%","12.5%","17.5%"],
  a:2,
  e:["총투자액 대비 NOI인 종합환원율(12억/100억=12%)과 혼동한 값이 아니다.",
     "부채서비스액을 차감하지 않고 계산하면 안 된다.",
     "정답: 세전현금흐름(BTCF) = NOI − 부채서비스액 = 12억 − 7억 = <b>5억원</b>. 지분배당률 = 세전현금흐름 ÷ 지분투자액 = 5억 ÷ 40억 = <b>12.5%</b>",
     "NOI를 그대로 자기자본으로 나눈 값(12억/40억=30%)이나 다른 오류에서 나온 값이다."],
  tip:"부동산 현금흐름 단계를 순서대로 익히자. 가능총소득(PGI) − 공실·대손 + 기타수입 = <b>유효총소득(EGI)</b> → − 영업경비(OE) = <b>순영업소득(NOI)</b> → − 부채서비스액(DS) = <b>세전현금흐름(BTCF)</b> → − 영업소득세 = 세후현금흐름(ATCF). 여기서 <b>종합환원율 = NOI/총투자액</b>, <b>지분배당률 = BTCF/지분투자액</b>이며, 차입금리보다 종합환원율이 높으면 <b>정(+)의 지렛대 효과</b>가 발생해 지분배당률이 종합환원율보다 커진다. 본 문제는 12% > 대출이자율 수준이므로 지분배당률 12.5% > 종합환원율 12%인 정의 레버리지 사례다."}
]},
{unit:"대안투자", items:[
 {q:"메자닌(Mezzanine) 투자에 관한 설명으로 옳지 않은 것은?",
  c:["전환사채(CB), 신주인수권부사채(BW), 상환전환우선주(RCPS)가 대표적인 수단이다.",
     "채권의 안정성과 주식의 상승 참여라는 성격을 함께 지닌다.",
     "청산 시 변제순위는 일반적으로 선순위 대출보다는 후순위, 보통주보다는 선순위이다.",
     "메자닌 증권은 주식 전환권이 부여되므로 표면금리가 일반 선순위 회사채보다 높게 책정된다."],
  a:3,
  e:["CB·BW·RCPS·교환사채(EB) 등이 메자닌의 전형적 형태로, 사모 방식으로 발행되는 경우가 많다.",
     "하방은 원리금 상환으로 방어하고, 상방은 주가 상승 시 전환·행사로 참여하는 비대칭적 수익구조를 갖는다.",
     "자본구조상 부채와 자본의 중간(메자닌=건물의 중간층)에 위치하므로 변제순위도 그 중간이다.",
     "정답: 투자자가 <b>전환권·신주인수권이라는 옵션 가치를 얻는 대가</b>로 발행회사는 <b>표면금리를 낮게</b> 책정할 수 있다. 실제로 CB·BW는 표면금리 0%로 발행되는 사례도 흔하며, 대신 만기보장수익률(YTM)로 최소 수익을 보장한다."],
  tip:"메자닌의 핵심 조항을 함께 정리하자. <b>리픽싱(Refixing)</b>은 주가 하락 시 전환가액을 하향 조정해 투자자를 보호하는 장치이고(현행 규정상 최초 전환가의 70%가 하한), <b>풋옵션(조기상환청구권)</b>은 투자자가 만기 전 상환을 요구할 권리, <b>콜옵션(매도청구권)</b>은 발행회사 또는 대주주가 사채를 되사올 권리다. BW는 2013년 이후 <b>분리형 사모 발행이 금지</b>되었다가 공모에 한해 허용되고 있다는 점도 자주 출제된다."},
 {q:"상품(Commodity) 선물 투자의 수익구조에 관한 설명으로 옳지 않은 것은?",
  c:["상품 인덱스 투자의 수익은 현물가격 변동에 따른 수익, 롤오버 수익, 담보수익으로 구분된다.",
     "선물가격이 현물가격보다 높은 상태를 콘탱고(Contango)라 한다.",
     "백워데이션(Backwardation) 상태에서 만기 이월을 반복하면 롤오버 수익이 양(+)으로 발생한다.",
     "콘탱고 상태가 지속되면 롤오버를 반복해도 지수 수익률이 현물 수익률보다 높게 나타난다."],
  a:3,
  e:["상품지수의 총수익(Total Return)은 현물수익(Spot Return) + 롤수익(Roll Return) + 담보수익(Collateral Return)으로 분해된다.",
     "보관비용·보험료 등 보유비용이 편의수익보다 클 때 선물가격이 현물보다 높아지며, 이를 콘탱고(정상시장)라 한다.",
     "백워데이션에서는 만기가 먼 선물이 더 싸므로 비싼 근월물을 팔고 싼 원월물을 사게 되어 <b>롤오버 이익</b>이 생긴다.",
     "정답: 콘탱고에서는 근월물을 팔고 <b>더 비싼</b> 원월물을 사야 하므로 이월할 때마다 <b>롤오버 손실(음(−)의 롤수익)</b>이 누적된다. 그 결과 현물가격이 제자리여도 지수 수익률은 지속적으로 잠식되며, 이를 <b>롤오버 비용(콘탱고 손실)</b>이라 한다."],
  tip:"보유비용모형으로 이해하면 명확하다. F = S × (1 + r + u − y), 여기서 r은 이자율, u는 보관비용, y는 <b>편의수익(convenience yield)</b>이다. 재고가 부족해 현물 보유의 편익(y)이 커지면 F < S가 되어 백워데이션이 나타난다. 원유·농산물처럼 재고 부족이 잦은 품목에서 백워데이션이, 금처럼 보관이 쉬운 품목에서는 콘탱고가 일반적이다."}
]},
{unit:"해외증권", items:[
 {q:"국제채권의 종류에 관한 설명으로 옳지 않은 것은?",
  c:["유로본드는 채권 표시통화국 이외의 지역에서 발행·유통되는 채권이다.",
     "외국채는 외국 발행자가 특정 국가에서 그 나라 통화로 발행하는 채권이다.",
     "미국에서 달러로 발행되는 외국채를 양키본드, 일본에서 엔화로 발행되는 외국채를 사무라이본드라 한다.",
     "한국에서 외국 발행자가 미 달러화로 발행하는 채권을 아리랑본드라 한다."],
  a:3,
  e:["유로본드는 표시통화 국가 밖에서 발행되어 해당국 감독당국의 등록 규제를 받지 않는 것이 특징이다.",
     "외국채는 발행지 국가의 통화로 발행되며, 그 나라의 증권 규제와 공시 의무를 따른다.",
     "양키본드(미국·USD), 사무라이본드(일본·JPY), 불독본드(영국·GBP), 판다본드(중국·CNY)가 대표적 외국채다.",
     "정답: 한국에서 외국 발행자가 <b>원화</b>로 발행하는 채권이 <b>아리랑본드</b>(외국채)이고, 한국에서 <b>외화(주로 달러)</b>로 발행하는 채권은 <b>김치본드</b>(유로본드 성격)다. 통화가 뒤바뀐 설명이다."],
  tip:"구분 기준은 단 하나, <b>'발행지 통화 = 발행지 국가의 통화인가'</b>이다. 같으면 외국채, 다르면 유로본드다. 유로본드는 무기명(bearer) 발행이 많고 이자에 원천징수가 없는 경우가 많아 조달비용이 낮은 반면, 외국채는 현지 등록·공시 절차를 거쳐야 해 발행 절차가 까다롭다. 명칭에 '유로'가 붙지만 유럽과는 무관하며, 일본에서 발행되는 달러표시 채권도 유로본드(정확히는 유로달러본드)에 해당한다."},
 {q:"국내 투자자가 해외주식에 투자하여 현지통화 기준으로 10%의 수익을 올렸으나, 투자기간 중 원화 대비 현지통화의 가치가 5% 하락하였다. 환헤지를 하지 않았을 때 원화 기준 총수익률에 가장 가까운 값은?",
  c:["4.5%","5.0%","5.5%","15.5%"],
  a:0,
  e:["정답: 원화 기준 수익률 = (1 + 현지수익률) × (1 + 환율변동률) − 1 = 1.10 × 0.95 − 1 = 1.045 − 1 = <b>4.5%</b>",
     "단순히 10% − 5% = 5%로 계산하면 두 수익률의 <b>교차항(0.10 × −0.05 = −0.5%p)</b>을 빠뜨리게 된다.",
     "부호를 반대로 적용한 값이다.",
     "현지통화 가치가 상승했다고 잘못 본 경우(1.10 × 1.05 − 1 = 15.5%)의 값이다."],
  tip:"해외투자 수익률은 <b>곱셈으로 결합</b>된다는 점이 핵심이다. R(원화) = (1+R현지)(1+R환율) − 1이며, 근사식 R현지 + R환율로만 풀면 수익률이 클수록 오차가 커진다. 위험 측면에서도 σ²(총) = σ²(현지) + σ²(환) + 2·ρ·σ(현지)·σ(환)로 결합되므로, 현지자산 수익률과 환율 변동의 <b>상관계수가 음(−)이면 환위험이 자연적으로 일부 상쇄</b>된다. 선진국 주식은 위기 시 주가 하락과 원화 약세가 동시에 나타나 환노출이 완충 역할을 하기도 한다."}
]},
{unit:"투자분석", items:[
 {q:"잉여현금흐름(FCF)을 이용한 기업가치평가에 관한 설명으로 옳지 않은 것은?",
  c:["FCFF는 채권자와 주주 모두에게 귀속되는 현금흐름이다.",
     "FCFF를 가중평균자본비용(WACC)으로 할인하면 기업가치가 산출된다.",
     "FCFE는 자기자본비용으로 할인하여 자기자본가치를 구한다.",
     "FCFF 산출 시 지급이자는 현금유출이므로 차감하여 계산한다."],
  a:3,
  e:["FCFF(Free Cash Flow to Firm)는 자본 제공자 전체에게 분배 가능한 현금흐름이다.",
     "현금흐름의 귀속 주체(채권자+주주)와 할인율의 성격(WACC)을 일치시키는 것이 평가의 기본 원칙이다.",
     "FCFE(Free Cash Flow to Equity)는 주주 몫이므로 자기자본비용(ke)으로 할인해야 한다.",
     "정답: FCFF는 <b>자본구조와 무관한</b> 현금흐름이므로 지급이자를 차감하지 않는다. 일반적으로 FCFF = EBIT×(1−t) + 감가상각비 − 자본적지출 − 순운전자본증가로 계산하며, 이자비용의 효과는 할인율인 WACC에 이미 반영되어 있다. 이자를 또 차감하면 <b>이중 반영</b>이 된다."],
  tip:"두 현금흐름의 관계식을 외워 두자. <b>FCFE = FCFF − 이자비용×(1−t) + 순차입증가액</b>. 부채가 없는 무차입 기업이라면 FCFF = FCFE가 된다. 또한 평가 결과의 관계는 <b>기업가치 = 자기자본가치 + 순부채</b>이므로, FCFF 방식으로 구한 기업가치에서 순부채를 빼면 FCFE 방식의 자기자본가치와 이론적으로 일치해야 한다. 실무에서는 성장률(g)이 WACC에 근접할수록 영구가치가 폭증하므로 <b>g < WACC</b> 제약을 반드시 확인한다."},
 {q:"어떤 기업의 자기자본이익률(ROE)이 10%이고 주가수익비율(PER)이 12배일 때, 이 기업의 주가순자산비율(PBR)은?",
  c:["0.83배","1.20배","1.80배","2.40배"],
  a:1,
  e:["PER ÷ ROE로 잘못 계산한 값이다.",
     "정답: PBR = 주가/BPS = (주가/EPS) × (EPS/BPS) = <b>PER × ROE</b> = 12 × 0.10 = <b>1.2배</b>",
     "계산 과정에서 배수를 잘못 적용한 값이다.",
     "ROE를 20%로 오인했을 때 나오는 값이다."],
  tip:"PBR 분해식은 여러 형태로 응용된다. ① <b>PBR = PER × ROE</b> ② 고든모형을 적용하면 <b>PBR = (ROE − g)/(k − g)</b>. 두 번째 식에서 <b>ROE > k이면 PBR > 1</b>, <b>ROE < k이면 PBR < 1</b>이 되어, PBR이 1을 넘는지는 결국 기업이 자본비용을 초과하는 수익을 내는가로 결정됨을 알 수 있다. PBR이 1보다 낮다는 것은 시장이 그 기업의 ROE가 요구수익률에 못 미친다고 평가한다는 뜻이며, 단순히 '저평가'로 단정할 수 없는 이유가 여기에 있다."}
]},
{unit:"리스크관리", items:[
 {q:"두 개의 자산으로 구성된 포트폴리오에서 자산 A의 VaR가 30억원, 자산 B의 VaR가 40억원이다. 두 자산의 수익률 상관계수가 0일 때 포트폴리오 VaR와 분산효과는?",
  c:["포트폴리오 VaR 50억원, 분산효과 20억원",
     "포트폴리오 VaR 70억원, 분산효과 0원",
     "포트폴리오 VaR 35억원, 분산효과 35억원",
     "포트폴리오 VaR 10억원, 분산효과 60억원"],
  a:0,
  e:["정답: VaR(p) = √(VaR(A)² + VaR(B)² + 2ρ·VaR(A)·VaR(B)) = √(900 + 1,600 + 0) = √2,500 = <b>50억원</b>. 분산효과 = 개별 VaR 단순합(70억) − 포트폴리오 VaR(50억) = <b>20억원</b>",
     "상관계수가 +1일 때의 결과다. 이때만 VaR가 단순 합산되고 분산효과가 0이 된다.",
     "상관계수를 −1로 잘못 적용한 경우(|40−30| = 10억)와도 다른 값이다.",
     "상관계수 −1일 때의 포트폴리오 VaR가 10억원이며, 이때 분산효과가 60억원으로 최대가 된다."],
  tip:"상관계수별 결과를 극단값으로 기억하면 계산 없이도 검증할 수 있다. <b>ρ=+1</b>이면 VaR(p)=70억(분산효과 0, 최댓값), <b>ρ=0</b>이면 50억, <b>ρ=−1</b>이면 10억(분산효과 60억, 최솟값)이다. 즉 포트폴리오 VaR는 항상 <b>|VaR(A)−VaR(B)| ≤ VaR(p) ≤ VaR(A)+VaR(B)</b> 범위에 놓인다. 다만 VaR는 <b>하위가법성(subadditivity)을 만족하지 않는 경우</b>가 있어 일관성 있는 위험척도가 아니라는 비판을 받으며, 이를 보완한 지표가 <b>기대손실(ES, Expected Shortfall)</b>이다."},
 {q:"운영리스크(Operational Risk)에 관한 설명으로 옳지 않은 것은?",
  c:["부적절한 내부절차, 인력, 시스템 또는 외부 사건으로 인해 발생하는 손실위험이다.",
     "법률리스크는 운영리스크에 포함되지만, 전략리스크와 평판리스크는 일반적으로 제외된다.",
     "발생빈도는 낮으나 손실규모가 큰 사건(Low Frequency High Severity)의 관리가 특히 중요하다.",
     "운영리스크는 시장리스크와 달리 위험을 부담할수록 기대수익이 높아지는 보상형 위험이다."],
  a:3,
  e:["바젤위원회의 표준 정의이며, 시스템 장애·내부 부정·외부 사기·업무처리 오류 등이 해당한다.",
     "바젤 정의상 법률리스크는 포함하되 전략리스크와 평판리스크는 명시적으로 제외한다.",
     "빈도는 낮지만 치명적인 손실을 유발하는 꼬리 사건이 운영리스크 관리의 핵심 대상이다.",
     "정답: 시장리스크·신용리스크는 부담에 대한 <b>보상(위험프리미엄)</b>이 존재하지만, 운영리스크는 감수한다고 해서 수익이 늘지 않는 <b>순수위험(pure risk)</b>이다. 따라서 관리 목표는 '최적 수준의 부담'이 아니라 <b>비용 대비 효율적인 축소·통제</b>다."],
  tip:"바젤의 운영리스크 자본 산출 방식 변화를 알아 두자. 과거 <b>기초지표법(BIA)</b>·<b>표준방법(TSA)</b>·<b>고급측정법(AMA)</b>이 병존했으나, 바젤Ⅲ 최종안에서는 이를 폐지하고 영업지표(BI)와 과거 손실 이력을 결합한 <b>단일 표준방법(SMA)</b>으로 일원화되었다. 관리 도구로는 손실사건 데이터베이스(LDC), <b>핵심리스크지표(KRI)</b>, 리스크통제자가진단(RCSA), 시나리오 분석이 함께 활용된다."}
]},
{unit:"직무윤리", items:[
 {q:"금융소비자보호법상 금융소비자의 권리 구제 제도에 관한 설명으로 옳지 않은 것은?",
  c:["일반금융소비자는 일정 기간 내에 아무런 불이익 없이 계약을 철회할 수 있는 청약철회권을 갖는다.",
     "판매원칙 위반이 있는 경우 소비자는 계약체결일로부터 5년 이내 범위에서 위법계약해지를 요구할 수 있다.",
     "설명의무 위반으로 인한 손해배상 청구 시 고의·과실에 대한 입증책임은 금융회사가 부담한다.",
     "청약철회권과 위법계약해지권은 모두 판매원칙 위반이 있어야만 행사할 수 있다."],
  a:3,
  e:["대출성 상품은 14일, 투자성·보장성 상품은 7일(숙려기간) 등 상품 유형별로 철회 가능 기간이 정해져 있다.",
     "위반 사실을 안 날로부터 1년 이내이면서 계약체결일로부터 5년 이내에 해지를 요구할 수 있다.",
     "설명의무 위반에 한해 <b>입증책임이 금융회사로 전환</b>되며, 이는 소비자 보호를 강화한 대표적 장치다.",
     "정답: <b>청약철회권은 위법 여부와 무관하게</b> 일정 기간 내라면 단순 변심으로도 행사할 수 있는 권리다. 반면 위법계약해지권은 6대 판매원칙 위반이라는 <b>위법 사유가 전제</b>되어야 한다. 두 권리의 요건이 전혀 다르다."],
  tip:"금융소비자보호법의 <b>6대 판매원칙</b>을 반드시 암기하자. ① <b>적합성 원칙</b>(권유하는 상품이 소비자에게 적합할 것) ② <b>적정성 원칙</b>(권유 없이 소비자가 청약한 경우에도 적정성 확인) ③ <b>설명의무</b> ④ <b>불공정영업행위 금지</b>(끼워팔기·부당 담보요구 등) ⑤ <b>부당권유행위 금지</b>(단정적 판단 제공, 불확실한 사항의 단정 등) ⑥ <b>허위·과장광고 금지</b>. 위반 시 <b>징벌적 과징금</b>(위반 관련 수입의 최대 50%)과 과태료가 부과되며, 특히 ①②는 '권유 유무'가 적용 갈림길임을 기억한다."},
 {q:"금융투자업 종사자의 '본인에 대한 윤리' 및 '시장에 대한 윤리'에 관한 설명으로 옳지 않은 것은?",
  c:["임직원은 소속 회사의 승인을 받은 경우가 아니면 대외활동을 할 수 없는 것이 원칙이다.",
     "직무 수행 과정에서 알게 된 고객의 정보는 비밀유지의무의 대상이며, 퇴직 후에도 유지된다.",
     "시장질서 교란행위는 미공개중요정보를 직접 이용한 자뿐 아니라 이를 전달받은 2차·3차 수령자에게도 적용될 수 있다.",
     "고객 정보 제공 요구가 법원의 영장에 의한 경우에도 비밀유지의무가 우선하므로 제공을 거부해야 한다."],
  a:3,
  e:["대외활동(강연·기고·SNS 활동 등)은 회사의 사전 승인 또는 신고를 거치도록 내부통제기준에 규정되어 있다.",
     "비밀유지의무는 고용관계 종료 후에도 존속하며, 업무상 알게 된 모든 정보가 대상이다.",
     "자본시장법상 시장질서 교란행위 규제는 종전의 내부자거래 규제를 확장해 <b>정보 수령자의 범위 제한을 없앤</b> 것이 핵심이다.",
     "정답: 비밀유지의무는 절대적이지 않다. <b>법원의 제출명령·영장, 조세 관련 법령, 금융위·금감원의 검사</b> 등 <b>법령에 근거한 요구</b>가 있으면 정보를 제공해야 하며, 이 경우 비밀유지의무 위반이 되지 않는다. 다만 <b>필요 최소한의 범위</b>에서 제공해야 한다."],
  tip:"직무윤리의 체계를 두 축으로 정리하자. <b>기본원칙</b>은 ① 고객우선의 원칙 ② 신의성실의 원칙이며, 여기서 <b>이해상충 방지의무</b>와 <b>금융소비자보호의무</b>가 파생된다. 이해상충 관리는 <b>공시(Disclosure) → 축소(Control) → 회피(Avoid)</b>의 순서로 대응하며, 축소해도 해소되지 않으면 거래 자체를 하지 말아야 한다. 정보교류 차단장치인 <b>Chinese Wall</b>은 부서 간 정보·인력·공간·전산의 분리를 요구한다."}
]},
{unit:"법규", items:[
 {q:"자본시장법상 금융투자상품의 분류에 관한 설명으로 옳지 않은 것은?",
  c:["증권은 투자자가 취득과 동시에 지급한 금전 등 외에 추가 지급의무를 부담하지 않는 금융투자상품이다.",
     "증권은 채무증권, 지분증권, 수익증권, 투자계약증권, 파생결합증권, 증권예탁증권의 6가지로 구분된다.",
     "파생상품은 추가 지급의무를 부담할 수 있으며, 장내파생상품과 장외파생상품으로 나뉜다.",
     "원금손실 가능성이 없는 은행 예금과 보험상품도 자본시장법상 금융투자상품에 포함된다."],
  a:3,
  e:["추가지급의무의 유무가 증권과 파생상품을 가르는 결정적 기준이다.",
     "자본시장법 제4조의 증권 6분류이며, ELS·DLS는 파생결합증권, ETN도 파생결합증권에 해당한다.",
     "파생상품은 선물·옵션·스왑을 기본형으로 하며, 거래소 상장 여부로 장내·장외를 구분한다.",
     "정답: 금융투자상품은 <b>원본손실 가능성(투자성)</b>이 있어야 한다. 원금이 보장되는 <b>은행 예금과 일반 보험상품은 투자성이 없어 금융투자상품에서 제외</b>된다. 다만 변액보험처럼 투자성이 있는 상품은 금융투자상품(집합투자증권)으로 규율된다."],
  tip:"자본시장법의 <b>포괄주의</b>를 이해하자. 과거 증권거래법이 열거된 상품만 규제한 것과 달리, 자본시장법은 '이익을 얻거나 손실을 회피할 목적으로 현재 또는 장래의 특정 시점에 금전 등을 지급하기로 약정함으로써 취득하는 권리로서 <b>투자성</b>이 있는 것'이라는 <b>추상적 정의</b>로 신종 상품까지 포섭한다. 한편 <b>투자계약증권</b>은 '타인이 수행한 공동사업의 결과에 따른 손익을 귀속받는 계약상 권리'로, 최근 조각투자·토큰증권(STO) 판단의 근거 조항으로 활용되고 있다."},
 {q:"자본시장법상 투자광고 및 불건전 영업행위 규제에 관한 설명으로 옳지 않은 것은?",
  c:["투자광고는 원칙적으로 금융투자업자만 할 수 있으며, 준법감시인의 사전 확인을 받아야 한다.",
     "집합투자증권 광고에는 운용실적이 미래 수익률을 보장하지 않는다는 내용을 포함해야 한다.",
     "선행매매(front running)와 과당매매(churning)는 대표적인 불건전 영업행위에 해당한다.",
     "일임매매는 어떠한 경우에도 금지되므로 투자일임업 등록을 한 경우에도 허용되지 않는다."],
  a:3,
  e:["금융투자협회의 심사를 거치는 절차도 함께 운영되며, 광고 주체가 제한되는 것이 원칙이다.",
     "과거 운용실적 표시 시 기준일·기간과 함께 미래 수익 보장이 아님을 명시해야 한다.",
     "선행매매는 고객 주문 정보를 이용해 먼저 거래하는 행위, 과당매매는 수수료 수입을 위해 과도하게 매매를 권유·실행하는 행위다.",
     "정답: 일임매매는 <b>투자일임업 등록을 하고 투자일임계약을 체결한 경우 적법하게 허용</b>된다. 금지되는 것은 등록·계약 없이 이루어지는 <b>무단 일임매매</b>이며, 투자중개업자가 예외적으로 허용되는 경우(매매 수량·가격·시기에 한정한 위임 등)도 법에 규정되어 있다."],
  tip:"불건전 영업행위의 유형을 묶어서 외우자. ① <b>선행매매</b> ② <b>스캘핑</b>(조사분석자료 공표 전 매매) ③ <b>과당매매</b> ④ <b>손실보전·이익보장 약속</b> ⑤ <b>자기계약(자기거래)</b> ⑥ 조사분석자료 작성자에 대한 <b>기업금융업무 연동 성과보수 지급</b> ⑦ 일정 기간(공표 후 24시간) 내 자기계산 매매 제한. 특히 <b>손실보전 약정은 사전·사후를 불문하고 금지</b>되며, 위반 시 사법상 무효이면서 형사처벌 대상이라는 점이 자주 출제된다."}
]},
{unit:"주식", items:[
 {q:"주가지수의 산출 방식에 관한 설명으로 옳지 않은 것은?",
  c:["KOSPI와 KOSPI200은 시가총액 가중방식으로 산출된다.",
     "다우존스산업평균지수(DJIA)와 닛케이225는 주가평균식으로 산출된다.",
     "시가총액식 지수는 대형주의 주가 변동이 지수에 미치는 영향이 상대적으로 크다.",
     "주가평균식 지수는 고가주의 영향이 작고 저가주의 영향이 커지는 특성이 있다."],
  a:3,
  e:["KOSPI는 1980년 1월 4일을 100으로 하는 시가총액식 지수이며, KOSPI200도 동일한 방식이다.",
     "DJIA는 30개 종목 주가의 합을 제수(divisor)로 나누는 주가평균식이고, 닛케이225도 같은 계열이다.",
     "시가총액식에서는 각 종목의 비중이 시가총액에 비례하므로 대형주의 영향력이 크다.",
     "정답: 주가평균식은 단순히 주가를 더해 나누므로 <b>주가가 높은 종목(고가주)의 영향이 크고</b> 저가주의 영향은 작다. 기업 규모와 무관하게 <b>주가 수준</b>이 비중을 결정한다는 점이 이 방식의 대표적 한계다."],
  tip:"지수 산출에서 <b>유동주식비율(free float)</b> 조정도 함께 이해하자. 대주주 지분·자기주식 등 실제 유통되지 않는 물량을 제외하고 시가총액을 계산하면, 지수가 시장에서 실제 거래 가능한 규모를 더 잘 반영하고 인덱스 펀드의 복제도 쉬워진다. MSCI·FTSE 등 글로벌 지수와 KOSPI200이 이 방식을 사용한다. 한편 유·무상증자, 액면분할, 종목 교체가 있을 때는 <b>제수(divisor)를 조정</b>해 지수의 연속성을 유지한다."},
 {q:"유상증자의 방식과 권리락에 관한 설명으로 옳지 않은 것은?",
  c:["주주배정 방식은 기존 주주에게 지분비율대로 신주인수권을 부여하는 방식이다.",
     "제3자배정 방식은 기존 주주의 지분이 희석되므로 정관의 근거나 법령상 요건이 필요하다.",
     "권리락은 신주인수권이 소멸한 상태를 의미하며, 이론적으로 기준주가가 하향 조정된다.",
     "일반공모 방식은 기존 주주에게 우선 청약권이 부여되므로 지분 희석이 발생하지 않는다."],
  a:3,
  e:["주주배정은 가장 일반적인 방식으로, 실권주가 발생하면 실권주 일반공모나 이사회 결의로 처리한다.",
     "경영권 방어나 자금조달 목적의 제3자배정은 기존 주주 보호를 위해 요건이 엄격히 제한된다.",
     "권리락일에는 늘어난 주식수를 반영해 기준가격이 낮아지며, 이는 가치 하락이 아니라 <b>산술적 조정</b>이다.",
     "정답: 일반공모는 <b>기존 주주의 신주인수권을 배제</b>하고 불특정 다수를 대상으로 청약을 받는 방식이므로, 기존 주주의 <b>지분율은 희석</b>된다. 우선 청약권이 부여되는 것은 주주배정 또는 주주우선공모 방식이다."],
  tip:"권리락 기준가격의 계산식을 익히자. <b>권리락 기준가 = (권리부 종가 × 기존 주식수 + 신주 발행가 × 신주 수) ÷ (기존 주식수 + 신주 수)</b>. 예를 들어 종가 10,000원인 주식이 20% 규모로 5,000원에 증자하면 기준가는 (10,000×1 + 5,000×0.2)/1.2 ≒ 9,167원이 된다. 무상증자에서는 신주 발행가가 0이므로 단순히 <b>기존 주가 ÷ (1+증자비율)</b>이 된다. 배당락도 같은 원리이며, 권리락·배당락은 <b>주가 하락이 아니라 기준가 재계산</b>임을 구분해야 한다."}
]},
{unit:"채권", items:[
 {q:"채권 투자전략에 관한 설명으로 옳지 않은 것은?",
  c:["만기보유전략, 사다리형 전략, 바벨형 전략은 소극적(passive) 투자전략에 속한다.",
     "수익률곡선타기 전략은 수익률곡선이 우상향하고 그 형태가 유지될 것을 전제로 한다.",
     "면역전략은 투자기간과 포트폴리오의 듀레이션을 일치시켜 금리위험을 제거하는 전략이다.",
     "금리 하락이 예상될 때는 포트폴리오의 듀레이션을 축소하여 단기채 비중을 높인다."],
  a:3,
  e:["소극적 전략은 시장의 효율성을 전제로 예측에 의존하지 않고 위험을 관리하는 데 목적이 있다.",
     "롤링효과(만기 단축에 따른 수익률 하락)와 숄더효과(만기별 수익률 급락 구간 통과)를 노리는 전략이다.",
     "가격위험과 재투자위험이 서로 상쇄되도록 듀레이션을 투자기간에 맞추는 것이 면역전략의 핵심이다.",
     "정답: 금리가 <b>하락</b>하면 채권가격이 <b>상승</b>하므로, 가격 상승폭을 극대화하기 위해 <b>듀레이션을 확대(장기채 비중 확대)</b>해야 한다. 듀레이션을 축소하는 것은 금리 <b>상승</b>이 예상될 때의 방어 전략이다."],
  tip:"적극적 전략과 소극적 전략을 갈라서 정리하자. <b>적극적</b>: 수익률예측전략(듀레이션 조절), 수익률곡선타기, <b>나비형(barbell)</b>·<b>역나비형(bullet)</b> 투자전략, 스프레드 운용전략, 채권교체전략. <b>소극적</b>: 만기보유, 인덱스전략, <b>사다리형(ladder)</b>, 바벨형, 현금흐름일치전략, 면역전략. 헷갈리기 쉬운 포인트는 <b>곡선의 변화 예측</b>이다. 중기물 금리가 상대적으로 더 하락(볼록성 증가)할 것으로 보면 <b>불릿형</b>, 장·단기물이 더 유리하다고 보면 <b>바벨형</b>을 택한다."},
 {q:"액면이자를 지급하지 않는 순수할인채(무이표채)의 잔존만기가 5년이고 만기수익률이 연 5%일 때, 이 채권의 수정듀레이션에 가장 가까운 값은?",
  c:["4.55","4.76","5.00","5.25"],
  a:1,
  e:["계산 과정에서 분모를 잘못 적용한 값이다.",
     "정답: 무이표채의 <b>맥컬레이 듀레이션 = 잔존만기 = 5년</b>. 수정듀레이션 = 맥컬레이 듀레이션 ÷ (1 + YTM) = 5 ÷ 1.05 = <b>4.76</b>",
     "맥컬레이 듀레이션 값을 그대로 답한 경우다. 수정듀레이션은 (1+r)로 한 번 더 나눠야 한다.",
     "(1+r)로 나누지 않고 곱한 경우(5×1.05 = 5.25)의 값이다."],
  tip:"듀레이션의 성질을 조건별로 기억하자. ① <b>무이표채의 맥컬레이 듀레이션 = 잔존만기</b>(이표채는 항상 만기보다 짧다) ② 표면금리가 <b>높을수록</b> 듀레이션은 짧아진다 ③ 만기수익률이 <b>높을수록</b> 듀레이션은 짧아진다 ④ 만기가 길수록 듀레이션은 길어지나 <b>체감적으로</b> 증가한다. 가격변동률 근사식은 <b>ΔP/P ≒ −수정듀레이션 × Δy + ½ × 볼록성 × (Δy)²</b>이며, 볼록성 항이 양(+)이므로 듀레이션만으로 계산하면 금리 하락 시 상승폭은 <b>과소평가</b>, 금리 상승 시 하락폭은 <b>과대평가</b>된다."}
]},
{unit:"파생상품", items:[
 {q:"옵션을 이용한 투자전략에 관한 설명으로 옳지 않은 것은?",
  c:["스트래들 매수는 동일 행사가격의 콜과 풋을 동시에 매수하여 변동성 확대에 베팅하는 전략이다.",
     "스트랭글 매수는 행사가격이 서로 다른 외가격 콜과 풋을 매수하므로 스트래들보다 초기 비용이 적다.",
     "강세 콜스프레드는 낮은 행사가격의 콜을 매수하고 높은 행사가격의 콜을 매도하는 전략이다.",
     "방어적 풋(protective put)은 주식을 보유한 상태에서 콜옵션을 매도하여 프리미엄 수익을 얻는 전략이다."],
  a:3,
  e:["기초자산 가격이 어느 방향으로든 크게 움직이면 이익이 나며, 최대 손실은 지급한 프리미엄으로 한정된다.",
     "외가격 옵션을 쓰므로 비용은 적지만, 이익을 내려면 더 큰 폭의 가격 변동이 필요하다.",
     "상승을 기대하되 이익과 손실을 모두 제한하는 전략으로, 초기에 프리미엄 순지출이 발생한다.",
     "정답: 주식 보유 + <b>콜 매도</b>는 <b>커버드 콜(covered call)</b>이다. <b>방어적 풋</b>은 주식 보유 + <b>풋 매수</b>로, 프리미엄을 지급하는 대신 하락위험을 제한하는 보험형 전략이다. 두 전략의 손익구조가 정반대이므로 혼동하지 않아야 한다."],
  tip:"손익구조로 묶어서 기억하자. <b>커버드 콜</b> = 주식 + 콜 매도 → 풋 <b>매도</b>와 동일한 손익(상승이익 제한, 하락위험 그대로). <b>방어적 풋</b> = 주식 + 풋 매수 → 콜 <b>매수</b>와 동일한 손익(하락 제한, 상승 참여). 이는 <b>풋-콜 패리티(S + P = C + PV(K))</b>에서 바로 도출된다. 변동성 전략은 <b>매수 = 변동성 확대 기대, 매도 = 횡보 기대</b>이며, 스트래들·스트랭글 매도는 이익이 프리미엄으로 한정되는 반면 손실은 무한대가 될 수 있어 위험이 크다."},
 {q:"현재 50억원 규모의 주식 포트폴리오를 보유한 운용자가 있다. 이 포트폴리오의 베타는 1.2이고, KOSPI200 선물지수는 300p, 선물 1계약의 거래승수는 25만원이다. 선물을 이용해 시장위험을 완전히 헤지하려면 필요한 선물 계약수는?",
  c:["60계약 매도","72계약 매도","80계약 매도","96계약 매도"],
  a:2,
  e:["베타를 반영하지 않고 계산한 값(50억 ÷ 7,500만 ≒ 66.7)과도 다르다.",
     "계약 단위를 잘못 적용한 값이다.",
     "정답: 선물 1계약 금액 = 300 × 250,000원 = <b>7,500만원</b>. 필요 계약수 = (포트폴리오 금액 × 베타) ÷ 1계약 금액 = (50억 × 1.2) ÷ 7,500만 = 60억 ÷ 7,500만 = <b>80계약</b>. 주식 보유분의 하락위험을 없애야 하므로 <b>매도(short)</b> 헤지다.",
     "베타를 제곱하거나 중복 적용한 경우의 값이다."],
  tip:"헤지 계약수 공식 <b>N = β × (S ÷ (F × 승수))</b>를 기준으로 응용을 익히자. 목표베타를 0이 아닌 값으로 조정하려면 <b>N = (β목표 − β현재) × S ÷ (F × 승수)</b>이며, 부호가 음(−)이면 매도, 양(+)이면 매수다. 예컨대 베타를 1.2에서 0.7로 낮추려면 (0.7−1.2)×50억 ÷ 7,500만 ≒ −33계약, 즉 33계약 매도하면 된다. 한편 완전헤지가 되지 않는 이유는 <b>베이시스 위험</b>(현·선물 가격차 변동)과 <b>계약수 반올림</b>, 베타 추정오차 때문이며, 선물은 <b>체계적 위험만</b> 제거하고 개별종목의 비체계적 위험은 남는다는 점도 중요하다."}
]},
{unit:"성과분석", items:[
 {q:"어떤 펀드의 연간 수익률이 14%, 무위험이자율이 4%, 이 펀드의 베타가 1.25일 때 트레이너지수(Treynor Ratio)는?",
  c:["6.4%","8.0%","10.0%","12.5%"],
  a:1,
  e:["표준편차를 사용한 다른 지표의 값과 혼동한 경우다.",
     "정답: 트레이너지수 = (포트폴리오 수익률 − 무위험이자율) ÷ <b>베타</b> = (14% − 4%) ÷ 1.25 = 10% ÷ 1.25 = <b>8.0%</b>",
     "초과수익률(14% − 4% = 10%)만 구하고 베타로 나누지 않은 값이다.",
     "베타를 곱하거나 분모·분자를 뒤집은 경우의 값이다."],
  tip:"위험조정 성과지표는 <b>분모에 무엇이 오는가</b>로 구분된다. <b>샤프지수 = 초과수익률 ÷ 표준편차</b>(총위험 기준 → 분산이 잘 안 된 포트폴리오나 전체 자산 평가에 적합), <b>트레이너지수 = 초과수익률 ÷ 베타</b>(체계적 위험 기준 → 이미 잘 분산된 포트폴리오의 일부를 평가할 때 적합), <b>젠센의 알파 = 실현수익률 − CAPM 기대수익률</b>(절대 금액 개념의 초과성과), <b>정보비율 = 초과수익률 ÷ 트래킹에러</b>. 잘 분산된 포트폴리오에서는 샤프와 트레이너의 순위가 대체로 일치하지만, 분산이 부족하면 두 지표의 <b>순위가 어긋날 수 있다</b>."},
 {q:"정보비율(Information Ratio)과 트래킹에러(Tracking Error)에 관한 설명으로 옳지 않은 것은?",
  c:["트래킹에러는 포트폴리오 수익률과 벤치마크 수익률 차이의 표준편차로 측정된다.",
     "정보비율은 벤치마크 대비 초과수익률을 트래킹에러로 나누어 계산한다.",
     "정보비율은 운용자의 종목선택 및 자산배분 능력의 일관성을 평가하는 데 유용하다.",
     "인덱스펀드는 초과수익 달성이 목표이므로 트래킹에러가 클수록 우수한 운용으로 평가된다."],
  a:3,
  e:["잔차위험(residual risk) 또는 액티브 리스크라고도 하며, 벤치마크에서 벗어난 정도를 나타낸다.",
     "IR = (Rp − Rb) ÷ TE이며, 단위 위험당 초과성과를 보여 준다.",
     "높은 정보비율은 초과수익이 운(運)이 아니라 <b>반복 가능한 능력</b>에서 비롯되었을 가능성이 크다는 의미다.",
     "정답: <b>인덱스펀드의 목표는 벤치마크를 그대로 복제하는 것</b>이므로 트래킹에러가 <b>작을수록</b> 우수한 운용이다. 트래킹에러가 클수록 좋다는 평가는 <b>액티브 펀드</b>에도 그대로 적용되지 않으며, 액티브 펀드에서도 중요한 것은 트래킹에러 자체가 아니라 그 위험 대비 초과수익인 <b>정보비율</b>이다."],
  tip:"성과평가의 전체 절차를 함께 정리하자. ① <b>수익률 측정</b>(운용자 평가는 자금 유출입의 영향을 배제한 <b>시간가중수익률</b>) ② <b>위험조정 성과 측정</b>(샤프·트레이너·젠센·정보비율) ③ <b>벤치마크 대비 평가</b> ④ <b>성과요인 분석(attribution)</b>으로 초과성과를 <b>자산배분효과·종목선택효과·상호작용효과</b>로 분해. 벤치마크는 사전에 정해지고(specified in advance), 측정 가능하며, 투자 가능하고, 운용자의 스타일을 반영해야 한다는 요건을 갖춰야 한다."}
]}
];

const LB=["①","②","③","④"];
let idx=0, done=0, ok=0, total=0;
const root=document.getElementById('root');

DATA.forEach(function(u){
  const sec=document.createElement('section');
  sec.className='unit';
  sec.innerHTML='<div class="unit-head"><h2>'+u.unit+' <small>('+u.items.length+'문항)</small></h2></div>';
  u.items.forEach(function(it){
    idx++; total++;
    const n=idx;
    const div=document.createElement('div');
    div.className='q';
    let html='<p class="q-title"><span class="num">Q'+n+'</span>'+it.q+'</p><ul class="choices" id="ch'+n+'">';
    it.c.forEach(function(c,i){ html+='<li data-i="'+i+'">'+LB[i]+' '+c+'</li>'; });
    html+='</ul><button class="btn" id="bt'+n+'">정답 보기</button>';
    html+='<div class="ans-box" id="ab'+n+'"><div class="verdict" id="vd'+n+'"></div>'+
          '<div class="ans-line">정답: '+LB[it.a]+' '+it.c[it.a]+'</div><div class="exp"><div class="each">';
    it.e.forEach(function(e,i){ html+='<div><b>'+LB[i]+'</b> '+e+'</div>'; });
    html+='</div></div>';
    if(it.tip) html+='<div class="tip"><b>📚 심화 학습 · 관련 자료</b>'+it.tip+'</div>';
    html+='</div>';
    div.innerHTML=html;
    sec.appendChild(div);

    setTimeout(function(){
      const ul=document.getElementById('ch'+n), box=document.getElementById('ab'+n),
            vd=document.getElementById('vd'+n), bt=document.getElementById('bt'+n);
      let answered=false;
      function reveal(sel){
        box.classList.add('show');
        Array.prototype.forEach.call(ul.children,function(li){
          const i=+li.dataset.i;
          li.classList.add('locked');
          if(i===it.a) li.classList.add('correct');
          if(sel!==null && i===sel && i!==it.a) li.classList.add('wrong');
          if(i===it.a && !li.querySelector('.mark')) li.insertAdjacentHTML('afterbegin','<span class="mark">✔ 정답</span>');
          if(sel!==null && i===sel && i!==it.a) li.insertAdjacentHTML('afterbegin','<span class="mark">✘ 선택</span>');
        });
        if(sel===null){ vd.textContent='정답과 해설을 확인하세요.'; vd.className='verdict'; }
        else if(sel===it.a){ vd.textContent='⭕ 정답입니다!'; vd.className='verdict ok'; }
        else { vd.textContent='❌ 오답입니다. (선택: '+LB[sel]+' / 정답: '+LB[it.a]+')'; vd.className='verdict no'; }
        bt.textContent='해설 접기';
      }
      Array.prototype.forEach.call(ul.children,function(li){
        li.addEventListener('click',function(){
          if(answered) return;
          answered=true;
          const sel=+li.dataset.i;
          done++; if(sel===it.a) ok++;
          upd(); reveal(sel);
        });
      });
      bt.addEventListener('click',function(){
        if(box.classList.contains('show')){ box.classList.remove('show'); bt.textContent='정답 보기'; return; }
        if(!answered){ answered=true; done++; upd(); reveal(null); }
        else { box.classList.add('show'); bt.textContent='해설 접기'; }
      });
    },0);
  });
  root.appendChild(sec);
});

function upd(){
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-rate').textContent=(done?Math.round(ok/done*100):0)+'%';
}
document.getElementById('s-total').textContent=total;

document.getElementById('gen').textContent='생성일시: 2026-09-16 06:18:00 (Asia/Seoul)';
</script>
</body>
</html>
