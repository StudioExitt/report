<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>투자자산운용사 문제은행 2026-09-15</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --sub:#64748b;
    --brand:#1d4ed8; --brand-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
    --no:#dc2626; --no-soft:#fef2f2; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.65;}
  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header.top{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;border-radius:16px;
    padding:26px 22px;margin-bottom:22px;box-shadow:0 6px 20px rgba(29,78,216,.18);}
  header.top h1{margin:0 0 6px;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;}
  header.top p{margin:2px 0;font-size:.9rem;opacity:.95;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 24px;}
  .stat{flex:1 1 120px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:center;}
  .stat b{display:block;font-size:1.3rem;color:var(--brand);}
  .stat span{font-size:.78rem;color:var(--sub);}
  section.unit{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:0 0 8px;margin-bottom:26px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.04);}
  .unit-head{background:var(--brand-soft);border-bottom:2px solid #bfdbfe;padding:14px 18px;}
  .unit-head h2{margin:0;font-size:1.12rem;font-weight:800;color:#1e3a8a;}
  .unit-head small{color:var(--sub);font-weight:600;}
  .q{padding:18px;border-bottom:1px dashed var(--line);}
  .q:last-child{border-bottom:none;}
  .q-title{font-weight:700;margin:0 0 12px;font-size:1rem;}
  .q-title .num{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;
    padding:1px 8px;font-size:.8rem;margin-right:8px;}
  ul.choices{list-style:none;margin:0;padding:0;}
  ul.choices li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;
    cursor:pointer;background:#fbfdff;transition:.15s;font-size:.95rem;}
  ul.choices li:hover{border-color:var(--brand);background:#f0f7ff;}
  ul.choices li .mark{float:right;font-weight:800;}
  li.correct{background:var(--ok-soft);border-color:var(--ok);color:#065f46;font-weight:600;}
  li.wrong{background:var(--no-soft);border-color:var(--no);color:#991b1b;font-weight:600;}
  li.locked{cursor:default;}
  .btn{margin-top:6px;background:#fff;border:1.5px solid var(--brand);color:var(--brand);
    border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.9rem;}
  .btn:hover{background:var(--brand);color:#fff;}
  .ans-box{display:none;margin-top:12px;border:1.5px solid #cbd5e1;border-left:6px solid var(--brand);
    border-radius:10px;background:#f8fafc;padding:14px;}
  .ans-box.show{display:block;}
  .verdict{font-weight:800;margin-bottom:8px;font-size:.95rem;}
  .verdict.ok{color:var(--ok);} .verdict.no{color:var(--no);}
  .ans-line{font-weight:800;color:#1e3a8a;margin-bottom:8px;}
  .exp{font-size:.9rem;color:#334155;}
  .exp .each{margin-top:8px;padding-top:8px;border-top:1px dotted #cbd5e1;}
  .exp .each div{margin:3px 0;}
  .tip{margin-top:10px;background:#fffbeb;border:1px solid #fcd34d;border-left:6px solid #f59e0b;
    border-radius:10px;padding:11px 13px;font-size:.88rem;color:#7c2d12;}
  .tip b{display:block;color:#92400e;margin-bottom:4px;font-size:.86rem;}
  footer{text-align:center;color:var(--sub);font-size:.82rem;margin-top:30px;}
  @media (max-width:520px){
    .wrap{padding:14px 10px 40px;} header.top h1{font-size:1.22rem;}
    .q{padding:14px 12px;} ul.choices li{font-size:.92rem;}
  }
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <h1>금융투자협회 투자자산운용사 문제은행</h1>
  <p>13개 단위 · 단위별 2문제 · 총 26문제 (4지선다)</p>
  <p id="gen"></p>
</header>

<div class="stats">
  <div class="stat"><b id="s-total">26</b><span>전체 문항</span></div>
  <div class="stat"><b id="s-done">0</b><span>푼 문항</span></div>
  <div class="stat"><b id="s-ok">0</b><span>정답</span></div>
  <div class="stat"><b id="s-rate">0%</b><span>정답률</span></div>
</div>

<div id="root"></div>

<footer>학습용 자료 · 실제 시험 문항과 다를 수 있습니다.</footer>
</div>

 {q:"거주자의 양도소득세에 관한 설명으로 옳지 않은 것은?",
  c:["1세대 1주택 비과세는 원칙적으로 2년 이상 보유 요건을 충족해야 한다.",
     "양도차익 계산 시 양도가액과 취득가액은 실지거래가액을 적용하는 것이 원칙이다.",

{unit:"금융상품", items:[
 {q:"개인종합자산관리계좌(ISA)에 대한 설명으로 옳지 않은 것은?",

  tip:"ISA 납입한도는 연 2,000만원, 총 1억원이며 당해연도 미납입분은 이월된다. 만기자금을 60일 이내에 연금계좌로 전환하면 전환금액의 10%(최대 300만원)까지 추가 세액공제를 받을 수 있어, ISA→연금계좌 연계 전략이 실무에서 자주 활용된다. 중개형 ISA에서는 국내상장주식 직접투자도 가능하다."},
 {q:"주가연계증권(ELS)과 주가연계파생결합사채(ELB)를 비교한 설명으로 옳지 않은 것은?",

     "ELB는 원금이 보장되는 상품이므로 예금자보호법에 따라 보호받는다."],

  e:["ELB는 원금지급형으로 설계되며, 2013년 자본시장법 개정으로 파생결합사채(채무증권)로 분류되었다.",
     "ELS는 기초자산 가격에 따라 원금손실이 발생할 수 있는 파생결합증권이다.",
     "두 상품 모두 증권회사가 발행하는 무담보 채무이므로, 발행사가 부실화되면 원리금을 받지 못할 수 있다.",
     "정답: ELB의 원금지급은 '발행사가 약속한 원금지급 구조'일 뿐 예금이 아니다. 예금자보호법의 보호대상이 아니며, 발행사 신용위험은 그대로 투자자가 부담한다."],

{unit:"부동산", items:[
 {q:"어떤 오피스 빌딩의 순영업소득(NOI)이 연 8억원이고, 해당 시장의 자본환원율(Cap Rate)이 5%일 때 수익환원법(직접환원법)에 의한 부동산의 가치는?",

 {q:"부동산투자회사법상 부동산투자회사(REITs)에 대한 설명으로 옳지 않은 것은?",

{unit:"대안투자", items:[
 {q:"헤지펀드의 주요 운용전략에 대한 설명으로 옳지 않은 것은?",
  c:["Equity Long/Short는 저평가 종목을 매수하고 고평가 종목을 공매도하는 전략이다.",
     "Merger Arbitrage는 인수합병 발표 후 대상기업 주가와 인수가격의 괴리를 이용하는 이벤트 드리븐 전략이다.",
     "Global Macro는 거시경제 전망에 근거해 국가·자산군을 넘나드는 하향식(top-down) 전략이다.",
     "Convertible Arbitrage는 전환사채를 공매도하고 해당 기업의 주식을 매수하는 전략이다."],
  a:3,
  e:["가장 대표적인 주식형 전략으로, 시장 방향성 노출(net exposure)을 조절해 운용한다.",
     "합병 성사 여부에 베팅하는 전형적인 이벤트 드리븐 전략으로, 딜 무산 위험이 핵심 리스크다.",
     "금리·환율·원자재 등 거시변수 전망을 바탕으로 포지션을 잡는 방향성 전략이다.",
     "정답: 방향이 반대다. Convertible Arbitrage는 상대적으로 저평가된 전환사채를 매수하고, 전환 대상인 주식을 공매도하여 델타중립 포지션을 구축한 뒤 내재변동성 확대와 채권 이자를 수취하는 전략이다."],
  tip:"전략을 세 묶음으로 나누어 기억하자. ① 방향성(Directional): Global Macro, Long/Short Equity, Managed Futures(CTA) ② 차익거래(Relative Value): Convertible Arbitrage, Fixed Income Arbitrage, Equity Market Neutral ③ 이벤트 드리븐: Merger Arbitrage, Distressed Securities. 차익거래 전략은 평소 수익이 안정적이지만 유동성 위기 시 큰 손실이 나는 '계단 오르고 엘리베이터 타고 내려오는' 손익 구조를 보인다."},
 {q:"사회기반시설(SOC) 민간투자사업 방식인 BTO와 BTL에 대한 설명으로 옳지 않은 것은?",
  c:["BTO는 사업시행자가 시설을 운영하며 이용자 수요위험을 부담한다.",
     "BTL은 정부가 시설을 임차하고 약정된 임대료를 지급하므로 현금흐름이 안정적이다.",
     "BTL은 BTO에 비해 기대수익률과 수익의 변동성이 모두 더 크다.",
     "BTO는 도로·항만·터널 등에, BTL은 학교·기숙사·군 주거시설 등에 주로 적용된다."],
  a:2,
  e:["Build-Transfer-Operate로, 준공과 동시에 소유권을 국가에 이전하고 사업시행자가 일정기간 운영권을 갖는다. 통행료 등 이용자 요금으로 회수하므로 수요 예측이 빗나가면 손실이 난다.",
     "Build-Transfer-Lease로, 정부가 임대료를 지급하기 때문에 사실상 정부 신용에 기반한 안정적 현금흐름이 발생한다.",
     "정답: 반대다. BTL은 수요위험을 정부가 부담하므로 위험이 낮고, 그에 따라 기대수익률과 변동성도 BTO보다 낮다. 위험과 수익의 비례 관계를 그대로 적용하면 된다.",
     "시설 이용료를 받아 투자비를 회수할 수 있는지 여부에 따라 적용 방식이 나뉜다."],
  tip:"인프라 투자는 ① 장기·대규모 자금이 투입되고 ② 물가연동 수익구조가 많아 인플레이션 헤지 기능이 있으며 ③ 전통자산과 상관관계가 낮다는 점에서 연기금이 선호한다. BTO의 수요위험을 완화하기 위해 과거에는 최소운영수입보장(MRG)이 있었으나 재정부담으로 폐지되었고, 현재는 위험분담형(BTO-rs)·손익공유형(BTO-a) 방식이 활용된다."}
]},
{unit:"해외증권", items:[
 {q:"해외자산 투자에 따른 환위험 관리에 대한 설명으로 옳지 않은 것은?",
  c:["환헤지 비율을 100%로 설정하는 것은 환율변동이 수익률에 미치는 영향을 제거하는 것을 목표로 한다.",
     "해외자산을 보유한 투자자는 통상 선물환 매도를 통해 환위험을 헤지한다.",
     "원화가 강세(환율 하락)가 되면 해외자산의 원화환산 수익률은 하락한다.",
     "해외채권은 해외주식에 비해 환헤지의 필요성이 낮다."],
  a:3,
  e:["헤지비율 100%는 환노출을 제거하려는 것이나, 실제로는 자산가치 변동에 따라 헤지 과부족이 생겨 완전 제거는 어렵다.",
     "미래에 외화를 받게 되므로 그 외화를 미리 파는 선물환 매도 포지션을 취한다.",
     "예컨대 달러자산의 달러 기준 수익률이 그대로여도 환율이 1,400원에서 1,300원으로 내리면 원화환산 수익은 줄어든다.",
     "정답: 반대다. 해외채권은 자산 자체의 기대수익률과 변동성이 낮아 전체 위험에서 환율변동이 차지하는 비중이 매우 크다. 따라서 해외주식보다 환헤지의 필요성이 오히려 더 높으며, 실무에서도 해외채권은 헤지형, 해외주식은 언헤지 또는 부분헤지로 운용하는 경우가 많다."],
  tip:"헤지 비용은 양국 금리차에서 나온다. 이자율평형이론(IRP)에 따라 선물환율은 '현물환율 × (1+자국금리)/(1+외국금리)'로 결정되므로, 외국금리가 자국금리보다 높으면 선물환 디스카운트가 발생해 헤지 시 비용(음의 캐리)이 든다. 반대의 경우에는 헤지 프리미엄 수익이 발생한다."},
 {q:"국제 분산투자에 대한 설명으로 옳지 않은 것은?",
  c:["국가 간 주식시장의 상관계수가 낮을수록 분산투자 효과는 커진다.",
     "글로벌 금융위기와 같은 극단적 상황에서는 국가 간 상관계수가 동반 상승해 분산효과가 축소된다.",
     "ADR(American Depositary Receipt)은 미국 시장에서 거래되는 외국주식의 예탁증서이다.",
     "세계 자본시장의 통합이 진전될수록 국제 분산투자의 효과는 더욱 커진다."],
  a:3,
  e:["상관계수가 낮은 자산을 결합할수록 포트폴리오 전체의 위험이 줄어든다는 것이 분산투자의 기본 원리다.",
     "위기 시 모든 시장이 함께 하락하는 현상을 전염효과(contagion)라 하며, 정작 분산이 필요한 순간에 효과가 약해지는 역설이 나타난다.",
     "원주는 현지에 보관하고 그 대체증서를 미국 시장에서 거래하는 방식으로, 환전·결제 절차 없이 외국주식에 투자할 수 있다.",
     "정답: 시장통합이 진전되면 국가 간 자본이동이 자유로워져 시장 간 동조화가 심화되고 상관계수가 높아진다. 그 결과 국제 분산투자의 효과는 오히려 축소된다. 이 때문에 최근에는 국가별 분산보다 산업·스타일·자산군 분산이 강조된다."],
  tip:"국제투자 수익률은 '현지통화 기준 수익률 + 환율변동률 + 두 항의 교차항'으로 분해된다. 여기에 국가별 정치·제도 리스크인 국가위험(country risk), 자금 회수를 제한하는 송금위험, 시장 유동성이 낮은 신흥국 특유의 유동성위험이 더해진다는 점을 함께 정리해 두자."}
]},
{unit:"투자분석", items:[
 {q:"무위험이자율이 3%, 시장포트폴리오의 기대수익률이 9%, 어떤 주식의 베타가 1.5일 때 CAPM에 의한 이 주식의 요구수익률은?",
  c:["9.0%","10.5%","12.0%","13.5%"],
  a:2,
  e:["9.0%는 시장포트폴리오의 기대수익률 그 자체로, 베타가 1일 때의 값이다.",
     "10.5%는 시장위험프리미엄을 잘못 계산한 값이다.",
     "정답: E(R) = Rf + β × [E(Rm) − Rf] = 3% + 1.5 × (9% − 3%) = 3% + 9% = 12.0%이다.",
     "13.5%는 무위험이자율을 더하지 않고 1.5 × 9%로 계산한 오답이다."],
  tip:"시장위험프리미엄은 E(Rm) − Rf이지 E(Rm)이 아니라는 점이 가장 흔한 실수다. CAPM의 그래프인 증권시장선(SML)은 x축이 베타(체계적 위험)이고, 자본시장선(CML)은 x축이 표준편차(총위험)라는 차이를 함께 기억하자. SML 위에 있는 주식은 요구수익률보다 기대수익률이 높은 저평가(양의 알파) 상태다."},
 {q:"자기자본이익률(ROE)을 듀폰(Du Pont) 분석으로 분해할 때, 그 구성요소에 해당하지 않는 것은?",
  c:["매출액순이익률(당기순이익 ÷ 매출액)","총자산회전율(매출액 ÷ 총자산)","재무레버리지(총자산 ÷ 자기자본)","이자보상배율(영업이익 ÷ 이자비용)"],
  a:3,
  e:["수익성을 나타내는 항목으로, 제품의 마진 구조를 보여준다.",
     "활동성(효율성)을 나타내는 항목으로, 자산을 얼마나 효율적으로 굴렸는지를 보여준다.",
     "안전성(레버리지)을 나타내는 항목으로, 자기자본승수라고도 한다.",
     "정답: 이자보상배율은 기업의 이자지급 능력을 보는 안전성 지표이지 ROE 분해식의 구성요소가 아니다."],
  tip:"ROE = 매출액순이익률 × 총자산회전율 × 재무레버리지 (= 수익성 × 활동성 × 안전성). 앞의 두 항목을 곱하면 ROA(총자산이익률)가 되므로 ROE = ROA × 재무레버리지로도 쓸 수 있다. 같은 ROE라도 레버리지를 키워 만든 것인지 마진으로 만든 것인지에 따라 질이 다르다는 점이 이 분해의 실무적 의의다."}
]},
{unit:"리스크관리", items:[
 {q:"어떤 포트폴리오의 1일 VaR(신뢰수준 99%)가 10억원으로 측정되었다. 이에 대한 설명으로 옳지 않은 것은?",
  c:["향후 1일 동안 손실이 10억원을 초과할 확률이 1%라는 의미이다.",
     "다른 조건이 같다면 보유기간 10일 기준 VaR는 대략 10억원의 √10배로 환산된다.",
     "VaR는 정상적인 시장상황을 전제하므로 극단적 상황은 스트레스 테스트로 보완해야 한다.",
     "VaR는 어떤 경우에도 하위가산성(subadditivity)을 만족하는 일관성 있는 위험측정치이다."],
  a:3,
  e:["VaR의 정의 그 자체다. 신뢰수준 99%는 100일 중 1일 정도는 VaR를 초과하는 손실이 날 수 있다는 뜻이다.",
     "수익률이 독립적이고 동일한 분포를 따른다고 가정하면 VaR는 보유기간의 제곱근에 비례한다(제곱근 법칙).",
     "VaR는 평상시 분포를 기준으로 하므로 꼬리위험(tail risk)을 충분히 반영하지 못한다. 위기 시나리오를 가정한 스트레스 테스트가 보완수단이다.",
     "정답: VaR는 분포가 정규분포가 아닐 경우 두 포트폴리오를 합친 VaR가 각각의 VaR 합보다 커질 수 있어, 하위가산성을 항상 만족하지는 않는다. 즉 일관적 위험측정치(coherent risk measure)가 아니다. 이 결함을 보완한 것이 기대손실(ES, Expected Shortfall / CVaR)이다."],
  tip:"VaR의 세 가지 측정 방법을 구분하자. ① 분산-공분산법(델타-노말): 계산이 간단하나 정규분포를 가정해 옵션 등 비선형 상품에 부적합 ② 역사적 시뮬레이션: 과거 자료를 그대로 사용해 분포 가정이 불필요하나 과거에 없던 사건은 반영 못함 ③ 몬테카를로 시뮬레이션: 가장 정교하나 계산비용이 크다. VaR의 사후검증은 백테스팅으로 수행한다."},
 {q:"신용위험 측정의 주요 구성요소에 대한 설명으로 옳지 않은 것은?",
  c:["PD(Probability of Default)는 일정 기간 내 차주가 부도날 확률이다.",
     "LGD(Loss Given Default)는 부도가 발생했을 때 회수하지 못하는 손실률이다.",
     "EAD(Exposure At Default)는 부도 시점의 익스포저 금액이다.",
     "PD × LGD × EAD로 산출되는 값을 비예상손실(UL)이라 하며, 자기자본으로 대비한다."],
  a:3,
  e:["신용등급 산정의 출발점이며, 경기침체기에 상승한다.",
     "LGD = 1 − 회수율이다. 담보가 충실할수록 LGD는 낮아진다.",
     "한도대출처럼 미인출 약정이 있으면 부도 시점에 잔액이 늘어나는 경향이 있어 신용환산율(CCF)을 반영한다.",
     "정답: PD × LGD × EAD는 평균적으로 예상되는 손실인 예상손실(EL, Expected Loss)이다. 예상손실은 대손충당금으로 적립하여 대비하고, 예상손실을 넘어서는 변동분인 비예상손실(UL)을 자기자본으로 대비한다."],
  tip:"'예상손실 = 충당금(비용), 비예상손실 = 자기자본'이라는 대응이 바젤 규제의 기본 철학이다. 극단손실(CL, Catastrophic Loss)은 자기자본으로도 감당이 안 되는 영역으로 스트레스 테스트의 대상이 된다. 신용위험 경감기법으로는 담보·보증·상계(netting)·신용파생상품(CDS) 등이 있다."}
]},
{unit:"직무윤리", items:[
 {q:"자본시장법상 투자권유 규제에 관한 설명으로 옳지 않은 것은?",
  c:["적합성 원칙에 따라 투자자의 투자목적·재산상황·투자경험에 비추어 부적합한 투자권유를 해서는 안 된다.",
     "적정성 원칙은 파생상품 등 고위험 상품에 대해, 투자권유를 하지 않는 경우에도 적용된다.",
     "설명의무를 위반하여 투자자에게 손해를 끼친 경우 금융투자업자는 손해배상책임을 진다.",
     "투자자가 원하기만 하면 요청하지 않은 투자권유(불초청 권유)는 모든 금융투자상품에 대해 허용된다."],
  a:3,
  e:["고객의 정보를 파악(Know Your Customer Rule)한 뒤 그에 적합한 상품만 권유해야 한다.",
     "적정성 원칙은 고객이 스스로 찾아와 고위험 상품에 가입하려는 경우에도 부적정하다는 사실을 알리도록 한 장치다.",
     "금융소비자보호법상 설명의무 위반 시 손해액 추정 규정이 적용되어 입증책임이 금융회사로 전환된다.",
     "정답: 불초청 권유는 투자자의 요청이 없는데도 방문·전화 등으로 권유하는 행위로, 장외파생상품 등에 대해서는 원칙적으로 금지된다. 또한 거부의사를 표시한 투자자에게 다시 권유하는 재권유도 원칙적으로 금지된다(단, 1개월 경과 후 또는 다른 종류의 상품 권유는 예외)."],
  tip:"금융소비자보호법의 6대 판매원칙을 묶어서 외우자. ① 적합성 원칙 ② 적정성 원칙 ③ 설명의무 ④ 불공정영업행위 금지 ⑤ 부당권유행위 금지 ⑥ 광고 규제. 위반 시 위법계약해지권, 청약철회권, 과징금(수입의 50%까지) 등이 적용된다."},
 {q:"금융투자업자의 이해상충 관리에 대한 설명으로 옳지 않은 것은?",
  c:["이해상충 가능성을 파악·평가하고 공시(Disclosure) → 저감(Control) → 회피(Avoid)의 단계로 관리한다.",
     "사내 정보교류 차단장치(Chinese Wall)를 통해 부서 간 미공개중요정보의 이동을 막아야 한다.",
     "이해상충 가능성을 투자자 보호에 문제가 없는 수준까지 낮추는 것이 곤란하다면 그 거래를 해서는 안 된다.",
     "고객의 대량 주문 정보를 이용한 선행매매(front running)는 사전에 고객에게 알리고 동의를 받으면 허용된다."],
  a:3,
  e:["먼저 알리고, 낮출 수 있으면 낮추어 거래하며, 그래도 안 되면 거래 자체를 포기하는 순서다.",
     "고유재산 운용부서와 투자권유·자산운용 부서 간 정보·인력·공간을 분리하는 것이 핵심이다.",
     "공시·저감으로 해결되지 않으면 최종적으로 거래를 단념해야 한다는 것이 법의 태도다.",
     "정답: 선행매매는 고객의 주문 정보를 이용해 자기계산으로 먼저 거래하여 이익을 얻는 행위로, 동의 여부와 무관하게 자본시장법상 금지되는 불건전 영업행위다. 고객 동의로 정당화될 수 없다."],
  tip:"대표적 불건전 영업행위를 함께 정리하자. 선행매매(front running), 스캘핑(조사분석자료 공표 전후 매매), 과당매매(churning, 수수료 목적의 빈번한 회전매매), 통정매매·가장매매, 손실보전 및 이익보장 약속. 특히 손실보전 약속은 사후에 하더라도 금지되며, 이는 자본시장의 자기책임 원칙에 근거한다."}
]},
{unit:"법규", items:[
 {q:"자본시장법상 금융투자업의 분류에 해당하지 않는 것은?",
  c:["투자매매업","투자중개업","투자일임업","자산보관·관리업"],
  a:3,
  e:["자기의 계산으로 금융투자상품을 매도·매수하거나 증권을 발행·인수하는 업이다.",
     "타인의 계산으로 금융투자상품의 매매를 중개·주선하거나 대리하는 업이다.",
     "투자자로부터 운용권한을 위임받아 투자자별로 재산을 운용하는 업이다.",
     "정답: 자산보관·관리업은 신탁업자가 수행하는 업무의 내용일 뿐 자본시장법상 금융투자업의 독립된 분류가 아니다. 금융투자업은 투자매매업·투자중개업·집합투자업·투자자문업·투자일임업·신탁업의 6가지로 구분된다."],
  tip:"6대 금융투자업을 '매·중·집·자·일·신'으로 외우면 편하다. 인가 대상은 투자자 재산을 직접 취급하는 투자매매업·투자중개업·집합투자업·신탁업이고, 등록 대상은 투자자문업·투자일임업이다. 금융투자상품은 원본손실 가능성(투자성)을 기준으로 정의되며, 원본 초과손실 가능성이 있으면 파생상품, 없으면 증권으로 나뉜다."},
 {q:"집합투자기구의 종류에 대한 설명으로 옳지 않은 것은?",
  c:["환매금지형(폐쇄형)은 존속기간을 정한 집합투자기구에 대해서만 설정·설립할 수 있다.",
     "종류형(멀티클래스)은 판매보수·판매수수료의 차이에 따라 여러 종류의 집합투자증권을 발행한다.",
     "전환형은 복수의 집합투자기구 간에 투자자가 환매수수료 없이 전환할 수 있는 구조다.",
     "모자형에서 투자자는 모(母)집합투자기구에 직접 투자하고, 모펀드가 자(子)펀드에 재투자한다."],
  a:3,
  e:["환매를 허용하지 않으므로 투자자의 자금회수 시점을 명확히 하기 위해 존속기간을 정해야 하며, 설정 후 90일 이내에 상장의무가 있다.",
     "클래스별로 보수 체계만 다를 뿐 운용은 하나의 자산으로 통합되어 이루어진다.",
     "이른바 엄브렐러 펀드로, 시장 상황에 따라 주식형↔채권형 등으로 갈아탈 수 있다.",
     "정답: 관계가 반대다. 투자자는 자(子)집합투자기구에 투자하고, 자펀드가 모아진 자금을 모(母)집합투자기구에 투자하여 모펀드가 실제로 자산을 운용한다. 운용의 효율화와 비용 절감이 목적이다."],
  tip:"투자대상에 따른 5가지 분류도 함께 정리하자. 증권(집합투자재산의 50% 초과를 증권에), 부동산, 특별자산, 혼합자산(비율 제한 없음), 단기금융(MMF, 증권에만 투자하며 부동산·파생상품 편입 불가). 환매금지형으로 반드시 설정해야 하는 것은 부동산·특별자산·혼합자산 펀드다."}
]},
{unit:"주식", items:[
 {q:"어떤 기업의 내년도 예상 배당금이 주당 2,000원, 투자자의 요구수익률이 10%, 배당의 영구 성장률이 4%로 기대될 때 정률성장 배당할인모형(Gordon Model)에 의한 이 주식의 이론가격은?",
  c:["20,000원","25,000원","33,333원","50,000원"],
  a:2,
  e:["20,000원은 성장률을 반영하지 않고 2,000 ÷ 0.10으로 계산한 값이다.",
     "25,000원은 어느 계산식에도 해당하지 않는다.",
     "정답: P₀ = D₁ ÷ (k − g) = 2,000 ÷ (0.10 − 0.04) = 2,000 ÷ 0.06 ≒ 33,333원이다.",
     "50,000원은 분모를 0.04로 잘못 적용한 값이다."],
  tip:"이 모형은 ① 성장률 g가 요구수익률 k보다 작아야 하고 ② g가 영구히 일정해야 한다는 두 가지 전제 위에서 성립한다. 분자는 이미 지급된 D₀가 아니라 '내년 배당' D₁이므로, 문제에서 D₀를 줬다면 D₁ = D₀ × (1+g)로 바꾸어야 한다. 또한 g = 유보율 × ROE(사내유보를 통한 지속가능성장률)라는 관계도 함께 출제된다."},
 {q:"주가수익비율(PER)에 대한 설명으로 옳지 않은 것은?",
  c:["PER은 주가를 주당순이익(EPS)으로 나눈 값으로, 이익 1원에 대해 시장이 지불하는 가격을 뜻한다.",
     "다른 조건이 같다면 이익 성장률이 높을 것으로 기대되는 기업일수록 PER은 높게 형성된다.",
     "다른 조건이 같다면 투자자의 요구수익률(위험)이 높을수록 PER은 낮아진다.",
     "적자기업이나 이익 변동성이 큰 기업의 가치평가에도 안정적으로 적용할 수 있는 지표이다."],
  a:3,
  e:["PER = 주가 ÷ EPS이며, 역수인 1/PER은 이익수익률(earnings yield)로 해석된다.",
     "정률성장모형을 변형하면 PER = 배당성향 ÷ (k − g)이므로 g가 커질수록 PER은 커진다.",
     "같은 식에서 k가 커지면 분모가 커져 PER은 작아진다. 위험이 높으면 같은 이익에도 낮은 배수를 준다는 뜻이다.",
     "정답: EPS가 음수이면 PER 자체가 산출되지 않거나 의미를 잃고, 이익 변동성이 크면 배수가 요동친다. 이런 기업에는 PBR·PSR·EV/EBITDA 등 대체 지표를 사용한다."],
  tip:"상대가치 지표의 쓰임새를 구분하자. PBR은 자산가치 기반이어서 적자기업·금융업에 유용하고(PBR = PER × ROE의 관계), PSR은 매출은 있으나 이익이 없는 성장기업에, EV/EBITDA는 감가상각비 규모와 자본구조가 다른 기업 간 비교나 M&A 평가에 적합하다."}
]},
{unit:"채권", items:[
 {q:"어떤 채권의 수정듀레이션이 4.5이다. 시장 만기수익률이 0.2%p 상승할 때 이 채권 가격의 변동률은 약 얼마인가? (볼록성은 고려하지 않음)",
  c:["약 −0.45%","약 −0.90%","약 −2.25%","약 +0.90%"],
  a:1,
  e:["−0.45%는 듀레이션을 2.25로 적용한 값이다.",
     "정답: 가격변동률 ≒ −수정듀레이션 × 수익률변동폭 = −4.5 × 0.2% = −0.90%이다.",
     "−2.25%는 수익률 변동폭을 0.5%p로 잘못 적용한 값이다.",
     "금리가 상승하면 채권가격은 하락하므로 부호가 양(+)일 수 없다."],
  tip:"수정듀레이션(MD) = 맥컬레이듀레이션 ÷ (1 + y)이며, 가격변동률 ≒ −MD × Δy로 1차 근사한다. 금리 변동폭이 클 때는 볼록성(convexity)을 더해 ΔP/P ≒ −MD×Δy + ½×Convexity×(Δy)²로 보정한다. 볼록성 때문에 실제 가격곡선은 접선보다 위에 있어, 금리 하락 시 이익은 추정보다 크고 금리 상승 시 손실은 추정보다 작다."},
 {q:"채권의 가격 및 듀레이션 특성에 대한 설명으로 옳지 않은 것은?",
  c:["다른 조건이 같다면 표면금리가 낮은 채권일수록 듀레이션이 길다.",
     "다른 조건이 같다면 잔존만기가 길수록 듀레이션이 길다.",
     "볼록성 때문에 금리 하락 시 실제 가격 상승폭은 듀레이션으로 추정한 값보다 크다.",
     "수의상환채권(callable bond)은 투자자에게 유리한 권리가 붙어 있어 일반채권보다 높은 가격에 거래된다."],
  a:3,
  e:["표면금리가 낮으면 현금흐름이 만기에 몰리므로 가중평균 회수기간이 길어진다. 이표가 없는 할인채의 듀레이션은 잔존만기와 같다.",
     "먼 미래 현금흐름의 비중이 커지므로 듀레이션은 길어진다(다만 만기 증가에 따른 듀레이션 증가폭은 체감한다).",
     "가격-수익률 곡선이 원점에 대해 볼록하기 때문이며, 볼록성이 큰 채권이 투자자에게 유리하다.",
     "정답: 수의상환권(콜옵션)은 금리가 하락할 때 발행자가 채권을 조기상환할 수 있는 권리이므로 발행자에게 유리하다. 투자자는 그 대가를 요구하므로 수의상환채권은 일반채권보다 낮은 가격(높은 수익률)에 거래된다. 반대로 상환청구권부채권(puttable bond)은 투자자에게 유리하여 더 높은 가격에 거래된다."],
  tip:"수의상환채권은 금리가 하락해도 조기상환 가능성 때문에 가격 상승이 제한되는 음(−)의 볼록성이 나타난다. 채권운용 전략도 함께 정리하자. 적극적 전략에는 수익률예측(금리 하락 예상 시 듀레이션 확대), 채권교체, 수익률곡선타기(rolling down)가 있고, 소극적 전략에는 만기보유, 사다리형·바벨형 포트폴리오, 부채와 듀레이션을 맞추는 면역전략(immunization), 인덱싱이 있다."}
]},
{unit:"파생상품", items:[
 {q:"현재 주가지수가 300p, 무위험이자율이 연 4%, 지수 배당수익률이 연 1%, 잔존만기가 6개월인 주가지수선물의 이론가격은? (단순이자 방식으로 계산)",
  c:["301.5p","303.0p","304.5p","306.0p"],
  a:2,
  e:["301.5p는 보유비용을 1%만 반영한 값이다.",
     "303.0p는 배당수익률을 차감하지 않고 계산한 기간 조정 오류다.",
     "정답: F = S × [1 + (r − d) × t] = 300 × [1 + (0.04 − 0.01) × 0.5] = 300 × 1.015 = 304.5p이다.",
     "306.0p는 잔존만기를 1년으로 적용한 값이다."],
  tip:"선물 이론가격은 보유비용모형(cost-of-carry)에 따른다. 순보유비용(= 이자비용 − 배당수익)이 양(+)이면 선물이 현물보다 비싼 콘탱고, 음(−)이면 백워데이션이 나타난다. 시장선물가격이 이론가격보다 높으면 선물 매도 + 현물 매수의 매수차익거래(cash-and-carry), 반대면 매도차익거래(reverse cash-and-carry) 기회가 생긴다."},
 {q:"옵션의 민감도 지표(그릭 문자)에 대한 설명으로 옳지 않은 것은?",
  c:["델타(Delta)는 기초자산 가격이 1단위 변할 때 옵션가격의 변화분으로, 콜옵션은 0~1, 풋옵션은 −1~0의 값을 갖는다.",
     "감마(Gamma)는 델타의 변화율로, 등가격(ATM)이면서 만기에 근접할수록 커진다.",
     "세타(Theta)는 시간 경과에 따른 옵션가치의 감소를 나타내며, 옵션 매수자에게는 불리하게 작용한다.",
     "베가(Vega)는 변동성 변화에 대한 민감도로, 콜옵션은 양(+)의 값을, 풋옵션은 음(−)의 값을 갖는다."],
  a:3,
  e:["델타는 그 옵션이 내가격으로 끝날 대략적인 확률로도 해석되며, 헤지비율로 사용된다.",
     "감마가 크다는 것은 델타가 급변한다는 뜻이므로, 델타헤지를 자주 조정해야 한다.",
     "옵션의 시간가치는 만기에 가까울수록 빠르게 소멸하며, 매도자에게는 유리하게 작용한다.",
     "정답: 변동성이 커지면 기초자산이 크게 움직여 큰 이익을 볼 가능성이 커지는데, 손실은 프리미엄으로 한정되므로 콜·풋 모두 가치가 상승한다. 따라서 베가는 콜옵션과 풋옵션 모두 양(+)의 값을 갖는다."],
  tip:"옵션가격 결정요인별 방향을 표로 정리하자. 기초자산가격↑ → 콜↑·풋↓, 행사가격↑ → 콜↓·풋↑, 변동성↑ → 콜↑·풋↑, 잔존기간↑ → 콜↑·풋↑(미국형 기준), 무위험이자율↑ → 콜↑·풋↓. 변동성과 잔존기간만 콜과 풋이 같은 방향으로 움직인다는 점이 핵심이다."}
]},
{unit:"성과분석", items:[
 {q:"어떤 펀드의 연간 수익률이 12%, 무위험이자율이 2%, 수익률의 표준편차가 20%일 때 이 펀드의 샤프지수(Sharpe Ratio)는?",
  c:["0.4","0.5","0.6","0.7"],
  a:1,
  e:["0.4는 초과수익률을 8%로 잘못 계산한 값이다.",

     "0.6은 무위험이자율을 차감하지 않고 계산하는 과정에서 나온 오답이다.",

  tip:"위험조정성과지표의 분모를 구분해서 외우자. 샤프지수는 총위험(표준편차), 트레이너지수는 체계적위험(베타), 정보비율은 추적오차(tracking error)로 나눈다. 젠센의 알파만 나눗셈 없는 절대 수익률 지표다. 잘 분산된 포트폴리오의 일부로 평가할 때는 트레이너지수가, 자산 전부를 그 펀드에 넣는 경우에는 샤프지수가 적절하다."},
 {q:"시간가중수익률(TWR)과 금액가중수익률(MWR)에 대한 설명으로 옳지 않은 것은?",
  c:["시간가중수익률은 자금의 유출입 시점과 규모의 영향을 배제하므로 운용자의 운용능력 평가에 적합하다.",
     "금액가중수익률은 투자로 인한 현금흐름의 현재가치와 투자금액을 일치시키는 내부수익률(IRR) 개념이다.",
     "국제투자성과기준(GIPS)에서는 원칙적으로 시간가중수익률로 성과를 산출하도록 하고 있다.",
     "금액가중수익률은 투자자가 자금을 넣고 빼는 시점의 영향을 받지 않으므로 펀드 간 비교에 더 유용하다."],
  a:3,
  e:["기간별 수익률을 기하평균으로 연결(chain-linking)하므로 외부 현금흐름의 영향이 제거된다.",
     "투자자가 실제로 체감한 수익률이어서 투자자 관점의 성과 평가에 적합하다.",
     "운용사의 능력을 공정하게 비교하기 위한 기준이므로 시간가중수익률을 원칙으로 한다.",
     "정답: 정반대다. 금액가중수익률은 자금 유출입의 시점과 규모에 따라 값이 크게 달라지는데, 자금 유출입은 운용자가 통제할 수 없는 변수다. 따라서 펀드 간 비교나 운용자 평가에는 부적합하며, 그 목적에는 시간가중수익률이 사용된다."],
  tip:"두 지표는 '누구를 평가하는가'에 따라 갈린다. 운용자 평가 → TWR, 투자자 본인의 실제 성과 → MWR. 예컨대 펀드가 상승한 뒤 투자자가 대규모로 추가 납입했다가 하락했다면, TWR은 양(+)인데 MWR은 음(−)이 될 수 있다. 벤치마크는 사전에 정해지고(specified in advance), 측정가능하며, 투자가능한 자산으로 구성되어야 한다는 요건도 함께 출제된다."}
]}
];

const LB=["①","②","③","④"];
let idx=0, done=0, ok=0, total=0;
const root=document.getElementById('root');

DATA.forEach(function(u){
  const sec=document.createElement('section');
  sec.className='unit';
  sec.innerHTML='<div class="unit-head"><h2>'+u.unit+' <small>('+u.items.length+'문항)</small></h2></div>';
  u.items.forEach(function(it){
    idx++; total++;
    const n=idx;
    const div=document.createElement('div');
    div.className='q';
    let html='<p class="q-title"><span class="num">Q'+n+'</span>'+it.q+'</p><ul class="choices" id="ch'+n+'">';
    it.c.forEach(function(c,i){ html+='<li data-i="'+i+'">'+LB[i]+' '+c+'</li>'; });
    html+='</ul><button class="btn" id="bt'+n+'">정답 보기</button>';
    html+='<div class="ans-box" id="ab'+n+'"><div class="verdict" id="vd'+n+'"></div>'+
          '<div class="ans-line">정답: '+LB[it.a]+' '+it.c[it.a]+'</div><div class="exp"><div class="each">';
    it.e.forEach(function(e,i){ html+='<div><b>'+LB[i]+'</b> '+e+'</div>'; });
    html+='</div></div>';
    if(it.tip) html+='<div class="tip"><b>📚 심화 학습 · 관련 자료</b>'+it.tip+'</div>';
    html+='</div>';
    div.innerHTML=html;
    sec.appendChild(div);

    setTimeout(function(){
      const ul=document.getElementById('ch'+n), box=document.getElementById('ab'+n),
            vd=document.getElementById('vd'+n), bt=document.getElementById('bt'+n);
      let answered=false;
      function reveal(sel){
        box.classList.add('show');
        Array.prototype.forEach.call(ul.children,function(li){
          const i=+li.dataset.i;
          li.classList.add('locked');
          if(i===it.a) li.classList.add('correct');
          if(sel!==null && i===sel && i!==it.a) li.classList.add('wrong');
          if(i===it.a && !li.querySelector('.mark')) li.insertAdjacentHTML('afterbegin','<span class="mark">✔ 정답</span>');
          if(sel!==null && i===sel && i!==it.a) li.insertAdjacentHTML('afterbegin','<span class="mark">✘ 선택</span>');
        });
        if(sel===null){ vd.textContent='정답과 해설을 확인하세요.'; vd.className='verdict'; }
        else if(sel===it.a){ vd.textContent='⭕ 정답입니다!'; vd.className='verdict ok'; }
        else { vd.textContent='❌ 오답입니다. (선택: '+LB[sel]+' / 정답: '+LB[it.a]+')'; vd.className='verdict no'; }
        bt.textContent='해설 접기';
      }
      Array.prototype.forEach.call(ul.children,function(li){
        li.addEventListener('click',function(){
          if(answered) return;
          answered=true;
          const sel=+li.dataset.i;
          done++; if(sel===it.a) ok++;
          upd(); reveal(sel);
        });
      });
      bt.addEventListener('click',function(){
        if(box.classList.contains('show')){ box.classList.remove('show'); bt.textContent='정답 보기'; return; }
        if(!answered){ answered=true; done++; upd(); reveal(null); }
        else { box.classList.add('show'); bt.textContent='해설 접기'; }
      });
    },0);
  });
  root.appendChild(sec);
});

function upd(){
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-rate').textContent=(done?Math.round(ok/done*100):0)+'%';
}
document.getElementById('s-total').textContent=total;

(function(){
  const d=new Date();
  const p=function(x){return String(x).padStart(2,'0')};
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('gen').textContent='생성일시: '+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+
    ' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' ('+tz+')';
})();
</script>
</body>
</html>
