<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>투자자산운용사 문제은행 2026-09-13</title>
<style>
  :root{
    --bg:#f6f8fb; --card:#ffffff; --line:#e2e8f0; --ink:#1e293b; --sub:#64748b;
    --brand:#1d4ed8; --brand-soft:#eff6ff; --ok:#059669; --ok-soft:#ecfdf5;
    --no:#dc2626; --no-soft:#fef2f2; --warn:#b45309;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;

  .wrap{max-width:900px;margin:0 auto;padding:20px 16px 60px;}
  header.top{background:linear-gradient(135deg,#1d4ed8,#0ea5e9);color:#fff;border-radius:16px;

  header.top p{margin:2px 0;font-size:.9rem;opacity:.95;}
  .stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 24px;}
  .stat{flex:1 1 120px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;text-align:center;}
  .stat b{display:block;font-size:1.3rem;color:var(--brand);}
  .stat span{font-size:.78rem;color:var(--sub);}
  section.unit{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:0 0 8px;margin-bottom:26px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.04);}
  .unit-head{background:var(--brand-soft);border-bottom:2px solid #bfdbfe;padding:14px 18px;}
  .unit-head h2{margin:0;font-size:1.12rem;font-weight:800;color:#1e3a8a;}
  .unit-head small{color:var(--sub);font-weight:600;}
  .q{padding:18px;border-bottom:1px dashed var(--line);}
  .q:last-child{border-bottom:none;}
  .q-title{font-weight:700;margin:0 0 12px;font-size:1rem;}
  .q-title .num{display:inline-block;background:var(--brand);color:#fff;border-radius:6px;
    padding:1px 8px;font-size:.8rem;margin-right:8px;}
  ul.choices{list-style:none;margin:0;padding:0;}
  ul.choices li{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;
    cursor:pointer;background:#fbfdff;transition:.15s;font-size:.95rem;}
  ul.choices li:hover{border-color:var(--brand);background:#f0f7ff;}
  ul.choices li .mark{float:right;font-weight:800;}
  li.correct{background:var(--ok-soft);border-color:var(--ok);color:#065f46;font-weight:600;}
  li.wrong{background:var(--no-soft);border-color:var(--no);color:#991b1b;font-weight:600;}
  li.locked{cursor:default;}
  .btn{margin-top:6px;background:#fff;border:1.5px solid var(--brand);color:var(--brand);
    border-radius:9px;padding:8px 16px;font-weight:700;cursor:pointer;font-size:.9rem;}
  .btn:hover{background:var(--brand);color:#fff;}
  .ans-box{display:none;margin-top:12px;border:1.5px solid #cbd5e1;border-left:6px solid var(--brand);
    border-radius:10px;background:#f8fafc;padding:14px;}
  .ans-box.show{display:block;}
  .verdict{font-weight:800;margin-bottom:8px;font-size:.95rem;}
  .verdict.ok{color:var(--ok);} .verdict.no{color:var(--no);}
  .ans-line{font-weight:800;color:#1e3a8a;margin-bottom:8px;}
  .exp{font-size:.9rem;color:#334155;}
  .exp .each{margin-top:8px;padding-top:8px;border-top:1px dotted #cbd5e1;}
  .exp .each div{margin:3px 0;}
  .tip{margin-top:10px;background:#fffbeb;border:1px solid #fcd34d;border-left:6px solid #f59e0b;
    border-radius:10px;padding:11px 13px;font-size:.88rem;color:#7c2d12;}
  .tip b{display:block;color:#92400e;margin-bottom:4px;font-size:.86rem;}
  footer{text-align:center;color:var(--sub);font-size:.82rem;margin-top:30px;}
  @media (max-width:520px){
    .wrap{padding:14px 10px 40px;} header.top h1{font-size:1.22rem;}
    .q{padding:14px 12px;} ul.choices li{font-size:.92rem;}
  }
</style>
</head>

     "환헤지를 하면 항상 헤지하지 않은 경우보다 수익률이 높아진다."],
  a:2,
  e:["틀린 서술이다. 이자율평형이론상 고금리 통화는 선물환에서 할인(discount), 저금리 통화는 할증(premium)된다.",
     "환헤지는 환위험만 제거하며 기초자산 가격변동위험은 남는다.",
     "정답: 헤지비율이 높을수록 선물환 스프레드 비용과 만기 시 롤오버(연장) 부담, 증거금 관리 부담이 커진다.",
     "환율이 헤지 방향과 반대로 움직이면 헤지가 오히려 손실이 된다."],
  tip:"환헤지의 숨은 위험은 '오버헤지'다. 해외주식은 가격이 변동하므로 평가금액이 늘면 헤지가 부족(언더헤지), 줄면 초과(오버헤지)가 된다. 그래서 주식형은 부분헤지, 채권형은 전액헤지를 선호하는 것이 일반적이다."},
 {q:"신흥시장(Emerging Market) 투자의 위험으로 가장 거리가 먼 것은?",
  c:["정치적 불안정에 따른 국가위험(country risk)","자본송금 제한 등 자본통제 위험","거래량 부족에 따른 유동성 위험","선진국 대비 낮은 주가 변동성 위험"],
  a:3,
  e:["정권 교체·국유화 등 국가위험이 크다.",
     "이익 송금 제한·외환통제 등의 위험이 존재한다.",
     "시장 규모가 작아 유동성 위험이 크다.",
     "정답: 신흥시장은 선진시장보다 변동성이 '높다'. 낮은 변동성은 신흥시장의 위험 요인이 될 수 없다."],
  tip:"신흥시장 투자 매력은 높은 성장성과 선진시장과의 상대적으로 낮은 상관관계에 따른 분산효과다. 다만 위기 시에는 상관계수가 1에 수렴하며 동반 급락하는 경향이 있어 분산효과가 가장 필요한 국면에서 사라진다는 점이 한계다."}
]},
{unit:"투자분석", items:[
 {q:"EV/EBITDA 배수에 대한 설명으로 옳지 않은 것은?",
  c:["EV는 시가총액에 순차입금을 더하여 산출한다.",
     "감가상각 정책이나 자본구조 차이의 영향을 PER보다 덜 받는다.",
     "적자기업이나 감가상각비가 큰 장치산업 평가에 유용하다.",
     "EV/EBITDA가 높을수록 기업이 저평가된 것으로 해석한다."],
  a:3,
  e:["EV = 시가총액 + 순차입금(총차입금 - 현금성자산).",
     "EBITDA는 이자·세금·상각 전 이익이므로 회계정책과 자본구조 영향이 작다.",
     "당기순이익이 적자여도 EBITDA는 양(+)일 수 있어 평가가 가능하다.",
     "정답: 배수가 '낮을수록' 저평가로 본다. 높을수록 고평가다."],
  tip:"EV/EBITDA의 역수는 대략 투자원금 회수기간을 의미한다. 예컨대 배수 5배는 기업 인수 후 영업현금흐름으로 5년이면 인수대금을 회수한다는 의미로, M&A 실무에서 널리 쓰인다."},
 {q:"어느 기업의 당기순이익이 100억원, 발행주식수 1,000만주, 현재 주가가 20,000원이다. 이 기업의 PER은?",
  c:["10배","20배","2배","200배"],
  a:1,
  e:["10배는 EPS를 2,000원이 아닌 다른 값으로 계산한 오답이다.",
     "정답: EPS = 100억 ÷ 1,000만주 = 1,000원. PER = 20,000 ÷ 1,000 = 20배다.",
     "2배는 시가총액과 순이익의 관계를 잘못 계산한 값이다.",
     "200배는 EPS를 100원으로 잘못 본 경우다."],
  tip:"시가총액(2,000억원) ÷ 당기순이익(100억원) = 20배로 계산해도 동일하다. PER은 이익의 질을 반영하지 못하므로, 일회성 이익이 포함된 해에는 PER이 낮아 보이는 착시가 발생한다는 점에 주의해야 한다."}
]},
{unit:"리스크관리", items:[
 {q:"VaR 측정방법에 대한 설명으로 가장 적절하지 않은 것은?",
  c:["델타-노말법은 수익률의 정규분포를 가정하며 계산이 간편하다.",
     "역사적 시뮬레이션은 특정 분포를 가정하지 않고 과거 실제 자료를 사용한다.",
     "몬테카를로 시뮬레이션은 비선형 상품 평가에 적합하나 계산비용이 크다.",
     "델타-노말법은 옵션 등 비선형 상품의 위험을 정확히 측정한다."],
  a:3,
  e:["델타-노말(분산-공분산)법은 정규분포 가정하에 선형 근사로 계산한다.",
     "역사적 시뮬레이션은 과거 데이터를 그대로 재현하므로 분포 가정이 불필요하다.",
     "몬테카를로법은 유연하지만 연산 부담과 모형위험이 크다.",
     "정답: 델타-노말법은 선형 근사이므로 옵션의 감마(볼록성) 효과를 반영하지 못해 비선형 상품 측정에 부적합하다."],
  tip:"보완지표로 델타-감마 근사, 그리고 VaR을 초과하는 손실의 평균인 기대손실(ES, CVaR)이 쓰인다. 바젤 규제도 시장위험 자본규제 기준을 VaR에서 ES(97.5% 신뢰수준)로 전환했다."},
 {q:"위기상황분석(Stress Test)에 대한 설명으로 옳지 않은 것은?",
  c:["VaR이 포착하지 못하는 극단적 사건의 영향을 평가한다.",
     "역사적 시나리오와 가상 시나리오를 모두 활용할 수 있다.",
     "발생 확률을 제시하기 어렵다는 한계가 있다.",
     "정상적인 시장 상황에서의 일상적 손실 수준을 측정하는 기법이다."],
  a:3,
  e:["꼬리위험(tail risk)을 보완하는 것이 스트레스 테스트의 목적이다.",
     "1997년 외환위기, 2008년 금융위기 같은 실제 사건과 가상 충격을 모두 쓴다.",
     "확률을 부여하지 않고 '만약 ~라면'을 보는 방식이므로 확률 제시가 어렵다.",
     "정답: 정상 시장의 일상적 손실은 VaR의 영역이다. 스트레스 테스트는 비정상적·극단적 상황을 다룬다."],
  tip:"VaR과 스트레스 테스트는 보완관계다. VaR은 '평상시 99% 구간의 최대손실', 스트레스 테스트는 '그 1%의 꼬리에서 무슨 일이 벌어지는가'를 본다. 위기 시 상관계수 급등(correlation breakdown)을 시나리오에 반영하는 것이 실무의 핵심이다."}
]},
{unit:"직무윤리", items:[
 {q:"금융투자업 종사자의 '이해상충 방지의무'에 대한 설명으로 가장 적절하지 않은 것은?",
  c:["이해상충 발생 가능성을 파악·평가하고 투자자에게 미리 알려야 한다.",
     "이해상충 가능성을 낮추기 어려운 경우 거래를 해서는 안 된다.",
     "정보교류 차단장치(Chinese Wall) 구축은 이해상충 방지의 대표적 수단이다.",
     "투자자에게 이해상충 사실을 알리기만 하면 낮추지 않고 거래할 수 있다."],
  a:3,
  e:["자본시장법상 파악·평가·공시 의무가 규정되어 있다.",
     "낮출 수 없으면 거래 자체가 금지된다(거래 회피).",
     "부서 간 정보교류 차단은 필수 통제장치다.",
     "정답: 알린 후 '투자자 보호에 문제가 없는 수준으로 낮춘 뒤' 거래해야 한다. 고지만으로는 부족하다."],
  tip:"3단계 원칙으로 외우면 좋다: ①공시(Disclosure) → ②회피 수준까지 낮추기(Control) → ③불가 시 거래 포기(Avoid). 순서를 바꾸어 '고지만 하면 된다'로 제시하는 것이 전형적인 오답 유형이다."},
 {q:"금융투자회사의 준법감시인에 대한 설명으로 옳지 않은 것은?",
  c:["이사회 결의를 거쳐 임면하며 사내이사 또는 업무집행책임자 중에서 선임한다.",
     "임기는 2년 이상으로 한다.",
     "준법감시인은 영업·자산운용 업무를 겸직할 수 없다.",
     "준법감시인 해임은 이사회 출석이사 과반수 찬성으로 가능하다."],
  a:3,
  e:["사내이사 또는 업무집행책임자 중에서 이사회 결의로 임면한다.",
     "임기는 2년 이상으로 신분이 보장된다.",
     "독립성 확보를 위해 영업·운용·자산관리 등 겸직이 금지된다.",
     "정답: 해임은 이사 총수의 3분의 2 이상 찬성이라는 가중요건이 필요하다."],
  tip:"준법감시(Compliance)는 사전예방, 내부감사는 사후적발이라는 점에서 구분된다. 준법감시인의 신분보장 장치(2년 임기, 3분의 2 해임요건, 겸직금지)는 독립성 확보 목적이며 시험 단골 포인트다."}
]},
{unit:"법규", items:[
 {q:"자본시장법상 투자자문업과 투자일임업에 대한 설명으로 옳지 않은 것은?",
  c:["투자자문업은 금융투자상품의 가치나 투자판단에 관한 자문에 응하는 업이다.",
     "투자일임업은 투자자로부터 운용권한을 위임받아 재산을 운용하는 업이다.",
     "투자자문·일임업자는 계약 체결 전 서면자료를 미리 교부해야 한다.",
     "투자일임업자는 투자자의 개별성을 고려하지 않고 일괄 운용할 수 있다."],
  a:3,
  e:["자문업의 정의로 옳다.",
     "일임업의 정의로 옳다.",
     "계약 체결 권유 시 서면자료 교부 의무가 있다.",
     "정답: 투자일임은 투자자별 재산상황·투자목적을 고려한 개별 운용이 원칙이다. 일괄 운용은 집합투자에 해당할 수 있어 금지된다."],
  tip:"일임과 집합투자의 경계는 '2인 이상에게서 모은 재산을 통합 운용하는가'이다. 일임재산을 통합 운용하면 무인가 집합투자업이 된다. 다만 랩어카운트는 개별 계좌 단위로 운용된다는 점에서 일임업으로 인정된다."},
 {q:"자본시장법상 미공개중요정보 이용행위 금지에 대한 설명으로 가장 적절하지 않은 것은?",
  c:["규제 대상에는 회사 임직원뿐 아니라 주요주주, 계약체결자도 포함된다.",
     "1차 정보수령자도 규제 대상에 포함된다.",
     "정보가 공시된 후 일정한 주지기간이 경과해야 '공개된 정보'로 본다.",
     "상장법인의 임원이라면 정보 이용 여부와 무관하게 매매만으로 처벌된다."],
  a:3,
  e:["내부자 범위에는 준내부자(계약체결자·감독당국 등)도 포함된다.",
     "정보를 전달받은 1차 수령자까지 규제 대상이다.",
     "법정 주지기간(예: 전자공시 후 3시간 등)이 지나야 공개로 인정된다.",
     "정답: 미공개중요정보를 '이용'해야 성립한다. 단순 임원 신분만으로 모든 매매가 처벌되지는 않는다."],
  tip:"불공정거래 3대 유형은 ①미공개중요정보 이용 ②시세조종 ③부정거래행위다. 2015년 도입된 '시장질서 교란행위'는 2차 이상 정보수령자나 해킹 등으로 취득한 정보 이용까지 과징금으로 규율하여 사각지대를 메웠다."}
]},
{unit:"주식", items:[
 {q:"자기자본이익률(ROE)을 듀퐁(Du Pont) 분석으로 분해한 것으로 옳은 것은?",
  c:["매출액순이익률 × 총자산회전율 × 재무레버리지","매출액순이익률 × 총자산회전율 × 배당성향","영업이익률 × 유동비율 × 부채비율","총자산순이익률 × 배당성향 × 유보율"],
  a:0,
  e:["정답: ROE = (순이익/매출액) × (매출액/총자산) × (총자산/자기자본) = 수익성 × 활동성 × 안정성(레버리지)이다.",
     "배당성향은 ROE 분해 요소가 아니다.",
     "유동비율과 부채비율의 곱은 ROE로 환원되지 않는다.",
     "총자산순이익률(ROA) × 재무레버리지 = ROE이며, 배당성향·유보율은 성장률 계산 요소다."],
  tip:"ROE가 높아도 원인이 레버리지 확대라면 위험이 함께 커진 것이다. 듀퐁 분석의 목적은 'ROE 개선이 마진 때문인가, 회전율 때문인가, 빚 때문인가'를 가려내는 데 있다. 지속가능성장률 g = ROE × 유보율과 연결해서 정리하면 좋다."},
 {q:"주식시장의 매매제도에 대한 설명으로 옳지 않은 것은?",
  c:["단일가매매는 일정 시간 주문을 모아 하나의 가격으로 체결하는 방식이다.",
     "가격우선·시간우선·수량우선의 순서로 매매체결 원칙이 적용된다.",
     "서킷브레이커(CB)는 지수 급락 시 시장 전체 매매를 일시 중단하는 제도이다.",
     "시장가주문은 지정가주문보다 체결 우선순위가 낮다."],
  a:3,
  e:["시가·종가 결정 등에 단일가매매가 적용된다.",
     "체결원칙은 가격 → 시간 → 수량(→ 위탁매매 우선) 순이다.",
     "CB는 코스피/코스닥 지수가 8%·15%·20% 하락 시 단계별로 발동된다.",
     "정답: 시장가주문은 가격을 지정하지 않아 가장 유리한 가격으로 즉시 체결되므로 지정가주문보다 우선한다."],

const LB=["①","②","③","④"];
let idx=0, done=0, ok=0, total=0;
const root=document.getElementById('root');

DATA.forEach(function(u){
  const sec=document.createElement('section');
  sec.className='unit';
  sec.innerHTML='<div class="unit-head"><h2>'+u.unit+' <small>('+u.items.length+'문항)</small></h2></div>';
  u.items.forEach(function(it){
    idx++; total++;
    const n=idx;
    const div=document.createElement('div');
    div.className='q';
    let html='<p class="q-title"><span class="num">Q'+n+'</span>'+it.q+'</p><ul class="choices" id="ch'+n+'">';
    it.c.forEach(function(c,i){ html+='<li data-i="'+i+'">'+LB[i]+' '+c+'</li>'; });
    html+='</ul><button class="btn" id="bt'+n+'">정답 보기</button>';
    html+='<div class="ans-box" id="ab'+n+'"><div class="verdict" id="vd'+n+'"></div>'+
          '<div class="ans-line">정답: '+LB[it.a]+' '+it.c[it.a]+'</div><div class="exp"><div class="each">';
    it.e.forEach(function(e,i){ html+='<div><b>'+LB[i]+'</b> '+e+'</div>'; });
    html+='</div></div>';
    if(it.tip) html+='<div class="tip"><b>📚 심화 학습 · 관련 자료</b>'+it.tip+'</div>';
    html+='</div>';
    div.innerHTML=html;
    sec.appendChild(div);

    setTimeout(function(){
      const ul=document.getElementById('ch'+n), box=document.getElementById('ab'+n),
            vd=document.getElementById('vd'+n), bt=document.getElementById('bt'+n);
      let answered=false;
      function reveal(sel){
        box.classList.add('show');
        Array.prototype.forEach.call(ul.children,function(li){
          const i=+li.dataset.i;
          li.classList.add('locked');
          if(i===it.a) li.classList.add('correct');
          if(sel!==null && i===sel && i!==it.a) li.classList.add('wrong');
          if(i===it.a && !li.querySelector('.mark')) li.insertAdjacentHTML('afterbegin','<span class="mark">✔ 정답</span>');
          if(sel!==null && i===sel && i!==it.a) li.insertAdjacentHTML('afterbegin','<span class="mark">✘ 선택</span>');
        });
        if(sel===null){ vd.textContent='정답과 해설을 확인하세요.'; vd.className='verdict'; }
        else if(sel===it.a){ vd.textContent='⭕ 정답입니다!'; vd.className='verdict ok'; }
        else { vd.textContent='❌ 오답입니다. (선택: '+LB[sel]+' / 정답: '+LB[it.a]+')'; vd.className='verdict no'; }
        bt.textContent='해설 접기';
      }
      Array.prototype.forEach.call(ul.children,function(li){
        li.addEventListener('click',function(){
          if(answered) return;
          answered=true;
          const sel=+li.dataset.i;
          done++; if(sel===it.a) ok++;
          upd(); reveal(sel);
        });
      });
      bt.addEventListener('click',function(){
        if(box.classList.contains('show')){ box.classList.remove('show'); bt.textContent='정답 보기'; return; }
        if(!answered){ answered=true; done++; upd(); reveal(null); }
        else { box.classList.add('show'); bt.textContent='해설 접기'; }
      });
    },0);
  });
  root.appendChild(sec);
});

function upd(){
  document.getElementById('s-done').textContent=done;
  document.getElementById('s-ok').textContent=ok;
  document.getElementById('s-rate').textContent=(done?Math.round(ok/done*100):0)+'%';
}
document.getElementById('s-total').textContent=total;

(function(){
  const d=new Date();
  const p=function(x){return String(x).padStart(2,'0')};
  const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  document.getElementById('gen').textContent='생성일시: '+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+
    ' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+' ('+tz+')';
})();
</script>
